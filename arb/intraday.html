<!DOCTYPE html>
<meta charset="utf-8">
<title>Intraday Scalper</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ink:#202122; --dim:#54595d; --rule:#a2a9b1; --hair:#c8ccd1;
    --bg:#ffffff; --panel:#f8f9fa; --link:#3366cc;
    --up:#14866d; --down:#d33; --warn:#edab00;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
       font-variant-numeric:tabular-nums}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:28px;
     margin:0 0 2px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
  h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:20px;
     margin:28px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
  .sub{color:var(--dim);font-size:13px;margin:0 0 4px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-top:14px}
  .box{border:1px solid var(--hair);background:var(--panel);padding:10px 12px}
  .box .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .box .v{font-size:23px;margin-top:2px}
  .box .n{font-size:12px;color:var(--dim)}
  table{border-collapse:collapse;width:100%;margin-top:8px;font-size:14px}
  th,td{border:1px solid var(--hair);padding:5px 8px;text-align:right}
  th{background:var(--panel);font-weight:600;text-align:left;font-size:12px;
     letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
  td:first-child,th:first-child{text-align:left}
  .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)}
  .muted{color:var(--dim)}
  .bar{height:9px;background:#eaecf0;border:1px solid var(--hair);margin-top:6px;position:relative}
  .bar>i{display:block;height:100%;background:var(--up)}
  .pill{display:inline-block;border:1px solid var(--hair);background:#fff;
        padding:1px 7px;font-size:12px;margin-right:5px}
  .empty{color:var(--dim);font-style:italic;padding:10px 0}
  .ctlrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .btn{border:1px solid var(--hair);background:#fff;padding:6px 12px;font-size:13px;
       cursor:pointer;border-radius:2px;font-family:inherit}
  .btn:hover{background:var(--panel)}
  .btn.danger{border-color:#e6a3a3;color:#8b2020;background:#fdecec}
  .btn.danger:hover{background:#fbdada}
  .btn:disabled{opacity:.5;cursor:default}
  footer{margin-top:34px;padding-top:10px;border-top:1px solid var(--rule);
         color:var(--dim);font-size:12px}
</style>
<div class="wrap">
  <h1>Intraday Scalper</h1>
  <p class="sub" id="sub">connecting…</p>
  <p class="sub"><b>Directional trading, not arbitrage.</b> Every position here can lose money.</p>

  <div class="ctlrow" id="ctl"></div>

  <div class="grid" id="tiles"></div>

  <h2>Day against target</h2>
  <div class="bar"><i id="prog" style="width:0%"></i></div>
  <p class="sub" id="progtxt"></p>

  <h2>Open positions</h2>
  <div id="open"></div>

  <h2>Market structure</h2>
  <div id="struct"></div>

  <h2>Closed today</h2>
  <div id="trades"></div>

  <h2>Why no trade</h2>
  <div id="rejects"></div>

  <footer id="foot"></footer>
</div>
<script>
const f0 = n => (n==null||isNaN(n)) ? "–" : Number(n).toLocaleString("en-IN",{maximumFractionDigits:0});
const f2 = n => (n==null||isNaN(n)) ? "–" : Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const rs = n => (n<0?"−₹":"₹") + f0(Math.abs(n));
const cls = n => n>0 ? "up" : (n<0 ? "down" : "");
const esc = s => String(s??"").replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

let CTL_BUSY = false;
async function post(path){
  try{
    const r = await fetch(path, {method:"POST"});
    return await r.json();
  }catch(e){ return {ok:false, error:String(e)}; }
}
function controls(d){
  const el = document.getElementById("ctl");
  const live = d.mode === "live";
  el.innerHTML = `
    <button class="btn" id="btnSwitch" ${CTL_BUSY?"disabled":""}>Switch to ${live?"PAPER":"LIVE"}</button>
    <button class="btn danger" id="btnStop" ${CTL_BUSY?"disabled":""}>Stop ${live?"real ":""}trading</button>
    <button class="btn danger" id="btnExit" ${CTL_BUSY?"disabled":""}>Exit all trades</button>`;
  document.getElementById("btnSwitch").onclick = async () => {
    const verb = live ? "back to PAPER" : "to LIVE — real money";
    if(!confirm(`Switch ${verb}?\n\nThe running engine stops (squaring off first) and the other one starts.`)) return;
    CTL_BUSY = true;
    const res = await post("/api/control/switch_mode");
    CTL_BUSY = false;
    alert(res.ok ? `Switching to ${res.switching_to.toUpperCase()}…` : `Switch failed: ${res.error}`);
  };
  document.getElementById("btnStop").onclick = async () => {
    if(!confirm(`Stop ${live?"REAL ":""}trading now?\n\nThis halts new entries AND closes every open position at market.`)) return;
    CTL_BUSY = true;
    const res = await post("/api/control/stop_trading");
    CTL_BUSY = false;
    alert(res.ok ? "Trading halted; flattening open positions." : `Failed: ${res.error}`);
  };
  document.getElementById("btnExit").onclick = async () => {
    if(!confirm("Close every open position now, at market?")) return;
    CTL_BUSY = true;
    const res = await post("/api/control/exit_all");
    CTL_BUSY = false;
    alert(res.ok ? "Flattening all open positions." : `Failed: ${res.error}`);
  };
}

function tiles(d){
  const t = [
    ["Capital", "₹"+f0(d.capital), d.mode+" · "+(d.phase||"")],
    ["Day P&L", rs(d.day_pnl), (d.day_pct>=0?"+":"")+f2(d.day_pct)+"% of capital", cls(d.day_pnl)],
    ["Target", "₹"+f0(d.target_inr), d.target_pct+"% — a goal, not a cap"],
    ["Trades", d.trades, "won "+d.wins+" · lost "+d.losses],
    ["Open", d.open_positions.length, d.open_positions.length ? "managed each tick" : "flat"],
    ["To square-off", f0(d.minutes_to_close)+" min", "all flat before the bell",
      d.minutes_to_close<30 ? "warn" : ""],
  ];
  document.getElementById("tiles").innerHTML = t.map(([k,v,n,c]) =>
    `<div class="box"><div class="k">${k}</div><div class="v ${c||''}">${v}</div><div class="n">${esc(n||"")}</div></div>`).join("");
}

// With an index target the engine parks the premium target at entry x 100 so
// the index level decides the exit. That number is not a price: show the level
// it is really aiming at, and what the option should be worth there.
// index_target / target_est are live; an engine started before they existed
// only has the entry-time values in detail, so those are the fallback.
function targetCell(p){
  const d = p.detail || {};
  const lvl = p.index_target || d.index_target;
  const est = p.target_est ?? d.target_premium_est;
  if(lvl > 0){
    const ext = p.extensions ? ` <span class="muted">(extended ×${p.extensions})</span>` : "";
    const opt = p.opt === "EQ" ? "" : `<div class="muted">≈ ₹${f2(est)} option</div>`;
    return `${esc(p.underlying)} ${f2(lvl)}${ext}${opt}`;
  }
  if(p.target >= p.entry * 50) return '<span class="muted">trail only</span>';
  return f2(p.target);
}
function stopLevel(p){
  return p.index_stop > 0 && p.opt !== "EQ"
    ? `<div class="muted">${esc(p.underlying)} ${f2(p.index_stop)}</div>` : "";
}

function openTable(rows){
  const el = document.getElementById("open");
  if(!rows.length){ el.innerHTML = '<p class="empty">No position open. The engine is waiting for structure and an affordable strike to agree.</p>'; return; }
  el.innerHTML = `<table><tr><th>Contract</th><th>Qty</th><th>Entry</th><th>Mark</th>
    <th>Stop</th><th>Target</th><th>R</th><th>P&amp;L</th><th>Held</th><th>Why</th></tr>` +
    rows.map(p => `<tr>
      <td>${esc(p.symbol)}${p.trailed?' <span class="pill">breakeven</span>':''}${p.detail&&p.detail.restored?' <span class="pill" title="carried across an engine restart">restored</span>':''}</td>
      <td>${p.qty}</td><td>${f2(p.entry)}</td>
      <td class="${cls(p.pnl_points)}">${f2(p.mark)}</td>
      <td>${f2(p.stop)}${stopLevel(p)}</td><td>${targetCell(p)}</td>
      <td class="${cls(p.r)}">${f2(p.r)}R</td>
      <td class="${cls(p.pnl_inr)}">${rs(p.pnl_inr)}</td>
      <td>${Math.floor(p.held_s/60)}m</td>
      <td class="muted">${esc((p.detail&&p.detail.structure)||"")}</td></tr>`).join("") + `</table>`;
}

function structTable(s){
  const k = Object.keys(s||{});
  const el = document.getElementById("struct");
  if(!k.length){ el.innerHTML = '<p class="empty">No candles yet.</p>'; return; }
  el.innerHTML = `<table><tr><th>Index</th><th>Bias</th><th>Last event</th><th>Reading</th></tr>` +
    k.map(n => {
      const v = s[n], b = v.bias>0?"bullish":(v.bias<0?"bearish":"no bias");
      return `<tr><td>${esc(n)}</td>
        <td class="${v.bias>0?'up':(v.bias<0?'down':'muted')}">${b}</td>
        <td>${esc(v.event||"–")}</td><td class="muted">${esc(v.reason||"")}</td></tr>`;
    }).join("") + `</table>`;
}

function tradeTable(rows){
  const el = document.getElementById("trades");
  if(!rows||!rows.length){ el.innerHTML = '<p class="empty">Nothing closed yet today.</p>'; return; }
  el.innerHTML = `<table><tr><th>Contract</th><th>Entry</th><th>Exit</th><th>Reason</th>
    <th>Points</th><th>R</th><th>Cost</th><th>Net</th></tr>` +
    rows.map(t => `<tr><td>${esc(t.symbol)}</td><td>${f2(t.entry)}</td><td>${f2(t.exit)}</td>
      <td class="muted">${esc(t.exit_reason)}</td>
      <td class="${cls(t.points)}">${f2(t.points)}</td>
      <td class="${cls(t.r_multiple)}">${f2(t.r_multiple)}R</td>
      <td class="muted">${rs(t.cost_inr)}</td>
      <td class="${cls(t.net_inr)}">${rs(t.net_inr)}</td></tr>`).join("") + `</table>`;
}

function rejectTable(r){
  const k = Object.keys(r||{});
  const el = document.getElementById("rejects");
  if(!k.length){ el.innerHTML = '<p class="empty">–</p>'; return; }
  el.innerHTML = k.map(x => `<span class="pill">${esc(x)} · ${f0(r[x])}</span>`).join("");
}

async function tick(){
  try{
    const d = await (await fetch("/api/state")).json();
    if(d.error){ document.getElementById("sub").textContent = "error: "+d.error; return; }
    const spots = Object.entries(d.spots||{}).map(([k,v])=>`${k} ${f2(v)}`).join(" · ");
    document.getElementById("sub").innerHTML =
      `${esc(d.now)} IST · ${esc(d.phase)} · ${d.connected?"feed live":"<b class='down'>feed down</b>"} · ${f0(d.ticks)} ticks · ${esc(spots)}`
      + (d.halted ? ` · <b class="down">HALTED: ${esc(d.halt_reason)}</b>` : "");
    controls(d);
    tiles(d);
    const pct = Math.max(0, Math.min(100, d.progress_pct||0));
    const bar = document.getElementById("prog");
    bar.style.width = pct+"%";
    bar.style.background = d.day_pnl < 0 ? "var(--down)" : "var(--up)";
    document.getElementById("progtxt").textContent =
      `${rs(d.day_pnl)} of the ₹${f0(d.target_inr)} goal (${f2(d.progress_pct)}%). `
      + (d.target_hit ? "Target met — trading continues, a bigger day is a better day."
                      : "Target is a goal, not a stop.");
    openTable(d.open_positions||[]);
    structTable(d.structures);
    tradeTable(d.recent_trades);
    rejectTable(d.rejects);
    const L = d.limits||{};
    document.getElementById("foot").textContent =
      `ATM ±${L.max_strike_offset} · 1 lot · buying ${L.allow_selling?"and selling":"only"} · `
      + `stop at structure, 1:${L.reward_risk} target, breakeven at +${L.trail_trigger_r}R · `
      + `min ${L.min_net_points} net points · daily loss halt ${L.max_daily_loss_pct}% · `
      + `square-off ${L.squareoff_minutes} min before close · ${f0(d.passes)} passes`;
  }catch(e){ document.getElementById("sub").textContent = "disconnected"; }
}
tick(); setInterval(tick, 1000);
</script>
