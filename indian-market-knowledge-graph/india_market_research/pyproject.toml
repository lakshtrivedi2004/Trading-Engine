[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imr"
version = "0.2.0"
description = "India Index Research Platform: explains index moves and honestly tests trading patterns"
requires-python = ">=3.11"
dependencies = [
    "yfinance==1.7.0",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "matplotlib==3.11.2",
    "requests==2.34.2",
    "flask==3.1.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
imr = "imr.cli:main"

[tool.setuptools.packages.find]
include = ["imr*"]

[tool.setuptools.package-data]
"imr.web" = ["templates/*.html", "static/*.js", "static/*.css", "static/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
