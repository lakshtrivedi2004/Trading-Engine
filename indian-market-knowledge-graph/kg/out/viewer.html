 "type": "Psychology", "name": "Recency Bias", "modules": ["M09"], "summary": "Over-weighting the latest data (a green candle after a governance scandal) over the bigger picture; exit governance-tainted stocks regardless."}, {"id": "anchoring_bias", "type": "Psychology", "name": "Anchoring Bias (Focalism)", "modules": ["M09"], "summary": "Fixating on the first price seen (author refused to pay 280-310 for Sundaram Clayton anchored at 270 and missed a multi-bagger); be willing to pay a small premium when thesis is intact."}, {"id": "functional_fixedness", "type": "Psychology", "name": "Functional Fixedness", "modules": ["M09"], "summary": "Using tools only in conventional ways - e.g. treating NRML margin as locked; converting an overnight NRML position to MIS intraday frees margin for another intraday trade, then convert back before close."}, {"id": "confirmation_bias", "type": "Psychology", "name": "Confirmation Bias", "modules": ["M09"], "summary": "Seeking only information that supports your view (reading routine news as a trigger for your chart thesis); counter with critical 'so what?' questioning."}, {"id": "attribution_bias", "type": "Psychology", "name": "Attribution Bias", "modules": ["M09"], "summary": "Crediting wins to skill and blaming losses on brokers/systems; counter by keeping a trading journal with entry and exit reasons."}, {"id": "trading_journal", "type": "Process", "name": "Trading Journal", "modules": ["M09"], "summary": "Record why each trade was entered and exited to learn from your own behaviour and overcome attribution bias.", "bot_use": "Log every signal, filter decision, order, fill and exit reason for post-trade analysis."}, {"id": "module_m10", "type": "Module", "name": "M10 - Trading Systems", "modules": ["M10"], "summary": "What a trading system is (quantified, backtestable process vs ad-hoc views), pair trading via ratio/spread/differential with z-score/density curve (Mark Whistler method), statistical arbitrage via linear regression, error ratio, cointegration/stationarity/ADF test and residual z-score trading with beta-neutral sizing and intercept caution, statistical futures calendar spreads, and cross-sectional momentum portfolios. (Volatility-based delta hedging was announced but not covered.)"}, {"id": "trading_system", "type": "Concept", "name": "Trading System", "modules": ["M10"], "summary": "A defined, quantified, backtestable process that takes market inputs, applies fixed logic and outputs a trade decision; gut, tips, TV, broker calls and ad-hoc 'systematic deduction' are not systems. Not a holy grail - you design the logic once and follow it; backtesting is mandatory and must be redone as markets change."}, {"id": "backtesting", "type": "Process", "name": "Backtesting", "modules": ["M10"], "summary": "Running a system's rules over historical data to measure frequency, win rate and P&L profile before risking capital; use clean, corporate-action-adjusted, date-aligned data; backtest per instrument and per direction (e.g. SBIN calendar spreads - shorts worked, longs mixed).", "bot_use": "Every node with 'conditions' should be backtested with realistic costs/slippage before deployment."}, {"id": "pair_trading", "type": "Strategy", "name": "Pair Trading (Relative Value / Statistical Arbitrage) - concept", "modules": ["M10"], "aliases": ["Relative value trading", "Statistical arbitrage", "RVT"], "summary": "Two similar businesses (e.g. HDFC Bank & ICICI Bank) share drivers so their prices move together; a stock-specific 'local event' causes a temporary anomaly - buy the relatively cheap, sell the relatively expensive and profit when the relationship normalises.", "facts": ["Origin - Gerry Bamberger / Nunzio Tartaglia at Morgan Stanley (1980s); DE Shaw adopted it.", "Not truly market-neutral (two different underlyings); a calendar spread is closer to market-neutral.", "Relationship measures - spread (difference of % changes), differential (price difference), ratio (price1/price2); divergence vs convergence trades.", "Qualify pairs with correlation (Whistler method wants > 0.75; compute on returns).", "Margin-hungry; expect 2-3 signals per pair per year - track many pairs.", "Main risk - the pair keeps diverging (relationship breaks)."]}, {"id": "mean_reversion", "type": "Concept", "name": "Mean Reversion", "modules": ["M10"], "summary": "A stationary series (pair ratio, residual, spread) that deviates from its mean tends to return to it; probability of reversion inferred from its standard-deviation distance."}, {"id": "pair_trading_ratio_method", "type": "Strategy", "name": "Pair Trading Method 1 - Ratio z-score / Density Curve (Mark Whistler)", "modules": ["M10"], "summary": "Track ratio = price_A / price_B; compute mean, SD (and SD table up to +/-3), and the cumulative normal 'density curve' value NORM.DIST(ratio, mean, sd, TRUE) daily; trade extremes, exit toward mean.", "formula": {"ratio": "price_A / price_B", "density": "Phi((ratio - mean)/sd)"}, "conditions": {"long_pair": "density in ~[0.003, 0.025] (ratio at -2..-3 SD) -> buy A (numerator), sell B", "short_pair": "density in ~[0.975, 0.997] (+2..+3 SD) -> sell A, buy B", "exit": "ratio back inside 2 SD / toward mean (e.g. density ~0.16-0.84)", "density_map": "0.16=-1SD, 0.84=+1SD, 0.025=-2SD, 0.975=+2SD, 0.003=-3SD, 0.997=+3SD"}, "params": {"lookback": "~2 years daily (496 bars)"}, "example": "Axis/ICICI - 25-Oct-2017 density 0.052 (ratio 1.54) -> buy Axis 473, sell ICICI 305.7; exit 31-Oct at density 0.26 (Axis 523, ICICI 300.1).", "caveats": ["Correlation of Axis-ICICI only ~0.5 in example; author considers this method a foundation - prefers regression method; consider rupee neutrality."]}, {"id": "linear_regression", "type": "Model", "name": "Linear Regression (for pairs)", "modules": ["M10"], "summary": "Fit y = M*x + c (+ residual) between two price series; outputs slope (beta/hedge ratio), intercept, residuals, standard error (SD of residuals) and standard error of intercept.", "formula": {"model": "y = beta*x + c + e", "residual": "actual_y - (beta*x + c)"}}, {"id": "error_ratio", "type": "Formula", "name": "Error Ratio (choose X vs Y)", "modules": ["M10"], "summary": "Regress both ways; pick the orientation with the lower error ratio (keeps intercept - the unhedged part - small).", "formula": {"error_ratio": "SE(intercept) / SE(regression)"}, "example": "ICICI(x)->HDFC(y) 0.401; HDFC(x)->ICICI(y) 0.227 -> choose HDFC as X."}, {"id": "stationarity", "type": "Concept", "name": "Stationarity, Cointegration and the ADF Test", "modules": ["M10"], "aliases": ["ADF", "Augmented Dickey-Fuller", "Cointegration"], "summary": "Two prices are cointegrated if the regression residuals are stationary (constant mean, constant SD, no autocorrelation); test with Augmented Dickey-Fuller - p-value is probability of NON-stationarity; require p <= 0.05. Regression relations on non-stationary residuals are spurious.", "conditions": {"tradable_pair": "adf_pvalue(residuals) <= 0.05", "manual_checks": "means of 3 sub-samples similar; SDs similar; lag-1/lag-2 autocorrelation ~0"}, "bot_use": "Weekly/biweekly re-screen of sector pairs (200-day lookback) with statsmodels.adfuller."}, {"id": "pair_trading_regression_method", "type": "Strategy", "name": "Pair Trading Method 2 - Regression Residual z-score (Stat Arb)", "modules": ["M10"], "summary": "For same-sector pairs over 200 days - regress both ways, keep lower error ratio orientation, require ADF p <= 0.05, then trade the residual's z-score with beta-neutral quantities.", "formula": {"z": "today_residual / SE_of_residuals", "qty_x": "qty_y * beta (round to lot sizes; top up in cash market if needed)", "unexplained_share": "intercept / price_y"}, "conditions": {"long_pair": "z <= -2.5 (book: -2) -> buy Y, sell beta*X", "short_pair": "z >= +2.5 -> sell Y, buy beta*X", "stop_loss": "z beyond -3 (long) / +3 (short)", "target": "z back to -1 (long) / +1 (short), ideally mean", "skip": "negative beta (often untradeable); large intercept relative to price_y (e.g. 1626/2024 = 80% unexplained)"}, "bot_use": "Complete stat-arb pipeline - nightly screen, z-score monitor intraday, beta-neutral sizing, z-based exits.", "facts": ["Price, S&R, RSI are irrelevant - only the residual z-score matters.", "Positions may stay open 7-25 sessions; keep M2M buffer.", "Beyond pairs - multivariate regression (stock A vs basket B+C)."], "example": "Tata Motors (Y) vs TM-DVR (X), ADF 0.018, beta 1.59, z -2.54 -> long 1 lot TM (1500) / short 1 lot DVR (2400 ~ 2385); exited ~7 sessions later at z ~ -1 for ~Rs 14k. HDFC(Y)/ICICI(X) beta 0.79 -> 7 lots HDFC vs 1 lot ICICI but rejected for huge intercept."}, {"id": "statistical_calendar_spread", "type": "Strategy", "name": "Statistical Futures Calendar Spread", "modules": ["M10"], "summary": "Treat the next-month minus current-month futures price difference as a mean-reverting series (prices already embed carry, dividends etc.); trade +/-1 SD deviations back to the mean.", "formula": {"spread": "price_next_month - price_current_month", "bands": "mean +/- 1*sd (200-day continuous futures)"}, "conditions": {"sell_spread": "spread > mean + 1sd -> sell next month, buy current month", "buy_spread": "spread < mean - 1sd -> buy next month, sell current month", "exit": "spread returns to mean"}, "facts": ["Signals cluster near expiry; small P&L so costs must be minimal; directional risk removed so leverage can be higher; backtest per contract and per side."], "example": "SBIN mean 1.227, sd 0.4935 -> bands 0.7335 / 1.7205; 6 short signals all profitable (closed next day), 28 long signals mixed."}, {"id": "momentum", "type": "Concept", "name": "Momentum", "modules": ["M10"], "summary": "Rate of change of returns (use % not rupee changes); can be measured over any horizon (minutes for HFT to 12 months); consistency of returns matters."}, {"id": "momentum_portfolio", "type": "Strategy", "name": "Cross-Sectional Momentum Portfolio", "modules": ["M10"], "summary": "From a tracking universe (e.g. BSE 500, or custom filters like mcap >= 1000 Cr; 150-200 stocks for a 12-15 stock portfolio), rank by trailing 12-month return, buy top 10-15 equally weighted on the first trading day of the month, rebalance monthly (sell drop-outs, buy new entrants).", "formula": {"score": "close_t / close_{t-252} - 1", "rank": "descending score"}, "conditions": {"universe": "liquid, clean, corporate-action adjusted", "entry": "top N by 12m return, equal weight", "rebalance": "monthly after close on last trading day", "variations": "1m/2w/1w lookbacks; skewed weights; fundamental momentum (quarterly sales growth, EPS growth, margins) rebalanced quarterly"}, "bot_use": "Monthly rebalancing bot with index-trend regime filter (e.g. Nifty above 200-DMA).", "caveats": ["Works in up-trending markets; poor in choppy markets; bleeds more than the market in downtrends (author profited 2009-10", "hit in 2011) - add a market regime filter; backtest first."]}, {"id": "systematic_deduction_example", "type": "Strategy", "name": "Event Overreaction Short Strangle (example of 'systematic deduction')", "modules": ["M10"], "summary": "Oct 2017 PSU recapitalisation - PSU bank index +27%, but Bank Nifty +3% looked excessive given PSU weight ~10%, so authors sold a Bank Nifty short strangle to capture falling IV (worked); illustrates contrarian reasoning that is not yet a system."}, {"id": "module_m11", "type": "Module", "name": "M11 - Personal Finance", "modules": ["M11"], "summary": "Start saving early, interest/compounding/TVM math, retirement corpus planning with inflation and step-up SIPs, mutual fund structure/NAV/factsheet, equity and debt fund categories, bonds/YTM, index funds vs active, arbitrage funds, return measurement (absolute/CAGR/XIRR/rolling), expense ratio and direct vs regular, benchmarking/TRI, risk metrics (beta, alpha, SD, Sharpe, Sortino, capture ratios), fund analysis, MF portfolio construction, smart beta, asset allocation & sequence risk, ETFs, and macroeconomics (GDP, fiscal deficit)."}, {"id": "start_saving_early", "type": "Rule", "name": "Start Saving Early (time > amount)", "modules": ["M11"], "summary": "Time in the market dominates amount invested - the triplet sisters example at 12% shows 4.5L invested age 20-28 grows to 4.89 Cr by 65, beating 19L invested age 28-65 (3.05 Cr)."}, {"id": "simple_vs_compound_interest", "type": "Formula", "name": "Simple vs Compound Interest", "modules": ["M11"], "summary": "Simple interest only on principal; compound interest on principal plus accumulated interest.", "formula": {"simple": "P * r * t", "compound_value": "P * (1 + r) ** n", "cagr": "(end/start) ** (1/n) - 1"}, "example": "1L at 10% for 5 yrs - simple +50k; compound +61,051."}, {"id": "discount_rate_opportunity_cost", "type": "Formula", "name": "Discount Rate = Risk-free + Risk Premium", "modules": ["M11"], "summary": "Opportunity cost used for PV/FV decisions = risk-free (government bond of matching tenor) + risk premium (~1.5-2%). Money today is worth more than money tomorrow.", "example": "Land sold for 7.5 Cr in 15 yrs at 9% discount = 2.06 Cr today; 2L lump-sum scheme returning 4.5L in 15 yrs is worse than 7.5% G-sec (5.92L)."}, {"id": "retirement_planning", "type": "Model", "name": "Retirement Corpus Planning", "modules": ["M11"], "summary": "Inflate today's annual expense for each retirement year (FV at inflation ~5%) and sum to get the corpus; build it via monthly SIPs into equity funds with annual step-ups, each instalment compounding for its remaining months.", "formula": {"expense_in_year_k": "annual_expense * (1 + inflation) ** years_from_now", "corpus": "sum over retirement years", "sip_fv": "sum_m installment_m * (1 + r) ** (months_remaining_m / 12)", "multi_asset_return": "sum(weight_i * expected_return_i)"}, "params": {"conservative_equity_cagr": [0.1, 0.11], "inflation": [0.04, 0.05]}, "example": "50k/month today, retire in 25 yrs for 20 yrs at 5% inflation -> ~7.2 Cr; needs ~Rs 20k/month SIP stepped up 10% yearly at 11%."}, {"id": "mutual_fund", "type": "Instrument", "name": "Mutual Funds (structure, NAV, factsheet)", "modules": ["M11"], "aliases": ["AMC", "NAV", "Open-ended", "Close-ended"], "summary": "Pooled vehicle - sponsor (promoter, holds licence) appoints trustee and AMC (investment manager); custodian holds assets; RTA services investors. Units issued at notional value; NAV moves with holdings. Factsheet - objective, open/close-ended, plans (direct vs regular), options (dividend/growth), riskometer."}, {"id": "equity_fund_categories", "type": "Concept", "name": "SEBI Equity Fund Categories", "modules": ["M11"], "summary": "Market-cap classes - large cap = top 100 by full market cap, mid cap = 101-250, small cap = 251+. Large-cap funds >= 80% large caps; large & mid >= 35% each; also multi-cap, focused (max 30 stocks), dividend yield, ELSS (tax-saving, 3-yr lock-in), sectoral/thematic.", "bot_use": "Universe definitions for large/mid/small-cap strategies (rank by full market cap)."}, {"id": "market_capitalisation", "type": "Formula", "name": "Market Capitalisation", "modules": ["M11"], "summary": "Share price x shares outstanding; market cap of the whole market tends to grow with GDP.", "formula": {"mcap": "price * shares_outstanding"}}, {"id": "debt_funds", "type": "Instrument", "name": "Debt Funds and Debt Risks", "modules": ["M11"], "aliases": ["Liquid fund", "Overnight fund", "Gilt fund", "Credit risk fund", "Macaulay duration", "Modified duration"], "summary": "Companies borrow via bonds (>1 yr) and commercial paper (<1 yr), government via T-bills/G-secs; lenders face credit, interest-rate, liquidity and rating-change risk. Overnight (1-day, tri-party repo) < liquid (<=91 days) < ultra-short (3-6 m Macaulay) < low duration < short/medium duration; banking & PSU (lower credit risk); credit risk funds (avoid as retail); gilts (no credit risk, high rate risk).", "facts": ["Bond prices move inversely to yields/interest rates; modified duration ~ % NAV change per 1% rate change.", "Liquid funds are not savings accounts (Taurus, Franklin Templeton 2020 wind-up, DHFL defaults).", "Watch fund borrowing (liquidity stress), concentrated corporate exposure, sub-investment-grade paper; hold at least the fund's average maturity."]}, {"id": "bonds", "type": "Instrument", "name": "Bonds and Yield to Maturity", "modules": ["M11"], "aliases": ["YTM", "Coupon", "Accrued interest"], "summary": "Coupon is % of face value; YTM is the effective yield given purchase price, coupons and maturity; buyer pays accrued interest to seller; tax-free bonds have tax-free coupons; PSU bonds carry implicit sovereign backing."}, {"id": "index_funds", "type": "Instrument", "name": "Index Funds (passive investing)", "modules": ["M11"], "summary": "Track a benchmark cheaply; active management is a zero-sum game before costs and negative after costs - SPIVA India - ~82% of large-cap funds underperformed BSE 100 over 5 yrs (2019); expense gap ~1% compounds massively; paradox of skill; closet indexing. Use index funds for large (and increasingly mid) caps; combine active and passive if desired."}, {"id": "arbitrage_fund", "type": "Instrument", "name": "Arbitrage Funds", "modules": ["M11"], "summary": "At least 65% in hedged arbitrage (mainly cash-futures basis capture, also cross-exchange), rest in debt; equity taxation but debt-like returns (5-7%) - the real arbitrage is tax; not risk-free (debt defaults e.g. DHFL hit, slow recovery); check debt quality and no unhedged equity.", "example": "Maruti spot 5714.4 vs futures 5735.6 -> lock 21.2 basis by expiry."}, {"id": "return_measurement", "type": "Formula", "name": "Return Measurement (Absolute, CAGR, XIRR, Rolling)", "modules": ["M11"], "aliases": ["XIRR", "Rolling returns", "Point-to-point return"], "summary": "Lump-sum or SIP < 1 yr - absolute return; lump sum > 1 yr - CAGR; SIP > 1 yr - XIRR (cash-flow-dated IRR). Point-to-point returns depend on the two dates; rolling n-year returns (CAGR for every start date) show the distribution - use average, min, max.", "formula": {"absolute": "end/start - 1", "cagr": "(end/start) ** (1/years) - 1", "xirr": "rate r s.t. sum(cf_i / (1 + r) ** ((t_i - t_0)/365)) = 0", "rolling_n": "for each date t: (nav_t / nav_{t - n years}) ** (1/n) - 1"}, "bot_use": "Evaluate strategies with rolling-window returns, not single point-to-point backtests."}, {"id": "expense_ratio", "type": "Concept", "name": "Expense Ratio (TER) and Direct vs Regular Plans", "modules": ["M11"], "summary": "TER is an annual % fee charged daily via NAV; regular plans pay distributor commissions so have higher TER and lower NAV than direct plans - the gap compounds into large differences."}, {"id": "benchmarking_tri", "type": "Concept", "name": "Benchmarking and Total Return Index (TRI)", "modules": ["M11"], "summary": "Compare against TRI (price + dividends reinvested), not price index; index returns depend on constituent weights; set realistic personal benchmarks.", "bot_use": "Benchmark strategies against Nifty 50 TRI."}, {"id": "performance_metrics", "type": "Formula", "name": "Risk-Adjusted Performance Metrics (Beta, Alpha, SD, Sharpe, Sortino, Capture Ratios)", "modules": ["M11"], "aliases": ["Sharpe ratio", "Sortino ratio", "Jensen alpha", "Upside capture", "Downside capture"], "summary": "Beta = relative risk vs benchmark (not inherent risk); alpha = risk-adjusted excess return; SD = inherent volatility; Sharpe = excess return per unit total volatility; Sortino = per unit downside deviation; capture ratios = share of benchmark up/down moves captured - prefer consistent low downside capture.", "formula": {"alpha": "(R_fund - Rf) - beta * (R_bench - Rf)", "sharpe": "(R - Rf) / sd", "sortino": "(R - Rf) / downside_deviation", "upside_capture": "fund_return_in_up_periods / bench_return_in_up_periods * 100", "downside_capture": "fund_return_in_down_periods / bench_return_in_down_periods * 100"}, "bot_use": "Standard strategy scorecard - Sharpe, Sortino, beta/alpha vs Nifty, capture ratios, max drawdown.", "example": "Fund 10%, bench 7%, Rf 4%, beta 0.75 -> alpha 3.75% (beta 1.3 -> 2.1%); Fund A (14%, sd 28%) and B (16%, sd 34%) both Sharpe 0.29 at Rf 6%.", "caveats": ["Sharpe is meaningless for debt funds (ignores credit/rate risk)."]}, {"id": "fund_analysis_process", "type": "Process", "name": "Analysing Equity and Debt Mutual Funds", "modules": ["M11"], "summary": "Equity - hygiene (AUM, objective, manager, benchmark) -> 3/5/10-yr rolling returns vs benchmark (avg/min/max) -> risk-return matrix (is excess return from extra risk?) -> capture ratios. Debt - align with goal and horizon, check portfolio credit quality, concentration, duration vs holding period, YTM as risk signal, AUM."}, {"id": "mf_portfolio_construction", "type": "Rule", "name": "Mutual Fund Portfolio Construction", "modules": ["M11"], "summary": "First health + term insurance, then emergency corpus; define goal by corpus and time; build by elimination with minimal non-overlapping funds (avoid multiple funds in same subcategory); conservative return assumptions; review yearly; keep it simple."}, {"id": "emergency_fund", "type": "Rule", "name": "Emergency Corpus", "modules": ["M11"], "summary": "Second priority after insurance - liquid reserve for unexpected expenses before investing for goals."}, {"id": "smart_beta", "type": "Concept", "name": "Smart Beta / Factor Investing", "modules": ["M11"], "summary": "Smart beta is marketing for factor or alternatively-weighted indices (value, quality, low volatility, momentum etc.); factors are cyclical and can underperform simple index funds for long periods; live fund results differ from index backtests; diversify across factors."}, {"id": "asset_allocation_advanced", "type": "Rule", "name": "Asset Allocation, Sequence Risk and Diversification Vectors", "modules": ["M11"], "summary": "Prediction is impossible (India beat US 2001-11, reversed next decade) - own a bit of all major assets. Sequence risk - an investor rarely gets average returns; bad years can cluster in your window. Diversify across real drivers (currency, market composition, panic flows - US bonds are safe havens, Indian bonds aren't; avoid bubble assets), not 'diworsification'. Simple start - Indian equity (large-cap index + mid-cap), US equity (cheap S&P 500 fund), short-term govt/PSU bonds, gold (Sovereign Gold Bonds), REITs; equal weight if unsure; stick to the plan.", "caveats": ["Financialisation raises correlations between assets (e.g. REITs vs stocks)."]}, {"id": "etf", "type": "Instrument", "name": "Exchange Traded Funds (ETFs)", "modules": ["M11"], "aliases": ["iNAV", "Creation unit", "Tracking error"], "summary": "Exchange-traded index/commodity/debt wrappers with creation/redemption by market makers/APs; liquidity layers - screen depth, market makers, primary creation, underlying stocks (illiquid underlyings -> premiums/discounts).", "conditions": {"always": "use limit orders; compare price with iNAV/underlying index; avoid first 30-60 min after open; check average volumes and tracking vs TRI; prefer AMCs serious about ETFs; create units with AMC for large tickets"}, "bot_use": "Limit-order execution guard - never market-order an ETF; reject if price deviates from iNAV beyond threshold.", "facts": ["ETFs suit tactical/active use of passive exposure; index funds suit set-and-forget."]}, {"id": "gdp", "type": "Concept", "name": "GDP, Real vs Nominal Growth, and Market Cap", "modules": ["M11"], "summary": "GDP = total economic output; real growth = nominal - inflation; India ~$2.6-2.9T (5th/6th, 2020); as GDP grows, aggregate market cap tends to grow - basis for long-term equity investing.", "formula": {"real_gdp_growth": "nominal_growth - inflation"}}, {"id": "fiscal_deficit", "type": "Concept", "name": "Government Finances and Fiscal Deficit", "modules": ["M11"], "summary": "Revenue = tax (direct - personal/corporate income tax; indirect - GST) + non-tax (PSU dividends, disinvestment); expenditure = revenue (subsidies, salaries, interest) + capital (infrastructure). Fiscal deficit = expenditure - revenue; India FY19 ~3.3% of GDP (govt aims < 4%); higher capex share and tax-to-GDP are positive signals.", "formula": {"fiscal_deficit_pct": "(total_expenditure - total_revenue) / GDP"}}, {"id": "sip", "type": "Strategy", "name": "Systematic Investment Plan (SIP)", "modules": ["M11"], "summary": "Fixed amount invested at fixed intervals (e.g. monthly) into a fund; with annual step-ups it builds long-term corpus; measure SIP returns with XIRR."}, {"id": "module_m13", "type": "Module", "name": "M13 - Integrated Financial Modelling", "modules": ["M13"], "summary": "Building an integrated 3-statement Excel model (main model - Bajaj Auto; helper models - Bata etc.) from 5 years of annual-report data - workbook layout, assumption sheet (ratio/growth + rolling averages), revenue sub-model, asset/depreciation, debt and reserves schedules, P&L and balance-sheet projections, indirect cash flow that balances the balance sheet, then valuation (relative, option-based, absolute) via FCFF/FCFE, CAPM, tax shield, WACC, terminal value and DCF to a per-share fair value."}, {"id": "financial_model", "type": "Model", "name": "Integrated Financial Model", "modules": ["M13"], "summary": "A linked workbook that takes financial statements as input and outputs a valuation (fair share price); fully integrated, so changing any assumption flows through P&L, balance sheet, cash flow and DCF. Modelling is part art (assumptions) and part craft (structure).", "bot_use": "Generates a fair value per share and lets you run sensitivity scenarios; feeds margin-of-safety screens and long-horizon value bots. Recompute after every annual/quarterly report.", "facts": ["Steps - layout -> historical data (5 yrs, consolidated, from the annual report only) -> assumption sheet -> revenue model -> schedules (asset, debt, reserves) -> P&L/BS projections -> cash flow -> valuation.", "Projection horizon - 5 explicit years (Y6-Y10), then terminal value.", "Pick a simple manufacturing company with 1-2 products and consistent disclosure for a first model; avoid banks/NBFC/BFSI (the model doesn't fit them).", "Sensitivity example - materials consumed 65% -> 60% of sales moved Bajaj Auto fair value from Rs 300 to Rs 462."]}, {"id": "model_layout_hygiene", "type": "Rule", "name": "Model Layout and Format Hygiene", "modules": ["M13"], "summary": "Same column = same year across every sheet; narrow index columns A, B and D; no gridlines; freeze panes; units stated (INR Cr); colour-code facts vs assumptions; break heavy line items into detail; do an annual-report recce first and use the latest year's format; never copy from third-party data vendors ('model suicide' = unstructured copy-paste)."}, {"id": "model_assumptions", "type": "Process", "name": "Assumption Sheet - Ratio/Growth Drivers with Rolling Averages", "modules": ["M13"], "summary": "Express each line item historically as a ratio to a driver (BS items vs gross block; P&L items vs sales) or as a YoY growth rate; project with the rolling average of the last 4 years (Y6 = avg(Y2..Y5), Y7 = avg(Y3..Y6)) or an informed guess. Prefer drivers with a narrow, stable historical range.", "formula": {"ratio_driver": "item_t / driver_t (e.g. liabilities / gross_block)", "growth_driver": "item_t / item_{t-1} - 1", "projection": "item_{t+1} = rolling_mean(ratio, 4) * driver_{t+1}", "deferred_tax": "deferred_tax = avg(deferred_tax / depreciation) * depreciation (more stable than growth)"}}, {"id": "working_capital_days", "type": "Formula", "name": "Inventory and Receivable Days", "modules": ["M13"], "summary": "Convert inventory (and receivables) from rupees to days, average the days, then convert back for projections; the days figures also reveal operating efficiency (fewer days = faster conversion to sales).", "formula": {"inventory_days": "avg(inventory_{t-1}, inventory_t) / materials_consumed_t * 365", "receivable_days": "avg(receivables_{t-1}, receivables_t) / sales_t * 365", "back_to_value": "inventory_t = inventory_days * materials_consumed_t / 365 (adjusting for averaging)"}}, {"id": "revenue_model", "type": "Model", "name": "Revenue Sub-model", "modules": ["M13"], "summary": "Build revenue bottom-up from common-sense questions answered in the annual report - what they make, where they sell (domestic vs export), units x realisation per unit, capacity and utilisation. It also yields capacity utilisation, capex cycles and market share.", "formula": {"revenue": "sum_segments(units_sold * avg_realisation)", "utilisation": "units_produced / installed_capacity"}, "example": "Bajaj Auto - motorcycles vs commercial vehicles, domestic vs export units; revenue ~Rs 29,111 Cr with exports ~Rs 12,216 Cr."}, {"id": "base_rule", "type": "Rule", "name": "Base Rule (Roll-forward)", "modules": ["M13"], "summary": "Every schedule rolls forward - this year's closing balance is next year's opening balance; closing = opening + additions - deletions.", "formula": {"closing": "opening + additions - deductions", "next_opening": "closing_t"}}, {"id": "asset_schedule", "type": "Process", "name": "Asset Schedule (Gross Block, CAPEX, Depreciation, Net Block)", "modules": ["M13"], "summary": "Back out historical capex from changes in gross block; project capex from management guidance (best), historical averages, or a variable method; project depreciation with the proportion method (depreciation/gross block); roll accumulated depreciation forward; the net block flows back to the balance sheet and the depreciation to the P&L.", "formula": {"capex": "gross_block_t - gross_block_{t-1} (+ disposals)", "depreciation_next": "(dep_t / gross_block_t) * gross_block_{t+1}", "accumulated_dep": "acc_dep_{t-1} + dep_t", "net_block": "gross_block - accumulated_depreciation"}, "example": "Dep 41.71 / GB 538.76 = 7.74%; projected GB 588.77 -> dep 45.58 Cr."}, {"id": "debt_schedule", "type": "Process", "name": "Debt Schedule", "modules": ["M13"], "summary": "Split debt into secured and unsecured using the notes, average the opening and closing balances to get the interest base, and project debt from management's capex/financing view; with no guidance, hold debt flat.", "formula": {"interest": "avg(opening_debt, closing_debt) * interest_rate"}}, {"id": "reserves_schedule", "type": "Process", "name": "Equity / Reserves Schedule", "modules": ["M13"], "summary": "Share capital (authorised >= issued >= subscribed/paid-up; shares = share capital / face value); reserves - securities premium (rises with fresh equity), general reserve, retained earnings (PAT flows in, dividends and DDT flow out). This is the main P&L-to-BS link.", "formula": {"shares_outstanding": "paid_up_share_capital / face_value", "retained_earnings": "opening + PAT - dividends - transfers_to_general_reserve"}}, {"id": "indirect_cash_flow", "type": "Process", "name": "Indirect Cash Flow and Balance Check", "modules": ["M13"], "summary": "Derive cash flow from P&L and balance-sheet changes - CFO (PAT + depreciation from the asset schedule +/- working-capital changes), CFI (capex, investments), CFF (debt, equity, dividends). Net cash flow plus opening cash gives closing cash, which plugs into the balance sheet; if the model is integrated correctly the balance sheet balances.", "formula": {"closing_cash": "opening_cash + CFO + CFI + CFF", "check": "total_assets - total_liabilities_and_equity == 0"}}, {"id": "valuation_methods", "type": "Concept", "name": "Valuation Approaches (Relative, Option-based, Absolute)", "modules": ["M13"], "summary": "Relative - value like identical peers via multiples (fails if the sector is mispriced or the companies differ). Option-based - the firm's value depends on an event (e.g. R&D success), valued like an option (niche, tech). Absolute - intrinsic value from discounted cash flow (enterprise or equity). Decision - market price > fair price means overvalued, < means undervalued.", "conditions": {"overvalued": "market_price > fair_price", "undervalued": "market_price < fair_price (buy only with margin_of_safety)"}, "example": "Peers at ~10x PAT -> a new peer with PAT 300 should trade ~Rs 3,000."}, {"id": "enterprise_value", "type": "Formula", "name": "Enterprise Value and Equity Value", "modules": ["M13"], "summary": "Rearranging the balance sheet - fixed assets = net debt + equity. Valuing the whole firm gives EV (discount FCFF at WACC); EV - debt + cash = equity value; divide by shares outstanding for fair value per share.", "formula": {"net_debt": "debt - cash", "equity_value": "EV - debt + cash", "fair_price": "equity_value / shares_outstanding"}}, {"id": "fcff_fcfe", "type": "Formula", "name": "Free Cash Flow to Firm (FCFF) and to Equity (FCFE)", "modules": ["M13"], "summary": "The firm is financed by debt and equity holders; FCFF is the cash available to both, and FCFE is what remains for equity after debt service. Discount FCFF at WACC and FCFE at the cost of equity.", "formula": {"fcff_from_pat": "PAT + D&A + interest*(1-tax) + deferred_tax - delta_working_capital - capex", "fcff_from_ebit": "EBIT*(1-tax) + D&A + deferred_tax - delta_working_capital - capex", "fcfe": "FCFF - interest*(1-tax) - principal_repayment + net_new_borrowing", "working_capital": "current_assets - current_liabilities"}}, {"id": "tax_shield", "type": "Concept", "name": "Interest Tax Shield / Effective Cost of Debt", "modules": ["M13"], "summary": "Interest is tax-deductible, so its after-tax cost is lower; add back interest*(1-t) in FCFF and use the after-tax cost of debt in WACC.", "formula": {"effective_cost_of_debt": "kd * (1 - tax_rate)"}, "example": "Interest 70 at 25% tax -> add back 52.5; kd 8% at 30% tax -> 5.6%."}, {"id": "capm", "type": "Formula", "name": "CAPM - Cost of Equity", "modules": ["M13"], "summary": "The return equity holders expect is the risk-free rate plus beta times the market risk premium. Proxy Rf with the 10-year G-sec yield (CCIL/RBI); the long-term market return Rm is ~8-12%.", "formula": {"re": "Rf + beta * (Rm - Rf)", "risk_premium": "beta * (Rm - Rf)"}, "example": "Rf 7.4586%, beta 1.3, Rm 8.5% -> Re 8.81%."}, {"id": "wacc", "type": "Formula", "name": "Weighted Average Cost of Capital (WACC)", "modules": ["M13"], "summary": "A blended discount rate for the whole firm; the cost of equity is always above WACC.", "formula": {"wacc": "wd * kd*(1-t) + we * ke", "wd": "D/(D+E)", "we": "E/(D+E)"}, "params": {"target_debt_to_equity": "<= 50% (model default)", "tax_rate": "25% (model default)"}, "example": "D 300, E 200, kd 8%, ke 12% -> 9.6% pre-tax; with a 30% tax shield -> 8.16%."}, {"id": "terminal_value", "type": "Formula", "name": "Terminal Value (Gordon Growth)", "modules": ["M13"], "summary": "Beyond the 5 explicit years, assume cash flows grow forever at roughly long-term inflation; DCF is extremely sensitive to this number, and it requires stable positive cash flows (DCF fails with negative ones).", "formula": {"tv": "CF_final * (1 + g) / (r - g)", "pv_factor": "1 / (1 + r)^t", "constraint": "r > g; g ~ long-term inflation"}}, {"id": "dcf_model_implementation", "type": "Process", "name": "DCF Implementation in the Model", "modules": ["M13"], "summary": "Inputs are Rf (10Y G-sec, ~7%), Rm (10-12%), beta, kd (~10%), tax (25%), target D/E (50%) and terminal g (~inflation). Steps - project FCFF Y6-Y10, compute TV at Y10, discount everything at WACC, sum to EV, subtract debt and add cash to get equity value, divide by shares for the fair price, then compare with the market price and run sensitivities on key assumptions.", "bot_use": "fair_value(inputs) -> upside = fair/price - 1; screen for upside > margin_of_safety; run grid sensitivity on g and WACC.", "example": "Year-3 FCFF 294.14 at WACC 10.25% -> PV 294.14/1.1025^3 = 219.49 Cr; Bajaj Auto fair value ~Rs 300 in the base case."}, {"id": "module_m14", "type": "Module", "name": "M14 - Personal Finance - Insurance", "modules": ["M14"], "summary": "Health insurance as the first step of a financial plan (authored by Ditto) - honest disclosure, sizing the cover, co-payment and room-rent caps, pre-existing disease waiting periods and loading, specific-illness waiting periods, permanent exclusions, sub-limits and hospital blacklists, floaters, group and employer plans, a gimmick-or-not verdict on common features, claim settlement vs incurred claims ratio, and porting. Indirectly relevant to bots - it protects the trader's capital base, so drawdowns are never forced by medical emergencies.", "caveats": ["Product features, waiting periods and IRDAI rules are as of ~2021-22; verify current IRDAI regulations (e.g. moratorium/waiting-period reforms) before relying on numbers."]}, {"id": "insurance_basics", "type": "Concept", "name": "Insurance (Risk Transfer) - basics", "modules": ["M14"], "summary": "Insurance transfers the financial risk of rare, high-cost events to an insurer in exchange for a premium; health and term life insurance come before an emergency fund and before investing. Insurers price risk through pooling and are exposed to adverse selection and moral hazard, which explains most policy restrictions.", "bot_use": "Capital-protection precondition - a trading account should never be the emergency or medical fund.", "facts": ["Order of priority - health insurance + term insurance -> emergency corpus -> goal investing.", "Restrictions (waiting periods, co-pay, exclusions) exist to contain customer and hospital abuse."]}, {"id": "health_insurance", "type": "Product", "name": "Health Insurance (Indemnity)", "modules": ["M14"], "summary": "Pays hospitalisation bills up to the sum insured; the core protection product. Premiums rise every year (~4-6% medical inflation adjustment plus age-band jumps, occasionally regulator-approved repricing) but cannot be raised because you claimed.", "facts": ["First 30 days - only accidental hospitalisation is covered.", "Healthcare costs inflate ~6-7%/yr.", "Premium increases are not caused by your own claims (urban myth)."]}, {"id": "insurance_disclosure", "type": "Rule", "name": "Full Medical Disclosure (Non-disclosure risk)", "modules": ["M14"], "summary": "Declare every pre-existing condition and habit directly to the insurer on the proposal form - never rely on an agent's verbal assurance. Non-disclosure lets the insurer repudiate the claim or cancel the policy; a loading charge and a waiting period are far better than a rejected claim.", "conditions": {"rule": "disclose all medical history, medication, smoking/alcohol on the form itself"}}, {"id": "perverse_incentives_agents", "type": "Psychology", "name": "Perverse Incentives of Agents", "modules": ["M14"], "summary": "Agents earn commission on premium, so they upsell (Rs 50 lakh-1 crore covers via fear) or under-report your conditions to close the sale; evaluate advice by the adviser's incentive."}, {"id": "cover_amount_sizing", "type": "Rule", "name": "Choosing the Sum Insured", "modules": ["M14"], "summary": "Most expensive treatments rarely cross ~Rs 20 lakh; a Rs 10-20 lakh base cover (boosted by no-claim bonus and restoration) handles most cases. Rs 5 lakh may be inadequate within a decade given 6-7% medical inflation. A smaller cover is fine for the elderly or if you can't sustain the premium - lapsing a policy is the worst outcome. For rare huge bills, add a super top-up instead of buying a huge base cover.", "params": {"base_cover_inr": "10-20 lakh", "medical_inflation": "6-7%/yr", "premium_inflation": "4-6%/yr"}}, {"id": "co_payment", "type": "Concept", "name": "Co-payment Clause", "modules": ["M14"], "summary": "You pay a fixed % of every claim (e.g. 20%) in exchange for a lower premium - gives you 'skin in the game'. Usually a bad trade.", "conditions": {"avoid_unless": "mandatory, or buying for elderly with pre-existing diseases where it cuts premium sharply"}, "example": "20% co-pay saved Rs 1,800/yr on a Rs 7,000 premium, but a Rs 2 lakh claim cost Rs 40,000 out of pocket (~22 years of savings)."}, {"id": "room_rent_cap", "type": "Concept", "name": "Room Rent Cap / Proportionate Deduction", "modules": ["M14"], "summary": "A cap on room rent (e.g. 1% of sum insured per day). Choosing a costlier room makes the insurer pay proportionately on all room-linked charges (surgeon, consultant, diagnostics), not only the rent difference.", "formula": {"payable_fraction": "cap_rent / actual_rent", "applied_to": "room rent + associated charges"}, "conditions": {"prefer": "no room-rent cap; at least single private room allowed"}, "example": "Cap Rs 5,000, room Rs 10,000 -> insurer pays 50%; a Rs 50,000 surgeon fee pays only Rs 25,000."}, {"id": "pre_existing_disease", "type": "Concept", "name": "Pre-existing Disease (PED) Waiting Period and Loading", "modules": ["M14"], "summary": "Declared conditions (diabetes, BP, etc.) trigger a PED waiting period (usually 2-4 years) during which related complications aren't covered, and/or a loading charge on the premium (typically 10-20%, up to ~150% for multiple illnesses); insurers may also reject the proposal.", "params": {"ped_waiting_years": "2-4", "loading": "10-20% typical, up to 150%"}}, {"id": "policy_waiting_periods", "type": "Concept", "name": "Waiting Periods (Initial, Specific Illness, PED)", "modules": ["M14"], "summary": "Three layers - initial 30 days (accidents only); specific-illness list (cataract, stones, deviated septum, hernia, joint replacement etc. - treatments that can be deferred), typically 2 years; PED waiting 2-4 years. Dengue, malaria, fractures, most cancers and heart conditions are covered after 30 days.", "params": {"initial_days": 30, "specific_illness_years": 2, "ped_years": "2-4"}}, {"id": "insurance_exclusions", "type": "Concept", "name": "Permanent Exclusions, Sub-limits, Non-medical Items, Blacklisted Hospitals", "modules": ["M14"], "summary": "Insurer defences against abuse - permanent exclusions (substance/alcohol-induced illness, cosmetic treatment, external congenital conditions); disease-wise sub-limits (e.g. cardiac Rs 2.5L, knee Rs 2.75L, cataract Rs 50k regardless of cover) - avoid policies with them; non-medical consumables excluded; only 'just and reasonable' treatment per medical council norms paid; blacklisted hospitals can be refused.", "conditions": {"check_before_buying": "no disease-wise sub-limits; read permanent exclusion list; check hospital blacklist; get a second opinion for expensive procedures"}, "example": "Rs 10 lakh cover, slipped-disc bill Rs 4.36 lakh, insurer paid only Rs 2 lakh due to a sub-limit."}, {"id": "family_floater", "type": "Product", "name": "Family Floater Policy", "modules": ["M14"], "summary": "One shared sum insured for self, spouse and children at a discount to individual plans; risks within a family are correlated, so the shared cover can run out. Children must exit after an age limit; parents usually excluded. Online discounts are small (<5% first year); real discounts come from wellness programmes, multi-year tenure or floaters."}, {"id": "group_health_insurance", "type": "Product", "name": "Group and Employer Health Insurance", "modules": ["M14"], "summary": "Customised contracts for a group via a master policyholder (bank, employer). Cheaper and often with no waiting periods (invaluable for those with serious PEDs), but pricing is repriced yearly at the insurer's discretion, features are set by the master policyholder, and cover ends if you leave the job or the group dissolves (re-underwriting then). Keep a personal policy alongside an employer cover.", "conditions": {"rule": "employer cover + personal base policy (or a super top-up aligned to the employer cover)"}}, {"id": "restoration_benefit", "type": "Concept", "name": "Restoration Benefit", "modules": ["M14"], "summary": "Restores the sum insured after a claim. Useful in floaters; often neutered by fine print (only for a different illness, or only after the cover is fully exhausted). Verdict - not a gimmick, but buyer beware."}, {"id": "no_claim_bonus", "type": "Concept", "name": "No Claim Bonus (NCB)", "modules": ["M14"], "summary": "Cover grows (e.g. +50% of base) for each claim-free year up to a cap (50%-200% depending on plan); some plans claw it back after a claim, never below base. Verdict - not a gimmick.", "example": "Rs 10L base, 50% NCB -> 15L after 1 claim-free year, 20L after 2; a claim drops it back to 15L."}, {"id": "insurance_feature_verdicts", "type": "Rule", "name": "Health Insurance Features - Gimmick or Not", "modules": ["M14"], "summary": "Ditto's verdicts on marketed features.", "facts": ["Network hospitals (cashless) - not a gimmick.", "AYUSH cover - slightly gimmicky (only in government-certified AYUSH hospitals with inpatient admission).", "Restoration benefit - not a gimmick, but buyer beware.", "Pre/post hospitalisation (e.g. 30/60 days to 60/180 days) - near-universal, nothing extraordinary.", "Day care (<24h procedures like chemo, dialysis, appendicitis) - not a gimmick; make sure it's covered.", "No claim bonus - not a gimmick.", "Domiciliary cover - slightly gimmicky (needs inability to move / no bed, doctor certification, 72h+).", "Consumables add-on (2-10% of bill) - not a gimmick but touch-and-go; better if bundled with inflation protection.", "Critical illness - slightly gimmicky (narrow severity definitions; a super top-up or term plan does better).", "Top-up - highly gimmicky (deductible applies per hospitalisation).", "Super top-up - not a gimmick, but align policy dates.", "Claim settlement ratio - not a gimmick, but needs context (with ICR).", "Porting - not a gimmick."]}, {"id": "consumables_cover", "type": "Concept", "name": "Consumables / Non-medical Expenses Add-on", "modules": ["M14"], "summary": "Gloves, PPE, admin and TV charges are usually excluded (2-10% of a bill); an add-on (~Rs 1,000/yr) covers them. It's marginal unless bundled with inflation protection."}, {"id": "critical_illness_cover", "type": "Product", "name": "Critical Illness Policy", "modules": ["M14"], "summary": "Covers a listed set of severe diseases, often only at specified severity, and pricing can change sharply. For lump-sum income replacement use term insurance; for medical bills a super top-up is broader. Verdict - slightly gimmicky."}, {"id": "term_insurance", "type": "Product", "name": "Term Life Insurance", "modules": ["M14"], "summary": "Pure life cover paying a lump sum to dependants on death within the term; the recommended vehicle for lump-sum protection (instead of critical-illness lump sums or investment-linked insurance)."}, {"id": "top_up", "type": "Product", "name": "Top-up Health Plan", "modules": ["M14"], "summary": "Large cover above a deductible, but the deductible applies to each hospitalisation separately, so several mid-size bills below the deductible are never paid. Verdict - highly gimmicky."}, {"id": "super_top_up", "type": "Product", "name": "Super Top-up Health Plan", "modules": ["M14"], "summary": "Very cheap large cover (e.g. Rs 50 lakh for ~Rs 1,000s/yr) that pays once the aggregate bills within a policy year cross the deductible. Choose the deductible equal to the existing base or employer cover, and align policy-year dates with that cover, otherwise the deductible must be met again in a new term.", "formula": {"payout": "max(0, sum(claims_in_policy_year) - deductible), capped at cover"}, "conditions": {"deductible": "= base/employer cover", "dates": "super top-up renewal aligned with base/employer policy year"}, "example": "Deductible Rs 5L, bills 7L then 3L in the same year -> super top-up pays 2L + 3L; a plain top-up pays 2L + 0."}, {"id": "claim_settlement_ratio", "type": "Ratio", "name": "Claim Settlement Ratio (CSR) and Incurred Claims Ratio (ICR)", "modules": ["M14"], "summary": "CSR = % of claims settled; it can be gamed (clearing last year's backlog, settling many small claims while rejecting large ones, combining motor/health for general insurers). Read it alongside ICR and scale (large customer base). Get the numbers from the IRDAI annual report.", "formula": {"csr": "claims_settled / (claims_booked + outstanding_start - outstanding_end)", "icr": "claims_paid / net_premiums_collected"}, "conditions": {"icr_high": ">100% -> insurer losing money (regulator may force merger)", "icr_low": "~50% -> may be stingy on large claims"}}, {"id": "porting", "type": "Process", "name": "Porting a Health Policy", "modules": ["M14"], "summary": "Move a policy to a new insurer while carrying over waiting-period credit. Apply 45-60 days before renewal and prove continuous coverage with documents; credit applies only up to the old sum insured (plus bonus) - extra cover serves fresh waiting periods; the new insurer may re-underwrite. Verdict - not a gimmick; usually better than buying fresh.", "params": {"window_days_before_renewal": "45-60"}}, {"id": "stop_loss", "type": "Rule", "name": "Stop Loss", "modules": [], "summary": "A pre-defined exit price that caps the loss on a trade; placed at a technical level (recent low/high, pattern low) or volatility-based (ATR/SD multiple) and never widened once placed."}, {"id": "dividend_yield", "type": "Ratio", "name": "Dividend Yield", "modules": [], "summary": "Dividend per share / market price per share; income return of a stock."}, {"id": "quantitative_analysis", "type": "Concept", "name": "Quantitative Analysis", "modules": [], "summary": "Systematic, data-driven analysis of prices and fundamentals using statistics; basis of trading systems and backtesting."}, {"id": "pivot_points", "type": "Indicator", "name": "Pivot Points", "modules": [], "summary": "Support/resistance levels derived from prior period H/L/C: P=(H+L+C)/3, R1=2P-L, S1=2P-H."}, {"id": "expectancy", "type": "Formula", "name": "Expectancy", "modules": [], "summary": "Average P&L per trade = win_rate * avg_win - loss_rate * avg_loss; a system must have positive expectancy after costs."}, {"id": "execution", "type": "Process", "name": "Trade Execution", "modules": [], " t": "module_m14", "rel": "COVERED_IN"}]};
const palette = ["#2563eb","#dc2626","#16a34a","#d97706","#7c3aed","#0891b2","#db2777","#65a30d","#ea580c","#4f46e5","#0d9488","#b45309","#9333ea","#e11d48","#0284c7","#15803d","#a16207","#6d28d9","#be123c","#475569"];
const types = [...new Set(DATA.nodes.map(n=>n.type))].sort();
const color = t => palette[types.indexOf(t)%palette.length];
const byId = new Map(DATA.nodes.map(n=>[n.id,n]));
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => typeof v==="string"?v:JSON.stringify(v);
types.forEach(t=>document.getElementById("type").append(new Option(t,t)));
Object.entries(DATA.meta.modules).forEach(([k,v])=>document.getElementById("mod").append(new Option(k+" "+v,k)));

const svg=d3.select("#svg"), g=svg.append("g");
svg.call(d3.zoom().scaleExtent([.1,6]).on("zoom",e=>g.attr("transform",e.transform)));
let sim, nodeSel, linkSel, labelSel, focus=null;

function visible(){
  const t=document.getElementById("type").value, m=document.getElementById("mod").value, r=document.getElementById("rulesOnly").checked;
  const ns=DATA.nodes.filter(n=>n.type!=="Module"&&(!t||n.type===t)&&(!m||n.modules.includes(m))&&(!r||n.conditions||n.formula));
  const ids=new Set(ns.map(n=>n.id));
  const es=DATA.edges.filter(e=>e.rel!=="COVERED_IN"&&ids.has(e.source.id??e.source)&&ids.has(e.target.id??e.target));
  return {ns,es};
}
function draw(){
  const {ns,es}=visible();
  const deg=new Map(); es.forEach(e=>{const s=e.source.id??e.source,t=e.target.id??e.target;deg.set(s,(deg.get(s)||0)+1);deg.set(t,(deg.get(t)||0)+1)});
  document.getElementById("stats").textContent=`${ns.length} nodes · ${es.length} edges`;
  g.selectAll("*").remove();
  const links=es.map(e=>({source:e.source.id??e.source,target:e.target.id??e.target,rel:e.rel}));
  linkSel=g.append("g").selectAll("line").data(links).join("line").attr("stroke","var(--edge)").attr("stroke-width",1);
  nodeSel=g.append("g").selectAll("circle").data(ns,d=>d.id).join("circle")
    .attr("r",d=>4+Math.sqrt(deg.get(d.id)||0)*1.8).attr("fill",d=>color(d.type)).attr("stroke","var(--panel)").attr("stroke-width",1)
    .style("cursor","pointer").on("click",(e,d)=>select(d.id))
    .call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
  nodeSel.append("title").text(d=>`${d.name} [${d.type}]`);
  labelSel=g.append("g").selectAll("text").data(ns.filter(d=>(deg.get(d.id)||0)>=8)).join("text").text(d=>d.name.length>28?d.name.slice(0,26)+"…":d.name).attr("dx",8).attr("dy",3);
  const box=document.getElementById("graph").getBoundingClientRect();
  sim=d3.forceSimulation(ns).force("link",d3.forceLink(links).id(d=>d.id).distance(40).strength(.4))
    .force("charge",d3.forceManyBody().strength(-60)).force("center",d3.forceCenter(box.width/2,box.height/2))
    .force("collide",d3.forceCollide(8)).on("tick",()=>{
      linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
      nodeSel.attr("cx",d=>d.x).attr("cy",d=>d.y); labelSel.attr("x",d=>d.x).attr("y",d=>d.y);});
  if(focus) highlight(focus);
}
function neighbours(id){const s=new Set([id]);DATA.edges.forEach(e=>{const a=e.source.id??e.source,b=e.target.id??e.target;if(e.rel==="COVERED_IN")return;if(a===id)s.add(b);if(b===id)s.add(a)});return s}
function highlight(id){const s=neighbours(id);nodeSel.attr("opacity",d=>s.has(d.id)?1:.12).attr("stroke",d=>d.id===id?"var(--ink)":"var(--panel)").attr("stroke-width",d=>d.id===id?2.5:1);
  linkSel.attr("stroke",d=>(d.source.id===id||d.target.id===id)?"var(--accent)":"var(--edge)").attr("opacity",d=>(d.source.id===id||d.target.id===id)?1:.15)}
function select(id){
  focus=id; const n=byId.get(id); if(!n)return;
  if(nodeSel) highlight(id);
  const out=[],inn=[];
  DATA.edges.forEach(e=>{const a=e.source.id??e.source,b=e.target.id??e.target;if(e.rel==="COVERED_IN")return;if(a===id)out.push([e.rel,b]);if(b===id)inn.push([e.rel,a])});
  const kv=(o)=>"<ul>"+Object.entries(o).map(([k,v])=>`<li><b style="display:inline;text-transform:none;color:var(--ink)">${esc(k)}</b>: <code>${esc(fmt(v))}</code></li>`).join("")+"</ul>";
  const list=a=>"<ul>"+a.map(x=>`<li>${esc(fmt(x))}</li>`).join("")+"</ul>";
  const lk=a=>"<ul>"+a.map(([r,o])=>`<li><span class="tag">${r}</span><a class="nl" data-id="${esc(o)}">${esc(byId.get(o)?.name??o)}</a></li>`).join("")+"</ul>";
  let h=`<h2>${esc(n.name)}</h2><span class="tag" style="border-color:${color(n.type)};color:${color(n.type)}">${n.type}</span>${n.modules.map(m=>`<span class="tag">${m}</span>`).join("")}<code>${esc(n.id)}</code><p>${esc(n.summary)}</p>`;
  if(n.aliases) h+=`<div class="sec"><b>Aliases</b>${esc(n.aliases.join(", "))}</div>`;
  if(n.formula) h+=`<div class="sec"><b>Formula</b>${kv(n.formula)}</div>`;
  if(n.conditions) h+=`<div class="sec"><b>Conditions (bot rules)</b>${kv(n.conditions)}</div>`;
  if(n.params) h+=`<div class="sec"><b>Parameters</b>${kv(n.params)}</div>`;
  if(n.bot_use) h+=`<div class="sec"><b>Bot use</b>${esc(n.bot_use)}</div>`;
  if(n.facts) h+=`<div class="sec"><b>Facts</b>${list(n.facts)}</div>`;
  if(n.example) h+=`<div class="sec"><b>Example</b>${esc(n.example)}</div>`;
  if(n.caveats) h+=`<div class="sec"><b>Caveats</b>${list(n.caveats)}</div>`;
  if(out.length) h+=`<div class="sec"><b>Links</b>${lk(out)}</div>`;
  if(inn.length) h+=`<div class="sec"><b>Backlinks</b>${lk(inn)}</div>`;
  const d=document.getElementById("detail"); d.innerHTML=h; d.scrollTop=0;
  d.querySelectorAll("a.nl").forEach(a=>a.onclick=()=>select(a.dataset.id));
}
const q=document.getElementById("q"), res=document.getElementById("results");
q.oninput=()=>{const t=q.value.toLowerCase().trim(); if(!t){res.style.display="none";return}
  const hits=DATA.nodes.filter(n=>n.type!=="Module").map(n=>{const nm=n.name.toLowerCase(),al=(n.aliases||[]).join(" ").toLowerCase();
    const s=(nm.includes(t)?3:0)+(n.id.includes(t.replace(/\s+/g,"_"))?2:0)+(al.includes(t)?2:0)+((n.summary||"").toLowerCase().includes(t)?1:0);return [s,n]})
    .filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,15);
  res.innerHTML=hits.map(([,n])=>`<div data-id="${esc(n.id)}"><span class="tag">${n.type}</span>${esc(n.name)}</div>`).join("")||"<div>No match</div>";
  res.style.display="block"; res.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>{select(el.dataset.id);res.style.display="none"})};
["type","mod","rulesOnly"].forEach(i=>document.getElementById(i).onchange=draw);
document.getElementById("reset").onclick=()=>{focus=null;["type","mod"].forEach(i=>document.getElementById(i).value="");document.getElementById("rulesOnly").checked=false;q.value="";res.style.display="none";draw()};
draw();
</script>
