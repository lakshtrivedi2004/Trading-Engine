<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Knowledge Graph</title>
<style>
:root{--bg:#f7f7f5;--panel:#ffffff;--ink:#1d1d1b;--muted:#6b6b66;--line:#d9d9d4;--accent:#2563eb;--edge:rgba(60,60,60,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141414;--panel:#1d1d1d;--ink:#ececea;--muted:#9a9a94;--line:#333;--accent:#7aa2ff;--edge:rgba(220,220,220,.14)}}
:root[data-theme="dark"]{--bg:#141414;--panel:#1d1d1d;--ink:#ececea;--muted:#9a9a94;--line:#333;--accent:#7aa2ff;--edge:rgba(220,220,220,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:600}
input,select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input{flex:1;min-width:140px;max-width:340px}
input[type=checkbox]{flex:none;min-width:0;padding:0;margin:0 4px 0 0;vertical-align:middle}
#stats{color:var(--muted);font-size:12px;margin-left:auto}
main{flex:1;display:flex;min-height:0}
#graph{flex:1;min-width:0;position:relative}
svg{width:100%;height:100%;display:block;cursor:grab}
aside{width:400px;max-width:45vw;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px}
aside h2{font-size:16px;margin:0 0 4px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.sec{margin-top:12px}.sec b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
code{font-size:12px;background:var(--bg);padding:1px 4px;border-radius:4px;word-break:break-word}
ul{padding-left:18px;margin:4px 0}
a.nl{color:var(--accent);cursor:pointer;text-decoration:none}
#results{position:absolute;top:8px;left:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;max-height:50%;overflow:auto;display:none;z-index:2;min-width:260px}
#results div{padding:5px 10px;cursor:pointer}#results div:hover{background:var(--bg)}
text{fill:var(--ink);font-size:10px;pointer-events:none}
@media (max-width:760px){main{flex-direction:column}aside{width:auto;max-width:none;height:45%;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Market Knowledge Graph</h1>
  <input id="q" placeholder="Search concepts, indicators, strategies…" autocomplete="off">
  <select id="type"><option value="">All types</option></select>
  <select id="mod"><option value="">All modules</option></select>
  <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="rulesOnly"> bot rules only</label>
  <button id="reset">Reset</button>
  <span id="stats"></span>
</header>
<main>
  <div id="graph"><div id="results"></div><svg id="svg"></svg></div>
  <aside id="detail"><p style="color:var(--muted)">Click a node to see its definition, formulas, machine-readable conditions and links. Search to jump to a node. Scroll to zoom, drag to pan.</p></aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const DATA = {"meta": {"modules": {"M01": "Introduction to Stock Markets", "M02": "Technical Analysis", "M03": "Fundamental Analysis", "M04": "Futures Trading", "M05": "Options Theory for Professional Trading", "M06": "Option Strategies", "M07": "Markets and Taxation", "M08": "Currency and Commodity Futures", "M09": "Risk Management and Trading Psychology", "M10": "Trading Systems", "M11": "Personal Finance", "M13": "Integrated Financial Modelling", "M14": "Personal Finance - Insurance"}}, "nodes": [{"id": "module_m01", "type": "Module", "name": "M01 - Introduction to Stock Markets", "modules": ["M01"], "summary": "Why invest, asset classes, market ecosystem (SEBI, brokers, depositories, clearing), IPO lifecycle, how stocks move, returns math, indices, jargon, order types, settlement, corporate actions, macro events, developing a point of view."}, {"id": "investing", "type": "Concept", "name": "Investing", "modules": ["M01"], "summary": "Deploying surplus cash into asset classes to fight inflation, create wealth and meet financial goals.", "facts": [{"Idle cash loses to inflation; example": "Rs 20k/month surplus held as cash for 20 yrs ~ Rs 1.7 Cr vs ~Rs 4.26 Cr invested at 12%."}, "Corpus is highly sensitive to rate of return; small rate changes have large compounding impact.", "Reasons to invest - fight inflation, create wealth, meet life's financial aspirations."]}, {"id": "asset_class", "type": "Concept", "name": "Asset Class", "modules": ["M01"], "summary": "A category of investment with particular risk and return characteristics - fixed income, equity, real estate, commodities (precious metals).", "facts": ["Fixed income - limited risk to principal, interest paid periodically, capital returned at maturity; ~8-11% (2014).", "Equity - no capital guarantee; Indian equities ~14-15% CAGR over 15 years; best companies >20% CAGR.", "Real estate - rental income + capital appreciation; large outlay, illiquid, no official return metric.", "Bullion (gold/silver) - ~8% CAGR over 20 years; via jewelry or ETFs.", "Risk and return go hand in hand.", "Fixed income can lose in real terms - a 9% FD with 10% inflation = -1% real return."]}, {"id": "fixed_income", "type": "Instrument", "name": "Fixed Income Instruments", "modules": ["M01"], "aliases": ["Bonds", "Fixed Deposits", "Debt instruments"], "summary": "Instruments with limited principal risk paying interest (FDs, G-secs, PSU bonds like HUDCO/NHAI, corporate bonds)."}, {"id": "equity", "type": "Instrument", "name": "Equity (Shares)", "modules": ["M01"], "aliases": ["Stocks", "Shares"], "summary": "Part-ownership of a publicly listed company traded on BSE/NSE; highest long-run return, no capital guarantee.", "facts": ["A share represents part ownership; owner entitled to dividends, bonus, splits, rights, voting.", "Buying a share means taking the same kind of risk as the promoter, scaled by holding."]}, {"id": "asset_allocation", "type": "Concept", "name": "Asset Allocation", "modules": ["M01"], "summary": "Allocating money across asset classes based on risk appetite.", "facts": ["Young professional example - ~70% equity, 20% precious metals, 10% fixed income.", "Retired example - ~80% fixed income, 10% equity, 10% precious metals."]}, {"id": "stock_exchange", "type": "Participant", "name": "Stock Exchange (NSE / BSE)", "modules": ["M01"], "aliases": ["NSE", "BSE", "National Stock Exchange", "Bombay Stock Exchange", "Stock Market"], "summary": "Electronic marketplace matching buyers and sellers; India's two main exchanges are NSE and BSE.", "facts": ["Exists electronically; accessed only via a registered stock broker.", "Exchange's order-matching algorithm pairs orders; seller can be one or many counterparties.", "Different opinions make a market - a trade needs an opposing view.", "Regional exchanges are being phased out."]}, {"id": "market_participants", "type": "Participant", "name": "Market Participants", "modules": ["M01"], "summary": "Domestic retail, NRI/OCI, domestic institutions (e.g. LIC), domestic AMCs (mutual funds), Foreign Institutional Investors (FIIs).", "facts": ["FIIs transact large amounts so their activity moves market sentiment.", "Everyone's agenda is to make profitable transactions; greed/fear drive unfair practices, hence regulation."]}, {"id": "fii", "type": "Participant", "name": "Foreign Institutional Investors (FII/FPI)", "modules": ["M01"], "aliases": ["FII", "FPI"], "summary": "Foreign corporates/funds/individuals investing in India in large size; flows impact sentiment.", "bot_use": "Track FII net buy/sell flows as a sentiment input."}, {"id": "sebi", "type": "Participant", "name": "SEBI (Securities and Exchange Board of India)", "modules": ["M01"], "aliases": ["SEBI", "Regulator"], "summary": "India's securities market regulator - develops exchanges, protects retail investors, regulates participants and intermediaries.", "facts": ["Ensures exchanges, brokers, corporates act fairly; prevents manipulation by large investors; protects retail.", "Regulates CRAs (CRISIL, ICRA, CARE), debenture trustees, depositories (NSDL, CDSL), DPs, FIIs, merchant bankers, AMCs, PMS (min Rs 25 lakh at the time), brokers/sub-brokers.", "Has final say on whether a company can go public.", "Publishes entity rules in its 'Legal Framework' section."]}, {"id": "stock_broker", "type": "Participant", "name": "Stock Broker", "modules": ["M01"], "summary": "SEBI-registered trading member of an exchange; your gateway to markets via a trading account.", "facts": ["Services - market access, margins, dealing/software support, contract notes, fund transfers, back office.", "Access modes - call & trade, web, trading terminal (e.g. Zerodha Kite).", "Charges brokerage for services."]}, {"id": "trading_account", "type": "Concept", "name": "Trading Account", "modules": ["M01"], "summary": "Account with a broker used to buy/sell securities; linked to a DEMAT account and exactly one bank account.", "facts": ["Only one bank account (in your own name) can be linked to a trading account at a time."]}, {"id": "demat_account", "type": "Concept", "name": "DEMAT Account", "modules": ["M01"], "summary": "Electronic vault holding dematerialised shares, maintained by a depository (NSDL or CDSL) through a Depository Participant.", "facts": ["Paper certificates converted to electronic form post-1996 ('dematerialisation').", "Only two depositories in India - NSDL and CDSL.", "You open a DEMAT account through a DP (agent of the depository)."]}, {"id": "depository", "type": "Participant", "name": "Depository (NSDL / CDSL) and Depository Participant", "modules": ["M01"], "aliases": ["NSDL", "CDSL", "DP"], "summary": "NSDL and CDSL hold securities electronically; DPs (banks/brokers) are their agents."}, {"id": "clearing_corporation", "type": "Participant", "name": "Clearing Corporation (NSCCL / ICCL)", "modules": ["M01"], "aliases": ["NSCCL", "ICCL", "NSE Clearing"], "summary": "Exchange subsidiaries that guarantee settlement - match debits/credits and prevent default."}, {"id": "company_funding_lifecycle", "type": "Process", "name": "Company Funding Lifecycle", "modules": ["M01"], "summary": "Seed (promoter + angels) -> Series A (VC) -> Series B -> Series C (Private Equity) -> IPO; valuation rises as revenue/profit validate business.", "formula": {"implied_valuation": "investment_amount / stake_fraction"}, "facts": ["Angel investors invest pre-revenue, take maximum risk (as much as promoter), small amounts.", "Seed fund becomes initial share capital in the company's bank account.", "Face value - nominal denomination per share (e.g. Rs 10).", "Authorized shares - total shares available; issued shares are a subset allotted to holders.", "VC invests early-stage, smaller amounts; PE invests large sums in mature firms and takes board seats.", "Capex can be funded by internal accruals, equity (VC/PE/IPO) or debt (loans/bonds).", "Implied valuation = investment / stake (e.g. 7 Cr for 14% => 50 Cr).", "Credible prior VC/PE rounds are a quality signal for IPO companies."]}, {"id": "capex", "type": "Concept", "name": "Capital Expenditure (Capex)", "modules": ["M01"], "summary": "Spending to expand/improve the business (plants, stores, capacity)."}, {"id": "face_value", "type": "Concept", "name": "Face Value (Par Value)", "modules": ["M01"], "aliases": ["FV", "Par value"], "summary": "Fixed nominal denomination of a share; dividends and splits are referenced to it.", "facts": ["Dividend % = dividend per share / face value (Infosys Rs 42 on FV 5 => 840%)."]}, {"id": "ipo", "type": "Process", "name": "Initial Public Offering (IPO)", "modules": ["M01"], "aliases": ["IPO", "Primary Market issue"], "summary": "First offer of a company's shares to the public, moving it from private to listed (primary -> secondary market).", "bot_use": "Subscription multiple and anchor/VC pedigree are pre-listing sentiment features; listing day = start of secondary trading.", "facts": ["Reasons - raise capex funds, spread promoter risk, exit for early investors, reward employees via ESOPs, visibility.", "Sequence - appoint merchant banker -> registration statement to SEBI -> SEBI nod -> DRHP -> road show -> price band -> book building -> closure -> listing day.", "DRHP contents - IPO size, shares offered, use of funds with timeline, business model, financials, MD&A, risks, management.", "Book building - investors bid within the price band; listing price usually where max bids received.", "Undersubscription signals negative sentiment; oversubscription Nx = bids/shares offered.", "Green shoe option - over-allotment up to ~15% extra shares if oversubscribed.", "Fixed price IPO has no band; cut-off price = final discovered price within band.", "Most Indian IPOs follow book building."], "caveats": ["Investors should read the DRHP; some companies list without healthy prior funding rounds."]}, {"id": "merchant_banker", "type": "Participant", "name": "Merchant Banker (BRLM / Lead Manager)", "modules": ["M01"], "aliases": ["BRLM", "Book Running Lead Manager"], "summary": "Assists IPO - due diligence, DRHP, underwriting, price band, road shows, appointing registrars/bankers."}, {"id": "drhp", "type": "Concept", "name": "Draft Red Herring Prospectus (DRHP)", "modules": ["M01"], "aliases": ["DRHP"], "summary": "Public IPO disclosure document with business, financials, use of proceeds, risks and management."}, {"id": "primary_market", "type": "Concept", "name": "Primary vs Secondary Market", "modules": ["M01"], "summary": "Primary market = IPO bidding/issuance; secondary market = trading on exchange after listing."}, {"id": "fpo", "type": "Process", "name": "Follow-on Public Offer (FPO)", "modules": ["M01"], "aliases": ["FPO"], "summary": "Post-listing public issue of fresh (dilutive) shares via DRHP + book building, used to fund new projects; rare since OFS (2012).", "example": "Engineers India FPO Feb 2014, band 145-150, 3x oversubscribed, lower band 4.2% below market."}, {"id": "ofs", "type": "Process", "name": "Offer for Sale (OFS)", "modules": ["M01"], "aliases": ["OFS"], "summary": "Exchange window for promoters to sell existing shares (no new shares) at/above a floor price; also to meet minimum public shareholding.", "facts": ["Only top 200 companies by market cap may use OFS (per source).", "Allotment settled to demat T+1.", "PSU minimum public shareholding 25% example."], "example": "NTPC OFS Aug 2017, 46.35 mn shares, floor Rs 168, fully subscribed."}, {"id": "price_drivers", "type": "Concept", "name": "What Moves Stock Prices", "modules": ["M01"], "summary": "Prices move on news/events (company, industry, economy) and expectations, and on demand-supply imbalance even without news.", "bot_use": "News/event sentiment and sector contagion features; liquidity filter - illiquid names don't respond.", "facts": ["Good news -> buyers lift offers repeatedly -> price rally (Infosys new CEO example 3000->3016 in 5 min).", "Industry-wide news (e.g. NASSCOM cutting IT budget outlook) hits all sector stocks.", "Large liquid stocks move even without news; illiquid small caps may barely move.", "Macro/political events (e.g. 2014 election) move the whole market."]}, {"id": "holding_period", "type": "Concept", "name": "Holding Period", "modules": ["M01"], "summary": "Period you intend to hold a position - minutes to forever."}, {"id": "absolute_return", "type": "Formula", "name": "Absolute Return", "modules": ["M01"], "summary": "Percentage gain irrespective of time.", "formula": {"absolute_return_pct": "(end_value / start_value - 1) * 100"}, "conditions": {"use_when": "holding period <= 1 year"}, "example": "Buy 3030, sell 3550 => 17.16%."}, {"id": "cagr", "type": "Formula", "name": "Compounded Annual Growth Rate (CAGR)", "modules": ["M01"], "aliases": ["CAGR"], "summary": "Annualised growth rate over multiple years.", "formula": {"cagr": "(end_value / start_value) ** (1 / years) - 1"}, "conditions": {"use_when": "holding period > 1 year"}, "facts": ["Compare returns only on an annualised basis; 17.16% in 6 months ~ 34.32% annualised (simple)."], "example": "3030 -> 3550 over 2 years => 8.2% CAGR (below an 8.5% FD)."}, {"id": "trader_types", "type": "Concept", "name": "Trader and Investor Types", "modules": ["M01"], "summary": "Traders (short view, unbiased long/short) vs investors (multi-year holding).", "facts": ["Day trader - opens and closes intraday, no overnight risk, ~5-6 stocks/day.", "Scalper - very large size, very short hold, tiny per-share profit (e.g. 10,000 sh x Rs 0.10).", "Swing trader - holds days to weeks.", "Growth investor - companies growing on industry/macro trends.", "Value investor - good companies beaten down by short-term sentiment (L&T 1200->690->1440).", "Traders and investors differ on risk-taking ability and holding period."]}, {"id": "market_index", "type": "Concept", "name": "Stock Market Index (Nifty / Sensex)", "modules": ["M01"], "aliases": ["Nifty", "Nifty 50", "Sensex", "CNX Nifty", "S&P BSE Sensex", "Index"], "summary": "Basket of large, liquid stocks acting as a barometer of the market/economy; Nifty (NSE) and Sensex (BSE).", "bot_use": "Benchmark strategy returns against Nifty; use index as regime/market-trend filter; hedge with index futures.", "facts": ["Uses - information, benchmarking performance, trading (via derivatives), portfolio hedging.", "Index up = participants optimistic about future; down = pessimistic.", "Weights by free-float market capitalisation; stocks must keep qualifying or get replaced.", "A stock's weight is the share of index movement attributable to it (e.g. ITC 7.6% in 2014).", "Sectoral indices - Bank Nifty, CNX IT etc.", "Majority of traders trade the index."]}, {"id": "sectoral_index", "type": "Concept", "name": "Sectoral Index", "modules": ["M01"], "aliases": ["Bank Nifty", "Nifty Bank", "CNX IT", "Nifty IT"], "summary": "Index of a specific sector (Bank Nifty, CNX IT) reflecting sector sentiment."}, {"id": "free_float_market_cap", "type": "Formula", "name": "Free Float Market Capitalisation", "modules": ["M01"], "summary": "Market value of shares available for trading; basis of Indian index weights.", "formula": {"free_float_mcap": "free_float_shares * price", "weight_i": "ffmcap_i / sum(ffmcap)"}}, {"id": "bull_bear_market", "type": "Concept", "name": "Bull / Bear Market", "modules": ["M01"], "aliases": ["Bullish", "Bearish"], "summary": "Bullish = expecting rise (index rising period = bull market); bearish = expecting fall."}, {"id": "trend", "type": "Concept", "name": "Trend", "modules": ["M01"], "summary": "General market direction and its strength - bullish, bearish or sideways."}, {"id": "week52_high_low", "type": "Concept", "name": "52-Week High / Low and All-Time High / Low", "modules": ["M01"], "summary": "Highest/lowest traded price over last 52 weeks (or since listing).", "conditions": {"bullish_hint": "close >= max(high, 252 sessions)", "bearish_hint": "close <= min(low, 252 sessions)"}, "bot_use": "Breakout/momentum filter.", "facts": ["Many believe a 52-week high indicates a bullish trend ahead and a 52-week low a bearish trend."]}, {"id": "long_position", "type": "Concept", "name": "Long Position", "modules": ["M01"], "summary": "Buy first, sell later; bullish; profit if price rises."}, {"id": "short_position", "type": "Concept", "name": "Short Position (Shorting)", "modules": ["M01"], "summary": "Sell first (borrowed), buy back later; bearish; profit if price falls, loss if it rises.", "facts": ["Exchange handles borrowing/returning in the background.", "Multi-day shorts are best done in the derivatives market (equity cash shorts are intraday)."]}, {"id": "square_off", "type": "Concept", "name": "Square Off", "modules": ["M01"], "summary": "Closing an existing position - sell to close a long, buy to close a short (not a new short/long)."}, {"id": "intraday_position", "type": "Concept", "name": "Intraday Position", "modules": ["M01"], "summary": "Position initiated with intent to square off the same day."}, {"id": "ohlc", "type": "Concept", "name": "OHLC and Volume", "modules": ["M01"], "aliases": ["Open High Low Close", "Volume"], "summary": "Open, high, low, close prices of a period; volume = total shares transacted.", "facts": ["Open is fixed once set; high and low update as price trades intraday."]}, {"id": "market_segment", "type": "Concept", "name": "Market Segments", "modules": ["M01"], "summary": "Capital market (equity 'EQ', preference shares, warrants, ETFs), Futures & Options (leveraged derivatives), Wholesale Debt Market (G-secs, T-bills, bonds)."}, {"id": "trading_terminal", "type": "Product", "name": "Trading Terminal / Market Watch", "modules": ["M01"], "aliases": ["Kite", "Market Watch"], "summary": "Broker software to view quotes (LTP, % change, OHLC, volume), market depth and place/modify orders.", "facts": ["Order book tracks orders (open/completed/rejected) and allows modify/cancel; trade book shows executed trades.", "Market depth (snap quote) shows top 5 bid/ask levels with order counts and quantities."]}, {"id": "order_types", "type": "Concept", "name": "Order Types (Limit, Market, SL, SL-M)", "modules": ["M01"], "aliases": ["Limit order", "Market order", "Stop loss order", "SL-M"], "summary": "Limit = specific price (may not fill); Market = immediate at available prices (price uncertainty); SL/SL-M = passive stop that activates at trigger price.", "conditions": {"long_stop": {"trigger_price": "> stop_price", "activates_when": "ltp <= trigger_price"}}, "bot_use": "Prefer limit orders to control slippage; place SL/SL-M orders immediately after entry.", "facts": ["Market orders walk the book and fill at multiple prices; dangerous for active traders in fast markets.", "Stop loss is passive until trigger price is crossed; for a long, trigger is set slightly above the SL limit price (e.g. trigger 256, SL 255)."]}, {"id": "product_types", "type": "Concept", "name": "Product Types (CNC, MIS, NRML)", "modules": ["M01"], "aliases": ["CNC", "MIS", "NRML"], "summary": "CNC = delivery (hold in demat); MIS = intraday margin product (auto square-off); NRML = normal (carry-forward F&O)."}, {"id": "mis_product", "type": "Product", "name": "MIS (Margin Intraday Square-off)", "modules": ["M01"], "aliases": ["MIS"], "summary": "Intraday leveraged product squared off same day."}, {"id": "bid_ask", "type": "Concept", "name": "Bid, Ask and Market Depth", "modules": ["M01"], "aliases": ["Bid price", "Ask price", "Offer", "Order book depth", "Spread"], "summary": "Bid = best prices buyers will pay; ask/offer = prices sellers demand; depth shows top 5 levels each side.", "formula": {"spread": "best_ask - best_bid", "mid": "(best_ask + best_bid)/2"}, "bot_use": "Estimate slippage by walking the depth for order size; use bid/ask totals as order-flow imbalance feature.", "facts": ["Lowest ask has highest priority for sellers; highest bid for buyers (price priority).", "A market buy of 10 shares with 2 @ best ask fills across several levels and moves LTP.", "Understanding order stacking is critical for intraday traders."]}, {"id": "clearing_and_settlement", "type": "Process", "name": "Clearing and Settlement (T+2 per source)", "modules": ["M01"], "aliases": ["T+2", "T+1", "Settlement cycle"], "summary": "Buy on T day - funds + charges debited T; shares credited to demat end of T+2 (per source); sale proceeds credited T+2.", "facts": ["Contract note issued on T day for all trades.", "BTST (buy today sell tomorrow) sells shares not yet in demat - risk of short delivery, esp. in B-group/illiquid stocks.", "Sold shares are blocked immediately."], "caveats": ["Source describes T+2; India moved to T+1 settlement in 2023 - verify current cycle."]}, {"id": "btst", "type": "Strategy", "name": "BTST / ATST", "modules": ["M01"], "aliases": ["Buy Today Sell Tomorrow"], "summary": "Selling shares bought the previous day before they reach demat.", "caveats": ["Short-delivery/auction risk especially in illiquid and B-group stocks; avoid unless risk understood."]}, {"id": "contract_note", "type": "Concept", "name": "Contract Note", "modules": ["M01"], "summary": "Legal record of trades and charges issued by broker on trade day."}, {"id": "transaction_charges", "type": "Concept", "name": "Transaction Charges (brokerage, STT, exchange fees, GST, SEBI fees, stamp duty)", "modules": ["M01"], "aliases": ["Charges", "STT", "Brokerage"], "summary": "Costs on every trade - brokerage, Securities Transaction Tax, exchange transaction charges, service tax/GST, SEBI turnover fee.", "bot_use": "Always deduct full round-trip costs in backtests; costs dominate high-frequency strategies.", "example": "2014 delivery buy of Rs 1,00,000 - brokerage 20, STT 100 (0.1%), txn 3.25, tax ~2.9, SEBI 0.2 => ~Rs 126.", "caveats": ["Rates in source are dated; use current schedule."]}, {"id": "corporate_actions", "type": "Event", "name": "Corporate Actions", "modules": ["M01"], "summary": "Board-initiated, shareholder-approved actions that change the stock - dividends, bonus, split, rights, buyback.", "bot_use": "Adjust historical prices for splits/bonuses; flag ex-dates to avoid false gaps in signals."}, {"id": "dividend", "type": "Event", "name": "Dividend", "modules": ["M01"], "summary": "Distribution of profits (or reserves) per share, expressed as % of face value; interim or final.", "bot_use": "Price drops roughly by dividend amount on ex-date - adjust backtests; dividend arbitrage awareness.", "facts": ["Not mandatory; can be paid from reserves even in a loss year.", "Timeline - declaration date (AGM) -> ex-dividend date -> record date (~30 days after declaration); stock is cum-dividend until ex-date.", "Ex-date is set ~2 business days before record date due to T+2; buy before ex-date to be entitled.", "High payout makes sense when growth opportunities are exhausted."]}, {"id": "bonus_issue", "type": "Event", "name": "Bonus Issue", "modules": ["M01"], "summary": "Free shares from reserves in a fixed ratio (e.g. 2:1 = 2 new per 1 held); share count rises, price adjusts, value unchanged.", "formula": {"post_price": "pre_price * held / (held + bonus)"}, "facts": ["Done to improve retail affordability/liquidity when share price is high."], "example": "1:1 - 100 sh @75 -> 200 sh @37.5; value 7,500 unchanged."}, {"id": "stock_split", "type": "Event", "name": "Stock Split", "modules": ["M01"], "summary": "Face value split (e.g. FV 10 -> 5); shares multiply, price divides, market cap unchanged.", "formula": {"split_factor": "old_fv / new_fv", "post_price": "pre_price / split_factor"}, "example": "FV 10 -> 2 (1:5) - 100 sh @900 -> 500 sh @180."}, {"id": "rights_issue", "type": "Event", "name": "Rights Issue", "modules": ["M01"], "summary": "Fresh capital raised from existing shareholders in proportion to holding (e.g. 1:4) at a discount; dilutive.", "caveats": ["Don't be swayed by discount; if market price < rights price", "buy in market instead."]}, {"id": "buyback", "type": "Event", "name": "Share Buyback", "modules": ["M01"], "summary": "Company buys back its own shares, reducing share count.", "facts": ["Reasons - improve EPS, consolidate promoter stake, prevent takeover, signal confidence, support price.", "Usually positive for share price."]}, {"id": "market_events", "type": "Event", "name": "Key Macro Events", "modules": ["M01"], "summary": "Monetary policy, inflation, IIP, PMI, Budget and quarterly earnings move markets."}, {"id": "monetary_policy", "type": "Event", "name": "RBI Monetary Policy (Repo, Reverse Repo, CRR)", "modules": ["M01"], "aliases": ["RBI policy", "Repo rate", "Reverse repo", "CRR"], "summary": "RBI balances growth vs inflation via key rates; reviewed periodically (quarterly per source).", "bot_use": "Event-day volatility regime; sector rotation on rate decisions.", "facts": ["Repo - rate at which RBI lends to banks; higher = costlier borrowing, slower growth; markets dislike hikes.", "Reverse repo - rate at which RBI borrows from banks; hike tightens money supply.", "CRR - share of deposits banks must keep with RBI; higher CRR drains liquidity.", "Rate-sensitive sectors react first - banks, autos, housing finance, real estate, metals.", "Higher rates curb inflation; lower rates tend to raise inflation."]}, {"id": "interest_rates", "type": "Concept", "name": "Interest Rates", "modules": ["M01"], "summary": "Cost of money; drives borrowing, growth, inflation, bond prices, currency and futures pricing."}, {"id": "inflation", "type": "Concept", "name": "Inflation (CPI / WPI)", "modules": ["M01"], "aliases": ["CPI", "WPI"], "summary": "Sustained rise in general prices measured by WPI (wholesale) and CPI (retail); MOSPI publishes CPI ~2nd week monthly.", "facts": ["High inflation is a bad signal for markets.", "CPI is what matters to consumers."]}, {"id": "iip", "type": "Event", "name": "Index of Industrial Production (IIP)", "modules": ["M01"], "aliases": ["IIP"], "summary": "Monthly industrial production index by MOSPI; rising = positive for markets; low IIP pressures RBI to cut rates."}, {"id": "pmi", "type": "Event", "name": "Purchasing Managers Index (PMI)", "modules": ["M01"], "aliases": ["PMI"], "summary": "Survey-based manufacturing/services activity index.", "conditions": {"expansion": "pmi > 50", "contraction": "pmi < 50", "no_change": "pmi == 50"}}, {"id": "union_budget", "type": "Event", "name": "Union Budget", "modules": ["M01"], "summary": "Annual finance ministry presentation (around Feb 1 now; last week of Feb per source) with policy/tax changes; strong market reactions.", "example": "July 2014 cigarette duty hike -> ITC -3.5% and index drag since ITC is a heavyweight."}, {"id": "earnings_announcement", "type": "Event", "name": "Quarterly Earnings Announcement", "modules": ["M01"], "summary": "Listed companies report quarterly revenue, expenses, taxes, profit and sometimes guidance.", "conditions": {"signal": "sign(actual - consensus)", "in_line": "flat_to_negative_bias"}, "bot_use": "Earnings-surprise strategies; avoid holding through results unless intended; widen stops/IV crush awareness.", "facts": ["Price reacts to actual vs street expectation - beat = up, miss = down, in-line = flat with negative bias.", "Indian quarters - Q1 Apr-Jun (results ~July), Q2 Jul-Sep (~Oct), Q3 Oct-Dec (~Jan), Q4 Jan-Mar (~Apr); Infosys usually reports first."]}, {"id": "point_of_view", "type": "Concept", "name": "Point of View (POV) and Instrument Selection", "modules": ["M01"], "aliases": ["POV"], "summary": "Success requires a researched directional view (via FA, TA, quant) plus choosing the right instrument to express it.", "bot_use": "Map signal horizon/conviction to instrument - equity for long-term, futures for short-term directional, options for capped-risk/event trades.", "facts": ["Methods - Fundamental, Technical, Quantitative analysis, outside views (avoid relying on outside views).", "Long-term very bullish -> delivery equity; short-term (1 week) bullish -> futures; bullish with limited risk -> options.", "Bullish can be expressed via spot, futures, calls, puts combos or synthetic positions."]}, {"id": "module_m02", "type": "Module", "name": "M02 - Technical Analysis", "modules": ["M02"], "summary": "TA assumptions, chart types, timeframes, 16 candlestick patterns with entry/stop rules, support & resistance, volume, moving averages, RSI, MACD, Bollinger Bands, Fibonacci, Dow Theory, range breakouts, flags, RRR, the 6-point checklist, scanning process, scalping, and supplementary indicators (ADX, Alligator, Aroon, ATR, ATR bands, Supertrend, VWAP)."}, {"id": "technical_analysis", "type": "Concept", "name": "Technical Analysis (TA)", "modules": ["M02"], "aliases": ["TA"], "summary": "Research technique identifying trading opportunities from market participants' actions (price/volume) visualised as charts and patterns.", "facts": ["Best for short-term trades (minutes to weeks); use FA for long-term investments; FA investors can use TA to time entries/exits.", "Expect small but consistent profits from frequent short-term trades, not windfalls.", "Cut losses quickly; do not hold losing TA trades hoping to recover.", "Applicable to any asset with OHLCV time series - equities, commodities, FX, fixed income; indicators work identically across assets.", "TA vs FA is not a contest; prudent traders learn both.", "Assumptions - (1) markets discount everything, (2) 'how' matters more than 'why', (3) price moves in trends, (4) history tends to repeat itself.", "History repeats only when the same set of factors recurs (factor addendum).", "Indian market hours 9:15 to 15:30."]}, {"id": "close_price_importance", "type": "Concept", "name": "Closing Price is Most Important", "modules": ["M02"], "summary": "Close is the final evaluation of the period, the reference for next session and the basis of most indicators; close > open = positive day."}, {"id": "chart_types", "type": "Concept", "name": "Chart Types (Line, Bar, Candlestick)", "modules": ["M02"], "summary": "Line chart plots closes only (trend view, little info); bar chart shows OHLC with left tick open/right tick close (hard to read); Japanese candlestick is the default.", "facts": ["Bar length (high-low) is the range.", "Candlesticks originated with rice trader Homma Munehisa (18th c.), popularised in the West by Steve Nison."]}, {"id": "candlestick", "type": "Concept", "name": "Japanese Candlestick Anatomy", "modules": ["M02"], "aliases": ["Candle", "Real body", "Shadow", "Wick"], "summary": "Real body connects open and close; upper shadow to high, lower shadow to low; bullish (blue/green) if close > open, bearish (red) if close < open.", "formula": {"body": "abs(close - open)", "upper_shadow": "high - max(open, close)", "lower_shadow": "min(open, close) - low", "range": "high - low", "bullish": "close > open", "bearish": "close < open"}, "facts": ["Long body = strong buying/selling; short body = little activity."]}, {"id": "timeframe", "type": "Concept", "name": "Timeframes and Look-back Period", "modules": ["M02"], "summary": "Monthly (12 candles/yr), weekly (52), daily (~252), intraday 30m (~12/day), 15m (25/day), 5m (75/day); choose to filter information from noise.", "params": {"daily_candles_per_year": 252, "swing_lookback_months": [6, 12], "sr_lookback_years": 2}, "facts": ["Long-term investors - weekly/monthly; swing/positional - EOD; scalpers - 1m/5m.", "Higher timeframe signals are more reliable (15m engulfing > 5m engulfing).", "Look-back - swing trader 6-12 months; scalper ~5 days; S&R plotting at least 2 years (or 3-6 months for short-term S&R, 12-18 months for long-term S&R).", "Beginners should start with positional/swing trades (hold a few days), not day trading."]}, {"id": "candlestick_rules", "type": "Rule", "name": "Candlestick Trading Rules (3 assumptions)", "modules": ["M02"], "summary": "(1) Buy strength, sell weakness - buy on a blue day, sell on a red day; (2) be flexible but quantify and verify deviations; (3) look for a prior trend - bullish patterns need a prior downtrend, bearish need a prior uptrend.", "conditions": {"confirmation_long": "next_day.close > next_day.open", "confirmation_short": "next_day.close < next_day.open", "tradable_range": "0.01 <= (high - low)/close <= 0.10", "stop_long": "min(low over pattern candles)", "stop_short": "max(high over pattern candles)"}, "bot_use": "Implement pattern detectors with tolerance params; require prior trend filter; enter at close of signal bar (aggressive) or next bar close with colour confirmation (conservative).", "facts": ["Marubozu is the only pattern exempt from the prior-trend rule.", "Each pattern carries built-in entry and stop-loss; targets come from S&R.", "Risk taker enters at ~3:20 PM on the pattern's last day after validating; risk averse enters next day near close only if that day confirms (blue for long, red for short).", "The more days in a pattern, the better to enter on the pattern day itself (stars - enter on P3).", "Long stop = lowest low of the pattern; short stop = highest high of the pattern.", "Avoid trading candles with range < 1% (too subdued) or > 10% (stop too deep).", "Once in a trade, do nothing until target or stop hits (trailing stops allowed)."]}, {"id": "prior_trend", "type": "Rule", "name": "Prior Trend Requirement", "modules": ["M02"], "summary": "Reversal patterns are valid only after an opposing trend; a perfect hammer without a prior downtrend is not a pattern.", "conditions": {"prior_downtrend_proxy": "close[t-1] < close[t-1-n] (e.g. n=5..10) or close below falling short EMA", "prior_uptrend_proxy": "close[t-1] > close[t-1-n] or close above rising short EMA"}, "caveats": ["Source defines prior trend visually; the proxies are implementation choices."]}, {"id": "bullish_marubozu", "type": "CandlestickPattern", "name": "Bullish Marubozu", "modules": ["M02"], "summary": "Long blue candle with no shadows (open = low, close = high) showing buying at every price; bullish regardless of prior trend.", "conditions": {"identify": "close > open and abs(open - low) <= tol*high and abs(high - close) <= tol*high", "tol_example": "ACC 0.17% deviation accepted", "entry": "near close of marubozu (risk taker) or next day close if next day is blue (risk averse)", "stop": "low of marubozu", "target": "nearest resistance"}, "example": "ACC O 971.8 H 1030.2 L 970.1 C 1028.4 -> buy ~1028.4, SL 970."}, {"id": "bearish_marubozu", "type": "CandlestickPattern", "name": "Bearish Marubozu", "modules": ["M02"], "summary": "Long red candle with no shadows (open = high, close = low); extreme selling; bearish regardless of prior trend.", "conditions": {"identify": "close < open and abs(high - open) <= tol*high and abs(close - low) <= tol*high", "entry": "short near close (or next day close if red)", "stop": "high of marubozu"}, "example": "BPCL O 355.4 H 356 L 341 C 341.7 -> short 341.7, SL 356."}, {"id": "spinning_top", "type": "CandlestickPattern", "name": "Spinning Top", "modules": ["M02"], "summary": "Small real body with roughly equal upper and lower shadows; colour irrelevant; indecision - bulls and bears both failed.", "conditions": {"identify": "body small relative to range and upper_shadow ~= lower_shadow"}, "bot_use": "Treat as volatility-expansion/indecision flag; reduce size or scale out; not an entry signal alone.", "facts": ["In a downtrend - either more selling or reversal (~50/50); test with half quantity, add if reversal confirms.", "In an uptrend - bulls pausing or fatigued; book profit on ~50% of holding.", "Calm before the storm - a move is coming, direction uncertain; reduce position size."]}, {"id": "doji", "type": "CandlestickPattern", "name": "Doji", "modules": ["M02"], "summary": "Open ~= close (no or wafer-thin body), shadows any length; indecision like spinning top; often appear in clusters.", "conditions": {"identify": "abs(close - open) <= small_frac * (high - low)"}, "facts": ["A doji following a recognisable pattern (e.g. after a bearish engulfing) amplifies the move - 'panic plus uncertainty'."]}, {"id": "paper_umbrella", "type": "CandlestickPattern", "name": "Paper Umbrella", "modules": ["M02"], "summary": "Small body near top of range with long lower shadow >= 2x body; called Hammer after a downtrend, Hanging Man after an uptrend.", "conditions": {"identify": "lower_shadow >= 2*body and upper_shadow small"}, "example": "O 100 H 103 L 94 C 102 - body 2, lower shadow 6."}, {"id": "hammer", "type": "CandlestickPattern", "name": "Hammer", "modules": ["M02"], "summary": "Paper umbrella at the bottom of a downtrend; bulls rejected new lows; bullish reversal. Longer lower shadow = more bullish; blue body slightly preferred.", "conditions": {"prior_trend": "downtrend", "identify": "lower_shadow >= 2*body and abs(close-open)/open within ~1-2% and close near high", "entry": "near close of hammer day (risk taker) or next day close if blue (risk averse)", "stop": "low of hammer"}, "facts": ["Author trusts hammer more than hanging man."], "example": "Cipla 15m - risk taker buy 444, risk averse 445.4, SL 441.5."}, {"id": "hanging_man", "type": "CandlestickPattern", "name": "Hanging Man", "modules": ["M02"], "summary": "Paper umbrella at the top of an uptrend; bears entered intraday; bearish reversal (less reliable than hammer per author because price recovered).", "conditions": {"prior_trend": "uptrend", "identify": "lower_shadow >= 2*body", "entry": "short near close (or next day close if red)", "stop": "high of candle"}, "example": "BPCL O 592 H 593.75 L 587 C 593 -> short 593, SL above 593.75."}, {"id": "shooting_star", "type": "CandlestickPattern", "name": "Shooting Star", "modules": ["M02"], "summary": "Inverted umbrella at top of uptrend - small body near low with upper shadow >= 2x body; bears pushed price back from new high; bearish. Red body slightly more reliable.", "conditions": {"prior_trend": "uptrend", "identify": "upper_shadow >= 2*body and lower_shadow small and close ~= low", "entry": "short near close (or next day if red)", "stop": "high of shooting star"}, "example": "O 1426 H 1453 L 1410 C 1417 -> short 1417, SL 1453."}, {"id": "bullish_engulfing", "type": "CandlestickPattern", "name": "Bullish Engulfing", "modules": ["M02"], "summary": "Two-candle bottom reversal - P1 red, P2 blue whose real body engulfs P1's real body.", "conditions": {"prior_trend": "downtrend", "identify": "P1.close < P1.open and P2.close > P2.open and P2.open <= P1.close and P2.close > P1.open", "entry": "close of P2 (preferred - multi-day pattern) or day after if blue", "stop": "min(P1.low, P2.low)"}, "facts": ["Engulfing real bodies is sufficient; shadows need not be engulfed. Preferred over piercing pattern."], "example": "DLF P1 O163 H168 L158.5 C160; P2 O159.5 H170.2 L159 C169 -> buy 169, SL 158.5."}, {"id": "bearish_engulfing", "type": "CandlestickPattern", "name": "Bearish Engulfing", "modules": ["M02"], "summary": "Two-candle top reversal - P1 blue, P2 red whose body engulfs P1's body.", "conditions": {"prior_trend": "uptrend", "identify": "P1.close > P1.open and P2.close < P2.open and P2.open >= P1.close and P2.close < P1.open", "entry": "short at close of P2", "stop": "max(P1.high, P2.high)"}, "facts": ["A doji after a bearish engulfing is a highly profitable setup per author."], "example": "Ambuja P1 O214 H220 L213.3 C218.75; P2 O220 H221 L207.3 C209.4 -> short 209, SL 221."}, {"id": "piercing_pattern", "type": "CandlestickPattern", "name": "Piercing Pattern", "modules": ["M02"], "summary": "Like bullish engulfing but P2's blue body covers 50% to <100% of P1's red body.", "conditions": {"prior_trend": "downtrend", "identify": "P1 red, P2 blue, 0.5*P1.body <= (P2.close - P1.close) < P1.body", "stop": "pattern low"}}, {"id": "dark_cloud_cover", "type": "CandlestickPattern", "name": "Dark Cloud Cover", "modules": ["M02"], "summary": "Like bearish engulfing but P2's red body covers 50% to <100% of P1's blue body; trade setup same as bearish engulfing.", "conditions": {"prior_trend": "uptrend", "identify": "P1 blue, P2 red, 0.5*P1.body <= (P1.close - P2.close) < P1.body", "stop": "pattern high"}}, {"id": "bullish_harami", "type": "CandlestickPattern", "name": "Bullish Harami", "modules": ["M02"], "summary": "Bottom reversal - long red P1 then small blue P2 contained within P1's body ('pregnant'); surprise strength unnerves bears.", "conditions": {"prior_trend": "downtrend", "identify": "P1 long red; P2 blue; P2.open > P1.close; P2.close < P1.open", "entry": "close of P2 or next day if blue", "stop": "min(P1.low, P2.low)"}, "example": "Axis Bank P1 O868 H874 L810 C815; P2 O824 H847 L818 C835 -> buy 835, SL 810."}, {"id": "bearish_harami", "type": "CandlestickPattern", "name": "Bearish Harami", "modules": ["M02"], "summary": "Top reversal - long blue P1 then small red P2 inside P1's body.", "conditions": {"prior_trend": "uptrend", "identify": "P1 long blue; P2 red; P2.open < P1.close; P2.close > P1.open", "entry": "short at close of P2 or next day if red", "stop": "max(P1.high, P2.high)"}, "example": "IDFC P1 O124 H129 L122 C127; P2 O126.9 H129.7 L125 C124.8 -> short ~125, SL 129.7."}, {"id": "gaps", "type": "Concept", "name": "Gap Up / Gap Down", "modules": ["M02"], "summary": "Gap up = open above prior close (buyer enthusiasm, bullish); gap down = open below prior close (bearish); no trades occur in the gap.", "conditions": {"gap_up": "open > prev_close (strict: open > prev_high)", "gap_down": "open < prev_close"}}, {"id": "morning_star", "type": "CandlestickPattern", "name": "Morning Star (and Morning Doji Star)", "modules": ["M02"], "summary": "Three-candle bottom reversal - long red P1, gap-down doji/spinning top P2, gap-up blue P3 closing above P1's open.", "conditions": {"prior_trend": "downtrend", "identify": "P1 red (long); P2 gaps down and is doji/spinning top; P3 gaps up, blue, P3.close > P1.open", "entry": "close of P3 for both risk types", "stop": "lowest low of P1..P3"}, "facts": ["If P2 is a doji it is called a morning doji star."]}, {"id": "evening_star", "type": "CandlestickPattern", "name": "Evening Star (and Evening Doji Star)", "modules": ["M02"], "summary": "Three-candle top reversal - long blue P1, gap-up doji/spinning top P2, gap-down red P3 closing below P1's open.", "conditions": {"prior_trend": "uptrend", "identify": "P1 blue; P2 gaps up, doji/spinning top; P3 gaps down, red, P3.close < P1.open", "entry": "short at close of P3", "stop": "highest high of P1..P3"}}, {"id": "support_resistance", "type": "Concept", "name": "Support and Resistance (S&R)", "modules": ["M02"], "aliases": ["Support", "Resistance", "S&R", "Price action zone"], "summary": "Price zones expected to attract maximum buying (support, below CMP) or selling (resistance, above CMP); used for targets, entries and stop placement.", "conditions": {"level_valid": "count(swing pivots within +/-tol of level) >= 3 and pivots spaced in time", "is_support": "level < cmp", "is_resistance": "level > cmp"}, "bot_use": "Detect swing pivots, cluster by price with tolerance, keep clusters with >=3 well-spaced touches; use nearest opposite level as target and require stop near a level.", "facts": ["Long trade target = nearest resistance; short trade target = nearest support.", "Construction: (1) load 3-6 months (short-term, for intraday/BTST) or 12-18 months (long-term, for swing) of data; (2) find price action zones - hesitation after up move, hesitation after down move, sharp reversals; (3) find >= 3 zones at the same price, well spaced in time (e.g. >= 2 weeks apart); (4) fit a horizontal line.", "More zones and wider time spacing = stronger level.", "Treat S&R as a zone (e.g. 429 +/- 3), not a point.", "Well-constructed S&R is usually respected but it is probabilistic.", "Accumulation creates support; distribution creates resistance (Dow)."], "example": "Ambuja CMP 206, marubozu low 202 -> entry 206, SL 202, target 215 (resistance)."}, {"id": "volume", "type": "Concept", "name": "Volume and the Volume-Price Trend Table", "modules": ["M02"], "aliases": ["Volume trend table", "Smart money"], "summary": "Shares traded (one buy + one sell of 100 = volume 100); used to confirm trends; high volume implies institutional 'smart money'.", "conditions": {"high_volume": "volume > SMA(volume, 10)", "low_volume": "volume < SMA(volume, 10)", "price_up_vol_up": "bullish", "price_up_vol_down": "caution - weak hands buying / possible bull trap", "price_down_vol_up": "bearish", "price_down_vol_down": "caution - weak hands selling / possible bear trap"}, "bot_use": "Volume filter for entries - require volume >= 10-day average on the signal bar.", "facts": ["Volume figure in terminals is cumulative for the day. Avoid trading on low-volume days."]}, {"id": "moving_average", "type": "Indicator", "name": "Moving Averages (SMA / EMA)", "modules": ["M02"], "aliases": ["SMA", "EMA", "Simple moving average", "Exponential moving average", "MA"], "summary": "Rolling average of closes; SMA weights equally, EMA weights recent data more and reacts faster (preferred). Lagging trend-following tool.", "formula": {"sma": "mean(close[t-n+1..t])", "ema": "ema_t = alpha*close_t + (1-alpha)*ema_{t-1}, alpha = 2/(n+1)"}, "facts": ["Bullish when price > EMA; bearish when price < EMA.", "Works brilliantly in trends, whipsaws in sideways markets.", "Take all signals - many small losses, one big winner pays for them; can't pick the winner in advance."]}, {"id": "ma_price_crossover_system", "type": "Strategy", "name": "Price vs 50-day EMA System", "modules": ["M02"], "summary": "Long when close crosses above 50 EMA; exit when close crosses below.", "conditions": {"entry_long": "close crosses above EMA(close, 50)", "exit_long": "close crosses below EMA(close, 50)"}, "params": {"ema": 50}, "example": "Ambuja - +22, +4, +50 per share across three trades; middle trade in sideways market.", "caveats": ["Many marginal/losing signals in sideways markets."]}, {"id": "ma_crossover_system", "type": "Strategy", "name": "Moving Average Crossover System", "modules": ["M02"], "summary": "Long when fast EMA crosses above slow EMA; exit when fast crosses below; fewer whipsaws than single MA.", "conditions": {"entry_long": "EMA(fast) crosses above EMA(slow)", "exit_long": "EMA(fast) crosses below EMA(slow)"}, "params": {"short_term": [9, 21], "medium_term": [25, 50], "few_months": [50, 100], "long_term": [100, 200], "intraday": ["15m x 30m", "5m x 10m"]}, "bot_use": "Baseline trend-following strategy; combine with ADX/regime filter to avoid sideways whipsaw.", "facts": ["Longer timeframe combos give fewer signals. 'The trend is your friend'."]}, {"id": "leading_lagging_indicators", "type": "Concept", "name": "Leading vs Lagging Indicators; Oscillators; Momentum", "modules": ["M02"], "summary": "Leading indicators (mostly bounded oscillators like RSI) signal reversals in advance but give false signals; lagging indicators (MAs) confirm after the fact. Momentum = rate of price change."}, {"id": "rsi", "type": "Indicator", "name": "Relative Strength Index (RSI)", "modules": ["M02"], "aliases": ["RSI"], "summary": "J. Welles Wilder's 0-100 momentum oscillator of internal strength; strongest in sideways markets.", "formula": {"rs": "avg_gain(n) / avg_loss(n)", "rsi": "100 - 100/(1 + RS)"}, "conditions": {"classical_long": "RSI < 30 (oversold)", "classical_short": "RSI > 70 (overbought)", "persistent_overbought": "RSI stuck > 70 for long -> look to BUY (excess positive momentum)", "persistent_oversold": "RSI stuck < 30 for long -> look to SELL", "exit_oversold": "RSI crosses back above 30 after prolonged oversold -> long", "exit_overbought": "RSI crosses back below 70 after prolonged overbought -> short"}, "params": {"period": 14, "oversold": 30, "overbought": 70, "author_pref": [20, 80]}, "facts": ["Shorter lookback = more volatile RSI. Parameters are not sacred - develop your own edge. Rarely used standalone."], "example": "14 closes, gains 29, losses 10 -> RS 2.899 -> RSI 74.35."}, {"id": "macd", "type": "Indicator", "name": "MACD (Moving Average Convergence Divergence)", "modules": ["M02"], "aliases": ["MACD"], "summary": "Gerald Appel's momentum/trend indicator - MACD line = 12 EMA - 26 EMA; signal line = 9-period EMA of MACD.", "formula": {"macd_line": "EMA(close,12) - EMA(close,26)", "signal_line": "EMA(macd_line, 9)", "histogram": "macd_line - signal_line"}, "conditions": {"centerline_bull": "macd_line crosses above 0", "centerline_bear": "macd_line crosses below 0", "signal_bull": "macd_line crosses above signal_line", "signal_bear": "macd_line crosses below signal_line"}, "params": {"fast": 12, "slow": 26, "signal": 9}, "facts": ["Sign = direction of momentum; magnitude = strength but scales with price level. Works in trends", "poor sideways."]}, {"id": "bollinger_bands", "type": "Indicator", "name": "Bollinger Bands", "modules": ["M02"], "aliases": ["BB"], "summary": "John Bollinger's 20 SMA with +/-2 standard deviation bands; mean-reversion tool.", "formula": {"middle": "SMA(close,20)", "upper": "middle + 2*stdev(close,20)", "lower": "middle - 2*stdev(close,20)"}, "conditions": {"short": "price touches upper band -> target middle", "long": "price touches lower band -> target middle", "failure": "envelope expansion (bands widening as price rides a band) = trending market, signals fail"}, "facts": ["Works in sideways markets", "fails in trends. Expect the trade to work almost immediately; if not", "suspect envelope expansion."]}, {"id": "fibonacci_retracement", "type": "Indicator", "name": "Fibonacci Retracements", "modules": ["M02"], "summary": "After a sharp move (trough to peak = 100%), price tends to retrace to 23.6%, 38.2% or 61.8% before resuming the trend.", "formula": {"level_up_move": "peak - ratio*(peak - trough)", "level_down_move": "trough + ratio*(peak - trough)", "ratios": "[0.236, 0.382, 0.618]"}, "facts": ["Use only as a confirmation tool; strong buy when stop coincides with Fib level plus pattern", "S&R and volume."], "example": "380 -> 489 move of 109; 61.8% retracement = 489 - 67.36 = 421.6."}, {"id": "dow_theory", "type": "Concept", "name": "Dow Theory", "modules": ["M02"], "summary": "Charles Dow's framework (compiled by Hamilton) - 9 tenets on trends, confirmation and market phases.", "facts": ["Indices discount everything.", "Three trends - primary (1 to several years), secondary (counter-trend corrections, weeks to months), minor (daily noise).", "All indices must confirm each other (Nifty, midcap, smallcap move together).", "Volume must confirm - in uptrend volume rises on up moves, falls on dips; opposite in downtrend.", "Sideways markets can substitute for secondary trends.", "Close is the most sacred price.", "Before going long on a pattern, check primary trend; trading against a secondary counter-trend needs caution."]}, {"id": "market_phases", "type": "Concept", "name": "Market Phases (Accumulation, Mark-up, Distribution, Mark-down)", "modules": ["M02"], "summary": "Cycle - smart money accumulates after steep sell-off (creates support), mark-up is a fast rally that leaves public behind, distribution when public buys near highs (creates resistance), then mark-down sell-off.", "facts": ["No two cycles are the same; can span months to years."]}, {"id": "double_top_bottom", "type": "ChartPattern", "name": "Double / Triple Top and Bottom", "modules": ["M02"], "summary": "Reversal patterns where a price level is tested twice (or thrice) with tests well spaced in time (>= ~2 weeks); triple is stronger than double.", "conditions": {"double_bottom": "two lows within tolerance, separated by >= ~10 sessions with a rebound between -> bullish", "double_top": "two highs within tolerance (e.g. 336 vs 332 accepted) -> bearish"}, "facts": ["Best when the second test forms a candlestick pattern (e.g. shooting star on 2nd top)."]}, {"id": "trading_range", "type": "ChartPattern", "name": "Trading Range (Sideways Market)", "modules": ["M02"], "summary": "Price oscillates between fixed support and resistance for weeks to years; buy near the bottom, short near the top.", "facts": ["Causes - no fundamental triggers, or waiting for a big announcement (short-lived).", "Longer range duration -> wider range."]}, {"id": "breakout", "type": "Strategy", "name": "Range Breakout / Breakdown", "modules": ["M02"], "summary": "Breakout of a range often starts a new trend; true breakouts have high volume and high momentum; false breakouts have low volume and fall back into range.", "conditions": {"entry_long": "close > range_high with volume > avg volume", "stop_long": "range_high (the broken resistance)", "entry_short": "close < range_low with high volume", "stop_short": "range_low", "min_target": "breakout_level +/- range_width"}, "example": "Range 125/128-165/168; long 170 SL 165; target 168 + 43 = 211."}, {"id": "flag_pattern", "type": "ChartPattern", "name": "Flag Formation", "modules": ["M02"], "summary": "Steep rally (pole) then 5-15 session low-volume correction in a parallel channel; price then resumes sharply upward - second chance to buy.", "conditions": {"identify": "sharp rally then 5-15 bar pullback within parallel lines on declining volume", "entry": "break above flag channel (act fast)"}, "facts": ["Pullback is retail profit-taking; smart money stays invested."]}, {"id": "reward_risk_ratio", "type": "Formula", "name": "Reward-to-Risk Ratio (RRR)", "modules": ["M02"], "aliases": ["RRR", "Risk reward"], "summary": "Expected reward per unit of risk; trades below your RRR threshold must be dropped regardless of setup quality.", "formula": {"long_rrr": "(target - entry) / (entry - stop)", "short_rrr": "(entry - target) / (stop - entry)"}, "params": {"min_beginner": "as high as possible", "min_active_trader": 1.5, "aggressive": 1.0, "cautious": 2.0, "scalping_ok": [0.5, 0.75]}, "example": "Entry 107 SL 102 Target 114 -> RRR 1.4; Entry 55.75 SL 53.55 T 57.2 -> 0.65 reject."}, {"id": "ta_checklist", "type": "Rule", "name": "Grand 6-Point TA Checklist", "modules": ["M02"], "summary": "(1) recognisable candlestick pattern; (2) stop near S&R (long - pattern low near support; short - pattern high near resistance); (3) volume >= 10-day average; (4) Dow Theory context (primary/secondary trend, double/triple/range/flag); (5) indicators (RSI/MACD) confirm -> scale size up, else proceed at reduced size; (6) RRR >= threshold (1.5 for active traders).", "conditions": {"must_have": ["candlestick_pattern", "sr_near_stop", "volume_confirm", "rrr_ok"], "sr_distance_max": "abs(stop - sr_level)/stop <= 0.04 else skip", "indicator_rule": "if indicators confirm: size = full (e.g. 500); else size = reduced (e.g. 300)", "trade_quality": "satisfy at least 3-4 checklist points; prefer stock with more points over prettier pattern"}, "bot_use": "Encode as a scoring function; hard filters for 1,2,3,6 and size multiplier for 5.", "facts": ["Discipline is ~80% of trading success; checklist enforces it.", "Engulfing preferred over piercing/dark cloud when checklist scores tie.", "Choosing not to trade is itself a big trading decision."]}, {"id": "swing_scan_process", "type": "Process", "name": "Swing Trade Scanning Process", "modules": ["M02"], "summary": "Universe Nifty 50, EOD charts, 6-12 month look-back (2 yr for S&R); Part 1 shortlist charts with a pattern in last 3-4 candles; Part 2 evaluate 4-5 shortlisted charts against checklist; at most 1-2 qualify.", "bot_use": "Direct blueprint for an EOD scanner pipeline.", "facts": ["Evaluation order: pattern strength -> prior trend -> volume >= 10-day avg -> S&R within 4% of stop -> Dow patterns & primary/secondary trend -> RRR >= 1.5 (target = S&R) -> MACD/RSI for sizing.", "Positional trades may be squared off intraday if target hits same day.", "Opportunity universe criteria - liquid (tight bid-ask, e.g. >= 5 lakh shares/day), EQ segment, not operator-driven; index stocks satisfy these."]}, {"id": "opportunity_universe", "type": "Concept", "name": "Opportunity Universe", "modules": ["M02"], "summary": "Fixed list of liquid stocks you scan daily (e.g. Nifty 50).", "conditions": {"liquidity": "avg daily volume >= 500000 or tight bid-ask spread", "segment": "EQ"}}, {"id": "scalping", "type": "Strategy", "name": "Scalping", "modules": ["M02"], "summary": "Large-size trades held minutes on 1m/5m charts for small moves; for seasoned traders.", "facts": ["Use candlestick pattern + volume from checklist; RRR 0.5-0.75 acceptable.", "Only liquid stocks; quick to book losses; watch bid-ask and global markets (e.g. Hang Seng); low-cost broker essential; don't over-leverage; stop trading on bad days."], "example": "Short 1000 Infosys 3980 at 10:15, cover 3976 at 10:25 -> Rs 2653 net."}, {"id": "adx", "type": "Indicator", "name": "ADX / +DI / -DI (Directional Movement)", "modules": ["M02"], "aliases": ["ADX", "DMI"], "summary": "Wilder's trend-strength system; ADX measures strength (not direction), +DI/-DI give direction.", "conditions": {"strong_trend": "ADX > 25", "weak_trend": "ADX < 20", "buy": "ADX >= 25 and +DI crosses above -DI", "sell": "ADX >= 25 and -DI crosses above +DI", "stop": "low (long) / high (short) of signal candle; trade valid until stop breached"}, "params": {"period": 14}, "bot_use": "Regime filter - enable trend systems when ADX > 25, mean-reversion when ADX < 20."}, {"id": "alligator", "type": "Indicator", "name": "Alligator (Bill Williams)", "modules": ["M02"], "summary": "Three displaced SMAs - jaw 13, teeth 8, lips 5.", "conditions": {"buy": "close > SMA5 > SMA8 > SMA13 and lines separated", "sell": "close < SMA5 < SMA8 < SMA13 and lines separated", "no_trade": "lines intertwined/flat"}}, {"id": "aroon", "type": "Indicator", "name": "Aroon and Aroon Oscillator", "modules": ["M02"], "summary": "Tushar Chande's time-since-high/low indicator (0-100); default 25 (Kite 14).", "formula": {"aroon_up": "100*(n - periods_since_n_high)/n", "aroon_down": "100*(n - periods_since_n_low)/n", "oscillator": "aroon_up - aroon_down"}, "conditions": {"buy": "aroon_up > 50 and aroon_down < 30", "sell": "aroon_down > 50 and aroon_up < 30", "strong_up": "oscillator > 50", "strong_down": "oscillator < -50"}}, {"id": "atr", "type": "Indicator", "name": "Average True Range (ATR)", "modules": ["M02"], "aliases": ["ATR", "True range"], "summary": "Wilder's volatility measure including gaps; no direction; in price units.", "formula": {"true_range": "max(high-low, abs(high-prev_close), abs(low-prev_close))", "atr": "Wilder smoothing / average of TR over n"}, "conditions": {"expected_range": "price +/- ATR", "volatility_stop_long": "stop <= entry - ATR", "volatility_stop_short": "stop >= entry + ATR", "skip": "if ATR-based stop violates RRR, skip trade"}, "params": {"period": 14}, "bot_use": "Volatility-normalised stops and position sizing.", "example": "ATR 48 at 1320 -> range 1272-1368; long 1325 stop <= 1272."}, {"id": "atr_bands", "type": "Indicator", "name": "ATR Bands", "modules": ["M02"], "summary": "MA (default 5) +/- ATR envelope; price piercing a band suggests continuation in that direction; alternative to Bollinger."}, {"id": "supertrend", "type": "Indicator", "name": "Supertrend", "modules": ["M02"], "summary": "ATR-based trailing trend line (Kite default period 7, multiplier 3); green below price in uptrends, red above in downtrends.", "formula": {"basic_upper": "(high+low)/2 + mult*ATR", "basic_lower": "(high+low)/2 - mult*ATR"}, "conditions": {"buy": "close crosses above supertrend (turns green)", "sell": "close crosses below supertrend (turns red)", "trail": "hold long until close below green line"}, "params": {"period": 7, "multiplier": 3, "suggested_multiplier": [3, 4]}, "facts": ["Fewer false signals than MA systems; works best in trending markets. Higher multiplier = fewer signals."]}, {"id": "vwap", "type": "Indicator", "name": "VWAP (Volume Weighted Average Price)", "modules": ["M02"], "aliases": ["VWAP"], "summary": "Intraday cumulative volume-weighted typical price; gauges intraday direction and execution quality.", "formula": {"typical_price": "(high + low + close)/3", "vwap": "cumsum(typical_price*volume)/cumsum(volume) (reset daily)"}, "conditions": {"intraday_bull": "price > VWAP", "intraday_bear": "price < VWAP", "good_long_fill": "buy price < VWAP", "good_short_fill": "short price > VWAP"}, "caveats": ["Intraday only; ignore jump at 9:15 open; lags price."]}, {"id": "module_m03", "type": "Module", "name": "M03 - Fundamental Analysis", "modules": ["M03"], "summary": "Investor mindset, compounding, qualitative and quantitative investable-grade attributes, reading annual reports and the three financial statements, profitability/leverage/operating/valuation ratios, DuPont, index valuation, equity research process with 10-point checklist, DCF valuation, margin of safety, when to sell and portfolio size."}, {"id": "fundamental_analysis", "type": "Concept", "name": "Fundamental Analysis (FA)", "modules": ["M03"], "aliases": ["FA"], "summary": "Holistic study of a business to identify investment-grade companies for long-term (3-5+ yr) wealth creation, separating business performance from short-term price noise.", "facts": ["Wealth creators (Infosys, TCS, Page, Eicher, Bosch, Nestle, TTK Prestige) compounded >20% CAGR for 10+ years; wealth destroyers include Suzlon, Reliance Power, Sterling Biotech.", "At 20% CAGR money doubles in ~3.5 years (rule of 72).", "Skills needed - reading financial statements, understanding business in its industry, basic arithmetic.", "Tools - annual report, industry data, news, Excel.", "TA and FA should coexist (Eicher flat 2006-2010 then multi-bagger - short-term trades fill the gap)."]}, {"id": "core_satellite", "type": "Strategy", "name": "Core-Satellite Capital Allocation", "modules": ["M03"], "summary": "Split capital (e.g. 60/40) - core in fundamentally strong long-term holdings (expect 12-15% CAGR), satellite for active TA trading in equity/F&O (expect 10-12% absolute/yr).", "params": {"core_pct": 60, "satellite_pct": 40}, "bot_use": "Allocate a capped satellite bucket to algorithmic strategies while core remains long-term."}, {"id": "speculator_trader_investor", "type": "Concept", "name": "Speculator vs Trader vs Investor", "modules": ["M03"], "summary": "Speculator bets on blind faith/outside views; trader designs and backtests trades (e.g. selling high-IV options before RBI expecting volatility drop); investor ignores short-term noise and may buy more on overreaction.", "facts": ["Doing nothing is itself a market action. A trader 'designs all his trades and not just speculates on an outcome'."]}, {"id": "compounding", "type": "Concept", "name": "Compounding Effect", "modules": ["M03"], "summary": "Reinvesting gains lets money grow on itself; the longer you stay invested, the faster absolute wealth grows.", "formula": {"future_value": "P * (1 + r) ** n"}, "example": "Rs 100 at 20% - took ~6 yrs to reach 300, next 300 in just 4 yrs; reinvesting gives 173 vs 160 when withdrawing profits after 3 yrs."}, {"id": "investable_grade_attributes", "type": "Rule", "name": "Investable-Grade Attributes (Qualitative + Quantitative)", "modules": ["M03"], "summary": "Qualitative (weighted more by author) - management background, ethics, corporate governance, minority shareholder treatment, clandestine promoter share transactions, related-party transactions, promoter salaries, operator activity, significant shareholders, political affiliation, promoter lifestyle. Quantitative - profit/margin/earnings growth, expenses, efficiency, pricing power, taxes, dividends, cash flows, debt, working capital, assets, ratios.", "facts": ["A red flag in any qualitative factor overrides great margins - the market eventually punishes poor governance.", "Sector-specific metrics matter (retail - stores, sales/sq ft; oil & gas - reserves, exploration costs).", "Hold as long as attributes remain intact; sell when they crumble (not because of price alone)."]}, {"id": "annual_report", "type": "Concept", "name": "Annual Report", "modules": ["M03"], "summary": "Official yearly disclosure (data as of 31 March) - financial highlights, chairman's message, MD&A, 10-yr highlights, directors' report, corporate governance, financial statements, notice.", "facts": ["Prefer AR over media websites (reclassification can distort).", "MD&A is the most important section - macro, industry, segment performance, outlook; compare with peers' ARs.", "Check chairman's realism (e.g. claims 10% growth when history is 4-5% = red flag).", "Standalone vs consolidated statements - prefer consolidated (includes subsidiaries).", "Line items reference notes/schedules with details."]}, {"id": "profit_and_loss", "type": "Concept", "name": "Profit & Loss Statement (Income Statement)", "modules": ["M03"], "aliases": ["P&L", "Income statement"], "summary": "Revenue, expenses, tax and EPS for a period (year/quarter); top line = revenue, bottom line = PAT.", "formula": {"net_revenue_from_ops": "sale of products (net of excise) + services + other operating revenue", "total_revenue": "revenue_from_operations + other_income", "pbt": "total_revenue - total_expenses - exceptional_items", "pat": "pbt - taxes", "eps": "pat / shares_outstanding"}, "facts": ["Other income (interest, dividends, royalty) should be small; large other income is a red flag.", "Depreciation spreads tangible asset cost over useful life; amortisation for intangibles; P&L doesn't show the actual capex outflow (cash flow does).", "Exceptional items are one-off.", "Negative 'change in inventories' means more produced than sold."]}, {"id": "balance_sheet", "type": "Concept", "name": "Balance Sheet", "modules": ["M03"], "summary": "Cumulative (flow-basis) statement of assets, liabilities and shareholders' equity; Assets = Liabilities + Equity.", "formula": {"equation": "assets = shareholders_funds + non_current_liabilities + current_liabilities", "equity": "share_capital + reserves + surplus", "share_capital": "face_value * shares", "shares_outstanding": "share_capital / face_value", "net_block": "gross_block - accumulated_depreciation"}, "facts": ["Shareholders' funds appear on liability side because the company owes them to shareholders.", "Reserves - capital, securities premium, general; surplus accumulates PAT, pays dividends.", "Non-current liabilities (>12 months) - long-term borrowings, deferred tax liability (depreciation timing), long-term provisions (employee benefits).", "Current liabilities - short-term borrowings (working capital), trade payables, other, short-term provisions.", "Non-current assets - tangible/intangible fixed assets, CWIP, investments, long-term loans/advances.", "Current assets - inventory, trade receivables, cash & equivalents, short-term loans/advances.", "No debt is good but ask why (can't borrow? not expanding?).", "P&L links - PAT -> surplus; credit sales -> receivables; purchases -> payables/inventory; capex -> depreciation; debt -> finance cost."]}, {"id": "cash_flow_statement", "type": "Concept", "name": "Cash Flow Statement", "modules": ["M03"], "summary": "True cash generated/consumed across operating, investing and financing activities; net cash flow ties to balance sheet cash.", "formula": {"net_cash_flow": "CFO + CFI + CFF"}, "facts": ["Revenue can include credit sales not yet collected - cash flow shows real liquidity.", "Liabilities up -> cash up; assets up -> cash down.", "Positive cash from operations is a sign of financial well-being; investors should focus on CFO.", "Healthy investing outflow signals expansion."]}, {"id": "financial_ratios", "type": "Concept", "name": "Financial Ratios (overview)", "modules": ["M03"], "summary": "Popularised by Benjamin Graham; categories - profitability, leverage, valuation, operating. A ratio alone is mute - compare with peers and its own trend; adjust for accounting policy changes; use averages of opening/closing balance sheet values."}, {"id": "ebitda", "type": "Ratio", "name": "EBITDA and EBITDA Margin", "modules": ["M03"], "aliases": ["Operating profit margin"], "summary": "Operating profitability excluding other income, finance cost and D&A; reflects management efficiency.", "formula": {"ebitda": "(total_revenue - other_income) - (total_expenses - finance_cost - depreciation)", "ebitda_margin": "ebitda / (total_revenue - other_income)"}, "example": "ARBL FY14 EBITDA 560 Cr on 3436 Cr = 16.3%; 4-yr EBITDA CAGR 21%."}, {"id": "pat_margin", "type": "Ratio", "name": "PAT Margin (Net Profit Margin)", "modules": ["M03"], "summary": "Overall profitability after all expenses and tax.", "formula": {"pat_margin": "pat / total_revenue"}, "example": "ARBL 367/3482 = 10.5%."}, {"id": "roe", "type": "Ratio", "name": "Return on Equity (RoE)", "modules": ["M03"], "aliases": ["ROE"], "summary": "Profit per unit of shareholders' equity; key investable attribute. Top Indian companies average 14-16%; author prefers >18-20% (checklist >25%) without high debt.", "formula": {"roe": "net_profit / avg_shareholders_equity"}, "caveats": ["Debt inflates RoE (pizza oven example 25% -> 31% -> 50% as debt rises); always inspect with DuPont and debt levels."]}, {"id": "dupont", "type": "Formula", "name": "DuPont Model", "modules": ["M03"], "summary": "RoE = Net profit margin x Asset turnover x Financial leverage; reveals quality of returns.", "formula": {"roe": "(net_profit/net_sales) * (net_sales/avg_total_assets) * (avg_total_assets/avg_equity)"}, "example": "ARBL 9.2% x 1.75 x 1.61 ~ 25.9%."}, {"id": "roa", "type": "Ratio", "name": "Return on Assets (RoA)", "modules": ["M03"], "summary": "Efficiency of asset use, adding back after-tax interest (tax shield) since lenders fund assets.", "formula": {"roa": "(net_income + interest*(1 - tax_rate)) / avg_total_assets"}, "example": "ARBL (367.4 + 4.76)/1955 = 19.03%."}, {"id": "roce", "type": "Ratio", "name": "Return on Capital Employed (ROCE)", "modules": ["M03"], "summary": "Return on total capital (debt + equity).", "formula": {"roce": "EBIT / (short_term_debt + long_term_debt + equity)"}, "example": "ARBL 537.7/1446.2 = 37.18%."}, {"id": "interest_coverage", "type": "Ratio", "name": "Interest Coverage Ratio", "modules": ["M03"], "summary": "Ability to service interest from operating earnings; low coverage = default risk.", "formula": {"icr": "EBIT / interest_expense", "ebit": "EBITDA - D&A"}, "example": "Jain Irrigation FY14 565.44/467.64 = 1.21x (weak)."}, {"id": "debt_to_equity", "type": "Ratio", "name": "Debt to Equity Ratio", "modules": ["M03"], "summary": "Total (short + long-term) debt relative to equity; >1 indicates high leverage.", "formula": {"de": "total_debt / total_equity"}, "conditions": {"caution": "de > 1"}, "example": "Jain Irrigation 3686.6/2175.5 = 1.69."}, {"id": "debt_to_asset", "type": "Ratio", "name": "Debt to Asset Ratio", "modules": ["M03"], "summary": "Share of assets financed by debt.", "formula": {"da": "total_debt / total_assets"}, "example": "Jain Irrigation ~45%."}, {"id": "financial_leverage_ratio", "type": "Ratio", "name": "Financial Leverage Ratio", "modules": ["M03"], "summary": "Assets supported per unit of equity; higher = more leveraged.", "formula": {"fl": "avg_total_assets / avg_total_equity"}, "example": "ARBL 1.61; Jain Irrigation 3.68."}, {"id": "operating_ratios", "type": "Ratio", "name": "Operating (Activity / Management) Ratios", "modules": ["M03"], "summary": "Efficiency of converting assets into revenue.", "formula": {"fixed_asset_turnover": "operating_revenue / avg_net_fixed_assets_incl_cwip", "working_capital": "current_assets - current_liabilities", "working_capital_turnover": "revenue / avg_working_capital", "total_asset_turnover": "operating_revenue / avg_total_assets", "inventory_turnover": "COGS / avg_inventory", "inventory_days": "365 / inventory_turnover", "receivable_turnover": "revenue / avg_receivables", "dso": "365 / receivable_turnover", "cogs": "materials + stock-in-trade purchases + stores & spares + power & fuel"}, "example": "ARBL FAT 5.59, WCT 5.11, TAT 1.75, inventory turnover 7.8 (~47 days), receivables 8.24x (~44 days).", "caveats": ["High inventory turnover could reflect low production capacity - investigate funding", "raw material access", "scalability."]}, {"id": "asset_turnover", "type": "Ratio", "name": "Asset Turnover", "modules": ["M03"], "summary": "Revenue generated per rupee of average total assets.", "formula": {"asset_turnover": "net_sales / avg_total_assets"}}, {"id": "gross_profit_margin", "type": "Ratio", "name": "Gross Profit Margin", "modules": ["M03"], "summary": "(Net sales - COGS)/Net sales; >20% suggests a moat.", "formula": {"gpm": "(net_sales - cogs) / net_sales"}, "conditions": {"pass": "gpm > 0.20"}}, {"id": "eps", "type": "Ratio", "name": "Earnings Per Share (EPS)", "modules": ["M03"], "summary": "PAT per outstanding share; EPS growth should track PAT growth (else dilution).", "formula": {"eps": "pat / shares_outstanding"}}, {"id": "ps_ratio", "type": "Ratio", "name": "Price to Sales (P/S)", "modules": ["M03"], "summary": "Price relative to sales per share; useful when earnings are cyclical or distorted.", "formula": {"ps": "price / (total_revenue / shares)"}, "example": "ARBL 661/203.86 = 3.24x.", "caveats": ["Higher-margin firms justify higher P/S - check profit margin."]}, {"id": "pb_ratio", "type": "Ratio", "name": "Price to Book Value (P/BV)", "modules": ["M03"], "summary": "Price relative to book (liquidation) value per share.", "formula": {"bvps": "(share_capital + reserves - revaluation_reserves) / shares", "pb": "price / bvps"}, "example": "ARBL BV 79.8, P/BV 8.3x."}, {"id": "pe_ratio", "type": "Ratio", "name": "Price to Earnings (P/E)", "modules": ["M03"], "aliases": ["PE"], "summary": "Price paid per rupee of earnings - the 'financial ratio superstar'.", "formula": {"pe": "price / eps"}, "facts": ["Author avoids buying stocks above 25-30x earnings regardless of sector.", "Earnings can be manipulated - watch frequent accounting policy changes, low depreciation provisions, earnings rising without cash flow and sales."], "example": "ARBL 661/21.49 = 30.76x."}, {"id": "valuation_ratios", "type": "Concept", "name": "Valuation Ratios", "modules": ["M03"], "summary": "Compare price with financial performance (P/S, P/BV, P/E); a mediocre business at a cheap valuation can beat an exciting one at a high valuation."}, {"id": "index_valuation", "type": "Rule", "name": "Nifty Index Valuation (P/E bands)", "modules": ["M03"], "summary": "Nifty P/E historically 16-20x (avg ~18x); peaked 28x (Jan 2008, pre-crash), troughed ~11x (late 2008/09).", "conditions": {"caution": "nifty_pe >= 22", "attractive": "nifty_pe <= 16"}, "bot_use": "Macro valuation regime filter for long-only equity allocation / leverage.", "facts": ["NSE publishes daily Nifty P/E", "P/B", "dividend yield (~6 PM)."], "caveats": ["Bands are from source era (2014); P/E methodology changed to consolidated earnings in 2021 - recalibrate."]}, {"id": "stock_idea_generation", "type": "Process", "name": "Stock Idea Generation", "modules": ["M03"], "summary": "General observation (Peter Lynch), stock screeners (e.g. ROE > 25% and PAT margin > 20%), macro trends, sectoral trends, special situations, circle of competence; maintain a watch list and re-evaluate."}, {"id": "economic_moat", "type": "Concept", "name": "Economic Moat", "modules": ["M03"], "summary": "Sustainable competitive advantage (brand, pricing power, licence, market share) protecting long-term profits (Buffett).", "example": "Royal Enfield brand (Eicher), Jockey licence (Page), labour arbitrage (Infosys)."}, {"id": "equity_research_process", "type": "Process", "name": "3-Stage Equity Research", "modules": ["M03"], "summary": "(1) Understand the business via Q&A from 5 years of annual reports (~15 hrs, summarise on one page; stop on any red flag); (2) apply the checklist; (3) valuation via DCF and margin of safety. Stages are sequential.", "facts": ["Key questions - what the company does, promoters' background, products, plants & capacity utilisation, raw material dependency (govt-regulated?), clients, competitors (monopoly/duopoly/oligopoly = higher margin
