s), major shareholders, new products/geographies, revenue mix, regulation, bankers & auditors, labour issues, entry barriers, replicability in cheap-labour countries, number of subsidiaries.", "Author prefers businesses with little competition and little government intervention.", "Bear markets move prices, not fundamentals - conviction lets you buy in bear markets."]}, {"id": "fa_checklist", "type": "Rule", "name": "10-Point Fundamental Checklist", "modules": ["M03"], "summary": "Screen for investable-grade financials.", "conditions": {"gross_profit_margin": "> 20%", "revenue_and_pat_growth": "in line with each other; author prefers revenue & PAT CAGR > 15%", "eps": "EPS growth consistent with net profit growth (no dilution)", "debt": "not highly leveraged; track Debt/EBIT trend and interest coverage", "inventory": "manufacturing - inventory growing with PAT; stable/declining inventory days", "sales_vs_receivables": "sales not driven by receivables (receivables % of sales stable/declining)", "cfo": "positive cash flow from operations", "roe": "> 25% (author elsewhere >20%), not debt-driven", "business_diversity": "1-2 simple business lines", "subsidiaries": "few (many subsidiaries can mean siphoning)"}, "bot_use": "Direct screener rules for a fundamental-filtered universe."}, {"id": "time_value_of_money", "type": "Formula", "name": "Time Value of Money (FV, PV, NPV)", "modules": ["M03"], "summary": "Money's value changes over time due to opportunity cost; compounding moves money forward, discounting moves it back.", "formula": {"fv": "amount * (1 + r) ** n", "pv": "amount / (1 + r) ** n", "npv": "sum(cf_t / (1 + r) ** t)"}, "example": "5000 at 8.5% for 5 yrs = 7518.3; 10,000 in 6 yrs at 8.5% = 6129.5 today; pizza machine 5 lakh/yr x 10 yrs at 8.5% NPV = 32.8 lakh."}, {"id": "free_cash_flow", "type": "Formula", "name": "Free Cash Flow (FCF)", "modules": ["M03"], "summary": "Operating cash after capex - cash available to shareholders; mark of a healthy business.", "formula": {"fcf": "cash_from_operations - capex"}}, {"id": "dcf", "type": "Model", "name": "Discounted Cash Flow (DCF) Valuation", "modules": ["M03"], "aliases": ["DCF", "Intrinsic value"], "summary": "Intrinsic value = PV of projected FCF + PV of terminal value, adjusted for net debt, divided by shares.", "formula": {"base_fcf": "average FCF of last 3 years (smooths cyclicality)", "projection": "stage 1 (yrs 1-5) growth g1 (e.g. 18%, 15% for large caps), stage 2 (yrs 6-10) g2 (e.g. 10%)", "terminal_value": "FCF_10 * (1 + g_t) / (r - g_t)", "pv_terminal": "TV / (1 + r) ** 10", "equity_value": "sum PV(FCF) + PV(TV) - net_debt", "net_debt": "total_debt - cash", "intrinsic_value_per_share": "equity_value / shares", "value_band": "IV * [0.9, 1.1]"}, "conditions": {"buy": "price < lower band", "hold": "lower band <= price <= upper band (no fresh buy)", "overvalued": "price > upper band (book profits or hold, never buy)"}, "params": {"discount_rate": 0.09, "terminal_growth": [0.03, 0.04], "max_fcf_growth": 0.2, "years": 10}, "example": "ARBL - avg FCF 140.36 Cr, PV FCF 1968 + PV TV 4111 = 6079 Cr; net debt -218.6; /17.081 Cr shares = Rs 368 (band 331-405) vs CMP 726.", "caveats": ["Garbage in, garbage out - requires forecasting.", "Highly sensitive to terminal growth (3.5% -> 4% moves value 368 -> 394).", "Needs constant updates; useless for <1 yr horizon.", "Keep assumptions conservative - FCF growth <= 20%, terminal growth <= 4%, 10-year 2-stage."]}, {"id": "margin_of_safety", "type": "Rule", "name": "Margin of Safety", "modules": ["M03"], "summary": "Benjamin Graham's principle - buy only at a discount to intrinsic value; author takes a further >= 30% discount to the lower value band.", "formula": {"buy_price": "IV * 0.9 * 0.7"}, "facts": ["Bear markets offer such discounts - keep cash ready."], "example": "ARBL IV 368 -> lower band 331 -> buy ~230 with conviction."}, {"id": "when_to_sell", "type": "Rule", "name": "When to Sell (Investing)", "modules": ["M03"], "summary": "Hold while investable-grade attributes stay intact; sell when they deteriorate, not because of price gains alone."}, {"id": "portfolio_size", "type": "Rule", "name": "Number of Stocks in a Portfolio", "modules": ["M03"], "summary": "Author holds ~13, never >15; >20 is pointless. Klarman 10-15, Buffett 5-10, Graham 10-30, Keynes 2-3."}, {"id": "investing_principles", "type": "Rule", "name": "Investing Principles (Finale)", "modules": ["M03"], "summary": "Expect realistic 15-18% CAGR; long-term approach; buy investable-grade attributes; character over numbers; ignore TV noise and apply checklist; respect margin of safety; avoid IPOs (usually overpriced) unless 3-stage research; keep learning.", "facts": ["Recommended books - Essays of Warren Buffett; Little Book that Beats the Market (Greenblatt); Little Book of Valuation (Damodaran); Little Book that Builds Wealth (Dorsey)."]}, {"id": "module_m04", "type": "Module", "name": "M04 - Futures Trading", "modules": ["M04"], "summary": "Forwards vs futures, futures trade mechanics, leverage and linear payoff, margins (SPAN + exposure) and daily M2M, margin calls, expiry/rollover, product types (NRML/MIS/CO/BO), trailing stops, shorting, Nifty futures and impact cost, futures pricing (spot-futures parity), cash & carry and calendar spreads, hedging with beta, open interest."}, {"id": "derivatives", "type": "Concept", "name": "Derivatives", "modules": ["M04"], "summary": "Securities whose value is derived from an underlying (stock, index, bond, commodity, currency); earliest reference in Kautilya's Arthashastra (320 BC)."}, {"id": "forward_contract", "type": "Instrument", "name": "Forward Contract", "modules": ["M04"], "summary": "OTC private agreement to exchange an asset at a fixed price on a future date; settled physically or in cash.", "facts": ["Risks - liquidity (finding counterparty), default/counterparty, regulatory (unregulated), rigidity (cannot exit mid-way).", "Buyer profits if price rises above agreed price; seller profits if it falls; linear payoff."]}, {"id": "futures_contract", "type": "Instrument", "name": "Futures Contract", "modules": ["M04"], "aliases": ["Futures", "Stock futures", "Index futures"], "summary": "Exchange-traded, standardised, SEBI-regulated, transferable, time-bound, mostly cash-settled agreement whose price mimics the underlying.", "formula": {"contract_value": "lot_size * futures_price", "pnl": "(exit_price - entry_price) * lot_size * lots * direction"}, "bot_use": "Express short-term directional views with leverage; trade shorts overnight; hedge portfolios.", "facts": ["Lot size = minimum tradable quantity; multiples of lot only.", "Margin (a % of contract value) is blocked on entry for both buyer and seller.", "Can square off any time before expiry; squaring off transfers risk to a counterparty.", "P&L credited/debited the same day (M2M).", "Zero-sum game - money transfers, not created.", "Linear payoff instrument.", "Indian equity derivatives expired on the last Thursday of the month (per source; expiry days have since changed - verify).", "Unclosed positions are auto-settled at spot on expiry as futures and spot converge."]}, {"id": "spot_market", "type": "Concept", "name": "Spot Market vs Futures Market", "modules": ["M04"], "summary": "Spot = regular cash market; futures price moves in tandem with spot. Spot delivery buying is unleveraged, no time pressure, but T+settlement; futures are leveraged and time-bound.", "example": "TCS 2362->2519 over 9 days - spot 42 shares +5.79%; futures 2 lots on 82,670 margin +47%."}, {"id": "leverage", "type": "Concept", "name": "Leverage", "modules": ["M04"], "summary": "Controlling a large contract value with a small margin; double-edged - magnifies gains and losses.", "formula": {"leverage": "contract_value / margin", "wipeout_move": "1 / leverage"}, "params": {"author_max_leverage": [10, 12]}, "bot_use": "Cap effective leverage (e.g. <= 10x); compute margin-wipeout distance before entry.", "example": "TCS 295,250/41,335 = 7.14x -> 14% adverse move wipes out margin; 42x -> 2.3% move."}, {"id": "margin", "type": "Concept", "name": "Margins (Initial, SPAN, Exposure, Maintenance)", "modules": ["M04"], "aliases": ["SPAN margin", "Exposure margin", "Initial margin", "Maintenance margin"], "summary": "Initial margin = SPAN + exposure, blocked while position is open; SPAN (exchange minimum, volatility-driven) acts as maintenance margin; exposure ~4-5% of CV extra cushion.", "formula": {"initial_margin": "span + exposure"}, "facts": ["Margin varies daily with futures price and volatility (higher expected volatility -> higher SPAN).", "Hedged positions (spreads) get large margin benefit (e.g. Bharat Forge long Jan + short Feb needed ~7.2k vs ~75k).", "Index futures margin ~12-15%; single stocks can be 45-60% (source era)."], "caveats": ["Margin rules changed after 2020 SEBI peak-margin regime; intraday leverage limits differ now."]}, {"id": "mark_to_market", "type": "Process", "name": "Mark to Market (M2M)", "modules": ["M04"], "aliases": ["M2M", "MTM"], "summary": "Daily settlement of futures P&L using previous close as reference; reference price resets to each day's close.", "formula": {"daily_m2m": "(close_t - ref_price) * qty * direction, ref = entry on day 1 else close_{t-1}"}, "facts": ["Sum of daily M2M = total P&L. M2M plus margins virtually eliminate counterparty default."], "example": "Hindalco long 165, closes 168.3/172.4/171.6, exit 170.1 -> M2M +6600 +8200 -1600 -3000 = +10,200."}, {"id": "margin_call", "type": "Event", "name": "Margin Call", "modules": ["M04"], "summary": "When cash balance after M2M falls below SPAN (maintenance) margin, broker demands funds or force-closes positions.", "conditions": {"trigger": "cash_balance + m2m < span_margin"}, "bot_use": "Monitor margin utilisation intraday; reduce positions before forced liquidation.", "example": "HDFC Bank 955->880 (-8%) on 1 lot (250) -> M2M -18,750 leaves 14,659 < SPAN 16,500 -> margin call."}, {"id": "expiry", "type": "Concept", "name": "Expiry, Contract Months and Rollover", "modules": ["M04"], "aliases": ["Near month", "Mid month", "Far month", "Rollover"], "summary": "Three concurrent monthly contracts (current/near, mid, far); price usually near < mid < far; on expiry a new far month is listed. Rollover = closing near-month and opening next month near expiry.", "facts": ["Directional view must play out before expiry.", "Near month is most liquid, hence rollover is common.", "Rollover data - rolling longs = bullish perception, rolling shorts = bearish (perception only)."]}, {"id": "product_types_fo", "type": "Concept", "name": "F&O Product Types (NRML, MIS, CO, BO)", "modules": ["M04"], "aliases": ["Cover order", "Bracket order", "NRML"], "summary": "More risk information to broker RMS -> lower margin. NRML = carry forward (full SPAN+exposure); MIS = intraday (lower); CO = intraday + mandatory stop (lower still); BO = intraday + stop + target + optional trailing (same margin as CO).", "facts": ["MIS/CO/BO auto-squared off ~3:20 PM. RMS cares about risk not reward", "so target doesn't lower margin."], "caveats": ["Bracket orders were later discontinued by many brokers; check availability."]}, {"id": "overnight_risk", "type": "Concept", "name": "Overnight Risk", "modules": ["M04"], "summary": "Risk of adverse news/moves while markets are closed (e.g. crude spikes overnight hitting BPCL longs); longer holding = more risk = more margin."}, {"id": "trailing_stop", "type": "Rule", "name": "Trailing Stop Loss", "modules": ["M04"], "summary": "Move the stop in the trade's favour as price advances to lock in profit and ride momentum beyond the original target.", "conditions": {"step_rule": "for every N points of favourable move, raise stop by N (example N=15)"}, "bot_use": "Implement fixed-step, ATR-based or Supertrend trailing stops.", "example": "Infosys long 2175, SL 2150, target 2220; trailing every 15 pts -> exited 2230 for +55 vs planned +45."}, {"id": "short_selling_mechanics", "type": "Rule", "name": "Shorting - Spot vs Futures", "modules": ["M04"], "summary": "Spot shorts must be squared off intraday (else short delivery -> auction penalty up to ~20%); futures shorts can be carried overnight with same margin and M2M as longs; short stop is always above entry."}, {"id": "index_futures", "type": "Instrument", "name": "Nifty (Index) Futures", "modules": ["M04"], "aliases": ["Nifty futures", "Bank Nifty futures"], "summary": "Futures on the Nifty index; most liquid derivative in India.", "bot_use": "Preferred instrument for systematic index strategies and portfolio hedges.", "facts": ["Benefits vs stock futures - diversified (no unsystematic risk), hard to manipulate, very liquid (impact cost ~0.0125%), lower margins (12-15% vs up to 45-60%), broad economic call, TA works better, lower volatility (~16-17% vs 30%+ for stocks).", "Lot size changes over time (25 in 2015; verify current)."]}, {"id": "liquidity", "type": "Concept", "name": "Liquidity", "modules": ["M04"], "summary": "Ease of buying/selling without moving price; liquid instruments have tight spreads, low impact cost, attract institutions, and lower volatility."}, {"id": "impact_cost", "type": "Formula", "name": "Impact Cost", "modules": ["M04"], "summary": "Round-trip loss (buy at best ask, sell at best bid) as % of mid price; proxy for liquidity and market-order slippage.", "formula": {"impact_cost": "(best_ask - best_bid) / ((best_ask + best_bid)/2)"}, "conditions": {"avoid_market_orders": "impact_cost >> 0.0125%"}, "bot_use": "Slippage model in backtests; liquidity filter for universe.", "example": "MRF 98.7/38315.6 = 0.3% (illiquid); Nifty futures 1.1/8769.35 = 0.0125% (benchmark)."}, {"id": "futures_pricing", "type": "Formula", "name": "Futures Pricing (Spot-Futures Parity)", "modules": ["M04"], "aliases": ["Fair value", "Basis", "Premium", "Discount", "Contango", "Backwardation", "Cost of carry"], "summary": "Futures fair value = spot adjusted for risk-free carry minus dividends; basis (spread) = futures - spot; converges to zero at expiry.", "formula": {"fair_value": "spot * (1 + rf * days_to_expiry/365) - dividend", "basis": "futures - spot"}, "params": {"rf_proxy": "RBI 91-day T-bill yield"}, "facts": ["Market price differs slightly from fair value due to costs, taxes, margins, expected dividends; gap widens with days to expiry.", "Futures > spot = premium (contango); futures < spot = discount (backwardation, from short-term demand/supply imbalance)."], "example": "Infosys spot 2280.5, rf 8.3528%, 7 days -> 2283 (market 2284); 34 days -> 2299; 80 days -> 2322."}, {"id": "cash_and_carry", "type": "Strategy", "name": "Cash & Carry Arbitrage", "modules": ["M04"], "summary": "When futures trade far above fair value, buy spot and sell futures to lock the spread; unwind near expiry as prices converge.", "conditions": {"entry": "futures_market - fair_value >> costs", "legs": "long spot, short futures (equal quantity)", "exit": "just before expiry (sell spot, buy futures)"}, "example": "Wipro spot 653, fair futures 658, market 700 -> locked +47 regardless of expiry price."}, {"id": "calendar_spread", "type": "Strategy", "name": "Calendar Spread (Futures)", "modules": ["M04"], "summary": "Buy one expiry and sell another of the same underlying when their spread deviates from fair value; sell the expensive, buy the cheap.", "conditions": {"entry": "near-month trades far above fair value while mid-month near fair -> short near, long mid", "assumption": "mid month stays near fair value; near converges to spot at expiry"}, "facts": ["Hedged", "so margins are much lower; not entirely risk-free (liquidity", "execution", "volatility)."], "example": "Wipro near 700 (fair 658), mid 665 (fair 663) -> short near/long mid locks ~35."}, {"id": "hedging", "type": "Concept", "name": "Hedging", "modules": ["M04"], "summary": "Taking an offsetting position to insulate an existing position from adverse moves (like a fence around a garden).", "formula": {"recovery_needed": "1/(1 - loss) - 1"}, "facts": ["Why hedge rather than hold or sell - a 25% fall needs a 33.3% rise to recover; selling and re-buying requires timing, loses LTCG benefit and adds costs.", "Single stock hedge - short equal quantity of its futures; position becomes market-neutral.", "Stocks without futures or small positions - use beta-adjusted Nifty futures; positions smaller than one Nifty lot need options."]}, {"id": "systematic_risk", "type": "Concept", "name": "Systematic vs Unsystematic Risk", "modules": ["M04"], "aliases": ["Unsystematic risk", "Market risk", "Company-specific risk"], "summary": "Unsystematic (company-specific - revenue/margin decline, leverage, misconduct) is diversifiable (~21 stocks enough); systematic (GDP, rates, inflation, fiscal deficit, geopolitics) is not diversifiable but can be hedged."}, {"id": "diversification", "type": "Concept", "name": "Diversification", "modules": ["M04"], "summary": "Spreading capital across stocks/sectors to reduce unsystematic risk; benefit flattens beyond ~20-21 stocks."}, {"id": "beta", "type": "Formula", "name": "Beta", "modules": ["M04"], "summary": "Sensitivity of a stock's returns to market returns; market beta = 1; <1 low beta, >1 high beta, <0 inverse.", "formula": {"beta": "slope(stock_daily_returns, index_daily_returns) = cov(rs, rm)/var(rm)", "daily_return": "close_t/close_{t-1} - 1"}, "params": {"lookback": "~6 months daily"}, "example": "2015 betas - DLF 1.86, SBI 1.58, L&T 1.43, BPCL 1.42, Axis 1.40, Reliance 1.27, ACC 1.22, Maruti 0.95, Cipla 0.59, Infosys 0.43; TCS 0.62."}, {"id": "portfolio_hedge", "type": "Strategy", "name": "Portfolio Hedge with Nifty Futures", "modules": ["M04"], "summary": "Short beta-weighted value of Nifty futures to neutralise systematic risk of a long portfolio.", "formula": {"portfolio_beta": "sum(weight_i * beta_i)", "hedge_value": "portfolio_beta * portfolio_value", "lots": "hedge_value / (nifty_futures_price * lot_size)"}, "bot_use": "Automated beta-hedging overlay for long equity books.", "example": "8 lakh portfolio, beta 1.223 -> hedge 9.78 lakh -> 4.33 lots (choose 4 under-hedge or 5 over-hedge); Nifty -500 pts -> futures +54,125 vs portfolio -54,240.", "caveats": ["Fractional lots impossible - perfect hedge rarely possible."]}, {"id": "open_interest", "type": "Concept", "name": "Open Interest (OI)", "modules": ["M04"], "aliases": ["OI"], "summary": "Number of outstanding (open) derivative contracts; rises when new positions are created, falls when positions are closed, unchanged on transfers. Continuous across days unlike volume.", "conditions": {"long_buildup": "price up & OI up -> bullish", "short_buildup": "price down & OI up -> bearish", "short_covering": "price up & OI down -> shorts covering (bearish trend may end)", "long_unwinding": "price down & OI down -> longs exiting (bullish trend may end)", "caution": "abnormally high OI with rapid price move = euphoria/leverage; small trigger can cause panic"}, "bot_use": "Classify each bar as long buildup/short buildup/short covering/long unwinding as a positioning feature.", "facts": ["Sum of signed positions is always zero (zero-sum).", "Higher OI = more liquid market.", "Volume-price for derivatives - price up & volume up = more longs; price down & volume up = more shorts; price up & volume down = short covering; price down & volume down = long unwinding."]}, {"id": "module_m05", "type": "Module", "name": "M05 - Options Theory for Professional Trading", "modules": ["M05"], "summary": "Call/put basics, jargon, buyer/seller payoffs, moneyness, Greeks (delta, gamma, theta, vega), volatility (historical/forecast/implied/realised, India VIX), normal distribution and range estimation, SD-based option writing, volatility-based stops, volatility smile & cone, Greek interactions, Black-Scholes calculator, put-call parity, strike selection by time, and case studies (event IV crush)."}, {"id": "options", "type": "Instrument", "name": "Options (overview)", "modules": ["M05"], "aliases": ["Option contract"], "summary": "Right but not obligation for the buyer (who pays premium) to buy (call) or sell (put) the underlying at a strike on/before expiry; seller/writer has the obligation. ~80% of Indian derivatives volume (source era).", "facts": ["Indian history - index futures Jun 2000, index options Jun 2001, stock options Jul 2001, stock futures Nov 2001; real liquidity from ~2006.", "Options are cash settled in India (stock options later moved to physical settlement - verify).", "Option seller has natural statistical edge - 2 of 3 scenarios (flat, adverse) favour seller.", "Most traders trade premium changes rather than hold to expiry; premiums can swing 100-350% intraday.", "Option sellers tend to hold to expiry to earn full premium."]}, {"id": "option_jargon", "type": "Concept", "name": "Option Jargon (strike, underlying, premium, expiry, exercise, settlement, option chain)", "modules": ["M05"], "aliases": ["Strike price", "Premium", "Option chain", "CE", "PE"], "summary": "Strike = anchor price; underlying = spot; premium = price paid by buyer to writer (never fixed, driven by Greeks); expiry = last valid date (3 monthly series per source); exercise = claiming the right (European - only on expiry); option chain lists all strikes with LTP, bid/ask, OI, volume, IV.", "facts": ["CE = European call", "PE = European put. All Indian options are European (American stock options were discontinued)."]}, {"id": "european_vs_american", "type": "Concept", "name": "European vs American Options", "modules": ["M05"], "summary": "European options exercise only at expiry based on expiry-day spot; American anytime before expiry (hence more expensive). All Indian options are European."}, {"id": "call_option", "type": "Instrument", "name": "Call Option (long and short)", "modules": ["M05"], "aliases": ["Long call", "Short call", "CE"], "summary": "Buyer bullish with limited risk (premium) and unlimited upside; seller expects price not to rise above strike, earns limited premium with unlimited risk and must post futures-like margin.", "formula": {"intrinsic_value_expiry": "max(0, spot - strike)", "long_call_pnl": "max(0, spot - strike) - premium_paid", "short_call_pnl": "premium_received - max(0, spot - strike)", "breakeven": "strike + premium"}, "example": "Bajaj Auto 2050 CE at 6.35 - breakeven 2056.35; at 2072 buyer +15.65, seller -15.65."}, {"id": "put_option", "type": "Instrument", "name": "Put Option (long and short)", "modules": ["M05"], "aliases": ["Long put", "Short put", "PE"], "summary": "Buyer bearish - right to sell at strike; seller bullish/neutral, earns limited premium with large risk.", "formula": {"intrinsic_value_expiry": "max(0, strike - spot)", "long_put_pnl": "max(0, strike - spot) - premium_paid", "short_put_pnl": "premium_received - max(0, strike - spot)", "breakeven": "strike - premium"}, "facts": ["Whether to buy a call or sell a put when bullish depends on premium attractiveness (pricing/IV)."], "example": "Bank Nifty 18400 PE at 315 - breakeven 18085; at 16510 buyer +1575."}, {"id": "options_payoff_summary", "type": "Rule", "name": "Four Option Positions Summary", "modules": ["M05"], "summary": "Bullish - buy call or sell put; bearish - buy put or sell call. Buyers - limited risk, unlimited reward; sellers - limited reward, unlimited risk ('eat like a chicken, shit like an elephant' - Taleb/Das).", "facts": ["Buying to close a short (or selling to close a long) is a square-off, not a new long/short.", "P&L formulas apply when held to expiry; premiums move continuously before expiry."]}, {"id": "moneyness", "type": "Concept", "name": "Moneyness (ITM / ATM / OTM)", "modules": ["M05"], "aliases": ["ITM", "ATM", "OTM", "In the money", "Out of the money", "At the money", "Deep ITM", "Deep OTM"], "summary": "ITM has positive intrinsic value; ATM strike is nearest to spot; OTM has zero intrinsic value. Calls - strikes below ATM are ITM; puts - strikes above ATM are ITM. ITM premiums > OTM premiums.", "conditions": {"call_itm": "strike < spot", "call_otm": "strike > spot", "put_itm": "strike > spot", "put_otm": "strike < spot", "atm": "argmin |strike - spot|"}, "facts": ["Intrinsic value can never be negative (preserves limited-loss property)."]}, {"id": "option_greeks", "type": "Concept", "name": "Option Greeks", "modules": ["M05"], "summary": "Sensitivities of premium - delta (spot), gamma (change in delta), theta (time), vega (volatility); computed by Black-Scholes; interact with each other."}, {"id": "delta", "type": "Greek", "name": "Delta", "modules": ["M05"], "summary": "Change in premium per 1-point change in underlying; calls 0..1, puts -1..0; ATM ~0.5, ITM -> 1, OTM -> 0. First derivative of premium.", "formula": {"premium_change": "delta * underlying_change", "position_delta": "sum(qty_lots * delta * sign)"}, "bot_use": "Size option positions by net delta exposure; use delta as ITM probability for strike selection; hedge to delta-neutral.", "facts": ["Delta changes with spot (moneyness changes).", "Delta stages - predevelopment (deep OTM ~0, big % but needs huge move), take-off & acceleration (OTM->ATM, max bang for buck), stabilisation (ITM->deep ITM, delta -> 1).", "Deep ITM option (delta 1) behaves like futures - can substitute with lower capital but watch liquidity.", "Deltas are additive across options of same underlying; futures delta = 1; two ATM options ~ one future (but not a true surrogate - other Greeks act).", "Short call = negative delta; short put = positive delta.", "Delta ~ probability of expiring ITM (0.1 delta -> ~10%).", "Delta-neutral positions (net delta 0, e.g. long ATM CE + long ATM PE) are insulated from direction but exposed to vol and time."], "example": "Nifty 8288, 8250 CE at 133, delta 0.55; Nifty to 8310 -> premium ~145.1."}, {"id": "delta_neutral", "type": "Concept", "name": "Delta Neutral Position", "modules": ["M05"], "summary": "Combined options position with net delta ~0; unaffected by small directional moves, sensitive to volatility and time."}, {"id": "gamma", "type": "Greek", "name": "Gamma", "modules": ["M05"], "summary": "Rate of change of delta per point of underlying (2nd derivative of premium); always positive for long options. Long options = long gamma; short options = short gamma.", "formula": {"new_delta": "delta + gamma * underlying_change"}, "bot_use": "Risk limits should use gamma-adjusted (scenario) delta, not lot counts.", "facts": ["Gamma peaks at ATM; low for deep ITM/OTM.", "Near expiry ATM gamma shoots up; ITM/OTM gamma -> 0.", "Short gamma makes positions grow against you - a 10-lot short ATM (delta 5) can become delta 8.5 after a 70-pt adverse move.", "Avoid shorting ATM/high-gamma options, especially near expiry; never short ATM/ITM hoping they expire worthless; OTM options are better short candidates if held to expiry."], "example": "8400 CE delta 0.3 gamma 0.0025; +70 pts -> delta 0.475, premium 26 -> 47."}, {"id": "theta", "type": "Greek", "name": "Theta (Time Decay)", "modules": ["M05"], "summary": "Premium lost per day from passage of time, all else equal; options are depreciating assets. Long options = negative theta; short options = positive theta (friend of sellers).", "formula": {"premium_tomorrow": "premium_today - theta"}, "facts": ["Time decay is slow early in the series and accelerates sharply near expiry.", "Selling early collects more time value but decays slowly; selling near expiry collects less but decays fast."], "example": "Short at 54 with theta 0.75 -> ~51.75 after 3 days."}, {"id": "option_premium_decomposition", "type": "Formula", "name": "Premium = Intrinsic Value + Time Value", "modules": ["M05"], "summary": "Premium splits into intrinsic value (exercise value now) and time value (compensation to writer for time risk).", "formula": {"time_value": "premium - intrinsic_value"}, "example": "Nifty 8531, 8600 CE at 99.4 -> all time value; 8514.5, 8450 CE at 160 -> IV 64.5, TV 95.5."}, {"id": "volatility", "type": "Concept", "name": "Volatility (standard deviation of returns)", "modules": ["M05"], "summary": "Volatility = risk = standard deviation of (log) returns, expressed as %; higher SD = wider expected range.", "formula": {"log_return": "ln(P_t / P_{t-1})", "daily_vol": "stdev(log_returns)", "annual_vol": "daily_vol * sqrt(252 or 365)", "period_vol": "daily_vol * sqrt(days)", "daily_from_annual": "annual_vol / sqrt(365)"}, "example": "Wipro daily vol 1.47% -> annual ~28% (NSE 1.34%/25.5%)."}, {"id": "standard_deviation", "type": "Formula", "name": "Standard Deviation and Variance", "modules": ["M05"], "summary": "Variance = mean of squared deviations from mean; SD = sqrt(variance); measures dispersion/consistency.", "formula": {"variance": "sum((x - mean)^2)/n", "sd": "sqrt(variance)"}, "example": "Billy SD 1.79 vs Mike SD 11.18 - Billy more consistent despite lower mean."}, {"id": "normal_distribution", "type": "Concept", "name": "Normal Distribution and Price Ranges", "modules": ["M05"], "aliases": ["Bell curve", "Random walk", "Black swan"], "summary": "Daily returns are a random walk but approximately normally distributed; ~68% within 1 SD, 95% within 2 SD, 99.7% within 3 SD; outside 3 SD = black swan.", "formula": {"period_mean": "daily_mean * days", "period_sd": "daily_sd * sqrt(days)", "upper": "spot * exp(period_mean + k*period_sd)", "lower": "spot * exp(period_mean - k*period_sd)"}, "bot_use": "Expected-move bands for strike selection, stop placement and position risk.", "example": "Nifty 8337, daily mean 0.04%, SD 1.046% -> 1-yr 1SD range 7777-10841; 30-day 1SD 7963-8930, 2SD 7520-9457.", "caveats": ["Real returns have fat tails - black swans happen more often than normal implies."]}, {"id": "sd_option_writing", "type": "Strategy", "name": "SD-Based OTM Option Writing (author's method)", "modules": ["M05"], "summary": "Compute 1-SD (or 2-SD) expected range to expiry and sell options outside it; author sells only calls, ~1 SD away, on the Friday before expiry week.", "conditions": {"range": "spot*(1 +/- (daily_mean*days +/- daily_sd*sqrt(days)))", "sell_calls": "strikes above upper 1SD bound", "sell_puts": "strikes below lower bound (author avoids puts - panic spreads faster than greed)", "timing": "last Friday before expiry week (~4-7 days to expiry); never > 15 days to expiry; use 2SD if writing earlier", "avoid": "events - monetary policy, results, policy decisions", "exit": "when written option turns ATM, or sentiment turns", "instruments": "Nifty, Bank Nifty, SBI, Infosys, Reliance, Tata Steel, Tata Motors, TCS (liquid only)"}, "params": {"max_capital_per_strategy_pct_of_trading_bucket": 35}, "bot_use": "Weekly premium-selling bot with SD strike selection, event calendar filter and ATM-touch exit.", "example": "Nifty 8462, 16 days, daily SD 0.89% -> range 8214-8818; sell 8850/8900 CE for 7.45/4.85 -> ~1.55% on ~12k margin.", "caveats": ["Small steady gains", "rare catastrophic losses; keep costs minimal; paper-trade several expiries first."]}, {"id": "capital_allocation_author", "type": "Rule", "name": "Author's Capital Allocation", "modules": ["M05"], "summary": "100% equity-oriented - 35% equity mutual funds via SIP (4 funds), 40% direct portfolio (~12 stocks, 5+ yrs), 25% short-term trading; max 35% of trading bucket per strategy (~9% of total capital)."}, {"id": "volatility_stop_loss", "type": "Rule", "name": "Volatility-Based Stop Loss", "modules": ["M05"], "summary": "Place stop outside expected noise - entry minus (daily vol x sqrt(holding days)) - instead of a fixed %; re-check RRR with the new stop.", "formula": {"stop_long": "entry * (1 - daily_vol * sqrt(holding_days))"}, "bot_use": "Default stop model for swing strategies.", "example": "Airtel long 395, daily vol 1.8%, 5 days -> 4.01% -> stop below 379 (use 375); RRR 32/20 = 1.6 still OK."}, {"id": "implied_volatility", "type": "Concept", "name": "Volatility Types - Historical, Forecast, Implied, Realised; India VIX", "modules": ["M05"], "aliases": ["IV", "India VIX", "VIX", "Historical volatility", "Realized volatility", "GARCH"], "summary": "Historical (from past prices), forecast (models such as GARCH(1,1)), implied (market consensus embedded in premium - most valued), realised (actual over the period). India VIX = NSE's 30-day implied vol of Nifty options ('fear index').", "bot_use": "Regime filter (VIX level/percentile) for buying vs selling options; IV rank for strategy choice.", "facts": ["Many professionals trade volatility rather than direction.", "VIX rises in steep/panic markets.", "Aug 24 2015 - Nifty -4.9%, VIX +64%, far OTM calls rose 50-80% (low delta + vega)."]}, {"id": "vega", "type": "Greek", "name": "Vega", "modules": ["M05"], "summary": "Change in premium per 1% change in volatility; positive for long calls and puts; impact largest with more time to expiry and for OTM options.", "facts": ["30 days to expiry, vol 15->30% moved premium ~95%; 15 days ~50%; 5 days ~47%.", "Buy options when vol is expected to rise; sell when expected to fall.", "High IV raises cost and lowers profit potential of debit spreads (bull call spread 72 cost at 20% IV vs 82 at 35%)."]}, {"id": "volatility_smile", "type": "Concept", "name": "Volatility Smile", "modules": ["M05"], "summary": "IV is lowest at ATM and rises for strikes further OTM/ITM, plotting a smile."}, {"id": "volatility_cone", "type": "Model", "name": "Volatility Cone", "modules": ["M05"], "summary": "Plot min/-2SD/-1SD/mean/+1SD/+2SD/max of historical realised vol for different windows to expiry (10..90 days); overlay current IVs to spot rich (near +2SD -> short) or cheap (near -2SD -> buy) options.", "conditions": {"short_vol": "current IV >= +2SD of realised vol for same days-to-expiry", "long_vol": "current IV <= -2SD"}, "bot_use": "Relative-value IV signal across strikes and underlyings.", "caveats": ["Use only for liquid options."]}, {"id": "greek_interactions", "type": "Concept", "name": "Greek Interactions", "modules": ["M05"], "summary": "Gamma vs time - ATM gamma explodes near expiry, ITM/OTM gamma -> 0; delta vs IV - high IV keeps far OTM deltas non-zero (explains rich far-OTM premiums), low IV flattens deltas at extremes."}, {"id": "black_scholes", "type": "Model", "name": "Black-Scholes Option Pricing", "modules": ["M05"], "aliases": ["BS model", "Options calculator"], "summary": "Inputs - spot (or futures for futures-based options), strike, risk-free rate (RBI 91-day T-bill), implied volatility, dividend (if ex-date before expiry), calendar days to expiry; outputs theoretical call/put prices and Greeks.", "formula": {"d1": "(ln(S/K) + (r - q + sigma^2/2) T) / (sigma sqrt(T))", "d2": "d1 - sigma sqrt(T)", "call": "S e^{-qT} N(d1) - K e^{-rT} N(d2)", "put": "K e^{-rT} N(-d2) - S e^{-qT} N(-d1)"}, "facts": ["Black & Scholes (1973)", "Merton; Nobel 1997. Small model errors expected."]}, {"id": "put_call_parity", "type": "Formula", "name": "Put-Call Parity", "modules": ["M05"], "summary": "For European options of same strike/expiry - put + spot = PV(strike) + call; at expiry put + spot = strike + call.", "formula": {"pcp": "P + S = C + K*exp(-r*T)"}, "bot_use": "Detect mispricing / synthetic positions (synthetic long = long call + short put).", "example": "Infy 1200 - at 1100 or 1350 both portfolios (PE + share vs CE + cash) worth the same."}, {"id": "strike_selection", "type": "Rule", "name": "Strike Selection by Series Half and Target Time", "modules": ["M05"], "summary": "Which strike to buy depends on when in the series you trade and how fast the target is expected.", "conditions": {"first_half_target_5d": "far OTM (2 strikes from ATM)", "first_half_target_15d": "ATM or slightly OTM (1 strike)", "first_half_target_25d": "slightly ITM", "first_half_target_expiry": "ITM", "second_half_same_day": "far OTM (2-3 strikes)", "second_half_target_5d": "slightly OTM (1 strike)", "second_half_target_10d_or_expiry": "ATM or slightly ITM", "general": "buy options when vol expected to rise; sell when expected to fall; don't buy far OTM just because cheap - needs a fast move"}, "bot_use": "Map signal horizon & days-to-expiry to strike offset automatically."}, {"id": "iv_crush", "type": "Strategy", "name": "Event Volatility Play (short straddle before event, exit before announcement)", "modules": ["M05"], "aliases": ["IV crush", "Event trade"], "summary": "IV rises into scheduled events (RBI policy, results); short ATM call + put a few days before and buy back as IV drops - ideally minutes before/at the announcement. Long straddles into events often lose because the losing leg's premium collapses faster than the winning leg gains.", "conditions": {"entry": "2-4 days before known event, IV elevated, short ATM CE + ATM PE (liquid)", "exit": "time-based stop - just before announcement (or right after, as IV collapses)", "stop": "volatility-based, not premium-based"}, "bot_use": "Event-calendar driven vol-selling strategy with time exits.", "example": "Infosys Q2 - sold 1140 CE 48 + PE 47 (IV 40%/48%) 4 days before; after results CE 55 (IV 28%) + PE 20 (IV 40%) -> +20/lot. RBI trade +10/lot."}, {"id": "option_case_lessons", "type": "Rule", "name": "Options Trading Lessons from Case Studies", "modules": ["M05"], "summary": "Prefer near-ATM strikes in stock options for liquidity; on 'exhaustion' views prefer selling calls (sideways likely) in 2nd half of series with SD-based strikes; author buys naked calls mainly on flag patterns (prior rally 5-10%, low-volume ~3% pullback); define entry, exit and stop for every trade."}, {"id": "module_m06", "type": "Module", "name": "M06 - Option Strategies", "modules": ["M06"], "summary": "Behavioural warning on gambling with options; bull call/put spreads, call ratio back spread, bear call ladder, synthetic long and put-call-parity arbitrage, bear put/call spreads, put ratio back spread, long/short straddle and strangle, max pain and PCR. (The source lists further strategies - straps, strips, iron condor, butterfly, box, synthetic put, bull put ladder - but does not cover them.)"}, {"id": "option_strategy_principles", "type": "Rule", "name": "Option Strategy Principles", "modules": ["M06"], "summary": "Know a handful of strategies well and map market view to strategy; never treat options as lottery tickets ('limited risk, unlimited profit' is a silent P&L killer); professionals prefer spreads for risk visibility even at lower profit; prefer net-credit strategies; always sum deltas to know a multi-leg position's directional bias.", "facts": ["Moderate move quantified by volatility - volatile stocks 5-8%, less volatile stocks and indices < 5%.", "Delta-neutral strategies react to volatility and time ('volatility based strategies').", "Winning on options can be addictive (reflexive vs reflective brain)."]}, {"id": "strategy_selector", "type": "Rule", "name": "View -> Option Strategy Map", "modules": ["M06"], "summary": "Map outlook and volatility view to a strategy.", "conditions": {"moderately_bullish_low_iv": "bull_call_spread", "moderately_bullish_after_fall_high_iv": "bull_put_spread", "outright_bullish": ["call_ratio_back_spread", "bear_call_ladder"], "moderately_bearish_low_iv": "bear_put_spread", "moderately_bearish_after_rally_high_iv": "bear_call_spread", "outright_bearish": "put_ratio_back_spread", "big_move_unknown_direction_low_iv_rising": ["straddle", "strangle"], "range_bound_high_iv_falling": ["short_straddle", "short_strangle"], "replicate_futures": "synthetic_long"}, "bot_use": "Rule table for an options strategy engine keyed on direction signal strength + IV regime + days to expiry."}, {"id": "bull_call_spread", "type": "Strategy", "name": "Bull Call Spread (debit)", "modules": ["M06"], "summary": "Moderately bullish - buy ATM (lower) call, sell OTM (higher) call, same expiry/underlying/quantity; caps profit to reduce cost.", "formula": {"net_debit": "premium_lower_call - premium_higher_call", "max_loss": "net_debit", "max_profit": "spread - net_debit", "breakeven": "lower_strike + net_debit"}, "conditions": {"strike_first_half": "target in 5d -> far OTM pair; 15d -> slightly OTM; 25d/expiry -> ATM", "strike_second_half": "1-5d -> far OTM; 10d -> slightly OTM; expiry -> ATM"}, "facts": ["Wider spread -> more profit potential but higher breakeven. Higher IV raises cost and lowers profit."], "example": "Nifty 7846 - buy 7800 CE 79, sell 7900 CE 25 -> debit 54, max profit 46, BE 7854."}, {"id": "bull_put_spread", "type": "Strategy", "name": "Bull Put Spread (credit)", "modules": ["M06"], "summary": "Moderately bullish after a fall when put premiums/IV are high and time is ample - buy OTM put, sell ITM put.", "formula": {"net_credit": "premium_higher_put - premium_lower_put", "max_profit": "net_credit", "max_loss": "spread - net_credit", "breakeven": "higher_strike - net_credit"}, "example": "Nifty 7805 - buy 7700 PE 72, sell 7900 PE 163 -> credit 91, max loss 109, BE 7809."}, {"id": "call_ratio_back_spread", "type": "Strategy", "name": "Call Ratio Back Spread", "modules": ["M06"], "summary": "Outright bullish - sell 1 ITM call, buy 2 OTM calls (strict 2:1), usually for net credit; unlimited upside, small profit if market falls, max loss at higher strike.", "formula": {"net_credit": "premium_lower - 2*premium_higher", "max_loss": "spread - net_credit (at higher strike)", "downside_payoff": "net_credit", "lower_breakeven": "lower_strike + net_credit", "upper_breakeven": "higher_strike + max_loss"}, "conditions": {"strikes": "slightly ITM short + slightly OTM long when time is ample; in 2nd half use deep ITM short + slightly ITM long", "volatility": "rising IV helps with ample time; hurts with few days left; avoid starting when IV > ~2x normal"}, "example": "Nifty 7743 - sell 7600 CE 201, buy 2x 7800 CE 78 -> credit 45, max loss 155 at 7800, BEs 7645/7955."}, {"id": "bear_call_ladder", "type": "Strategy", "name": "Bear Call Ladder (actually bullish)", "modules": ["M06"], "summary": "Sell 1 ITM call, buy 1 ATM and 1 OTM call (1:1:1) for net credit; profits big above upper breakeven, modest if market falls, loses if market stalls; best on stocks around quarterly results.", "formula": {"net_credit": "prem_ITM - prem_ATM - prem_OTM", "max_loss": "(ATM - ITM strike) - net_credit, between ATM and OTM strikes", "lower_breakeven": "ITM_strike + net_credit", "upper_breakeven": "ATM_strike + OTM_strike - ITM_strike - net_credit"}, "example": "Nifty 7790 - sell 7600 CE 247, buy 7800 CE 117 and 7900 CE 70 -> credit 60; loss zone 7660-8040."}, {"id": "synthetic_long", "type": "Strategy", "name": "Synthetic Long (and PCP Arbitrage)", "modules": ["M06"], "summary": "Long ATM call + short ATM put replicates long futures (linear payoff); breakeven = strike + net premium. Arbitrage - synthetic long + short futures should net zero at expiry; a positive locked P&L after costs is an arbitrage.", "formula": {"synthetic_long": "+C(K) - P(K)", "arbitrage": "C(K) - P(K) - F + (F - K) ... P&L at expiry = (F - K) - (C - P) ; trade if > costs"}, "facts": ["Arbitrage risks (fish-market analogy) - opportunity, liquidity, execution, transaction cost, competition erodes it."], "example": "Nifty 7304, fut 7316; long 7300 CE 79.5, short 7300 PE 73.85, short fut 7316 -> locks ~10.35 pts before costs."}, {"id": "arbitrage", "type": "Concept", "name": "Arbitrage", "modules": ["M06"], "summary": "Buying in the cheaper market and selling in the dearer one to lock a near-riskless spread; governed by simple parity equations; risks are opportunity, liquidity, execution, costs, and competition."}, {"id": "bear_put_spread", "type": "Strategy", "name": "Bear Put Spread (debit)", "modules": ["M06"], "summary": "Moderately bearish (~4-5% fall) - buy ITM put, sell OTM put.", "formula": {"net_debit": "premium_higher_put - premium_lower_put", "max_loss": "net_debit", "max_profit": "spread - net_debit", "breakeven": "higher_strike - net_debit"}, "facts": ["Volatility matters little early in series; in 2nd half deploy only if IV expected to rise."], "example": "Nifty 7485 - buy 7600 PE 165, sell 7400 PE 73 -> debit 92, max profit 108, BE 7508; position delta -0.276."}, {"id": "bear_call_spread", "type": "Strategy", "name": "Bear Call Spread (credit)", "modules": ["M06"], "summary": "Moderately bearish after a rally when call premiums are rich - buy OTM call, sell ITM call.", "formula": {"net_credit": "premium_lower_call - premium_higher_call", "max_profit": "net_credit", "max_loss": "spread - net_credit", "breakeven": "lower_strike + net_credit"}, "example": "Nifty 7222 - sell 7100 CE 136, buy 7400 CE 38 -> credit 98, max loss 202, BE 7198; delta -0.57."}, {"id": "put_ratio_back_spread", "type": "Strategy", "name": "Put Ratio Back Spread", "modules": ["M06"], "summary": "Outright bearish - sell 1 ITM put, buy 2 OTM puts (2:1) for net credit; unlimited downside profit, limited profit if market rises; never execute for a net debit.", "formula": {"net_credit": "premium_higher_put - 2*premium_lower_put", "max_loss": "spread - net_credit (at lower strike)", "lower_breakeven": "lower_strike - max_loss", "upper_breakeven": "lower_strike + max_loss"}, "example": "Nifty 7506 - sell 7500 PE 134, buy 2x 7200 PE 46 -> credit 42, max loss 258, BEs 6942/7458."}, {"id": "straddle", "type": "Strategy", "name": "Long / Short Straddle", "modules": ["M06"], "aliases": ["Long straddle", "Short straddle"], "summary": "Long - buy ATM call + ATM put (delta neutral) to profit from a large move either way; short - sell both to profit from range-bound markets / falling IV.", "formula": {"long_max_loss": "net premium paid (at strike)", "breakevens": "strike +/- net premium", "short_max_profit": "net premium received"}, "conditions": {"long_requires": "low IV at entry, IV rising, large quick move before expiry, event outcome far from expectations", "short_requires": "high IV at entry, IV falling during hold (e.g. sell before events, exit at announcement)"}, "example": "Nifty 7579 long 7600 straddle BEs 7435/7765 (2.2% move needed); short straddle 7600 CE 77 + PE 88 = 165 credit.", "caveats": ["Long straddles bought into events often lose due to IV crush; theta hurts longs; deltas drift as market moves - dynamic re-hedging needed to stay neutral."]}, {"id": "strangle", "type": "Strategy", "name": "Long / Short Strangle", "modules": ["M06"], "summary": "Like a straddle with OTM call and put (equidistant, equal lots) - cheaper but wider breakevens; short strangle sells OTM wings to collect premium in ranges.", "formula": {"long_max_loss": "net premium paid (between strikes)", "upper_breakeven": "call_strike + net_premium", "lower_breakeven": "put_strike - net_premium"}, "conditions": {"short_strangle_setup": "stock in trading range (double/triple tops-bottoms) - write strikes outside range, watch for breakouts"}, "example": "Nifty 7921 - 7700 PE 28 + 8100 CE 32 = 60; BEs 7640/8160."}, {"id": "max_pain", "type": "Indicator", "name": "Max Pain (Option Pain)", "modules": ["M06"], "summary": "Strike at which total intrinsic payout to option buyers (loss to writers) is minimum; theory says expiry gravitates there.", "formula": {"writer_loss_at_S": "sum_over_strikes(call_OI_k * max(0, S - k) + put_OI_k * max(0, k - S))", "max_pain": "argmin_S writer_loss_at_S over listed strikes"}, "conditions": {"author_variant": "compute at ~15 days to expiry; add +5% buffer; expect expiry between max_pain and max_pain*1.05; write calls beyond the buffer; avoid writing puts; hold to expiry, no averaging"}, "caveats": ["Controversial", "no academic backing; the 5% buffer ~1.5-2 SD; backtest before use."]}, {"id": "put_call_ratio", "type": "Indicator", "name": "Put-Call Ratio (PCR)", "modules": ["M06"], "aliases": ["PCR"], "summary": "Total put OI / total call OI; contrarian sentiment indicator.", "formula": {"pcr": "sum(put_OI) / sum(call_OI)"}, "conditions": {"extreme_bearish_contrarian_long": "pcr > ~1.3 (oversold, expect bounce)", "extreme_bullish_contrarian_short": "pcr < ~0.5 (overbought, expect decline)", "neutral": "0.5 <= pcr <= 1"}, "caveats": ["Calibrate extremes per instrument from 1-2 years of history; some use volume or traded value. Source's key-takeaway wording ('>1.3 bearish') refers to the crowd's positioning", "interpretation is contrarian."]}, {"id": "module_m07", "type": "Module", "name": "M07 - Markets and Taxation", "modules": ["M07"], "summary": "Indian income tax basics for market participants (as of FY 2014-15/2015-16) - FY vs AY, slabs, classifying income (LTCG, STCG, speculative and non-speculative business income), investor taxation incl. indexation and FIFO, trader taxation, loss set-off/carry-forward, tax-loss harvesting, BTST treatment, advance tax, business turnover and tax audit (44AB/44AD), personal balance sheet/P&L/books, ITR forms.", "caveats": ["ALL RATES/THRESHOLDS ARE FROM THE SOURCE ERA (FY2014-16). Indian tax law has changed materially since (e.g. LTCG on listed equity reintroduced in 2018; STCG/LTCG rates revised in July 2024; debt MF and indexation rules changed 2023-24; business-income ITR is now ITR-3; audit thresholds changed). Treat as conceptual framework; verify current law before use."]}, {"id": "income_tax_basics", "type": "Tax", "name": "Income Tax Basics (FY, AY, slabs)", "modules": ["M07"], "summary": "Tax on income under Income-tax Act 1961; FY = year income earned (Apr 1 - Mar 31); AY = following year in which it is filed; IT dept sees all PAN-linked market activity.", "facts": ["FY14-15 individual slabs (<60) - 0-2.5L nil; 2.5-5L 10%; 5-10L 25k + 20%; >10L 1.25L + 30%.", "Only ~2.9% of Indians paid tax (2015)."], "caveats": ["Slabs and regimes have changed (new tax regime introduced 2020)."]}, {"id": "market_income_classification", "type": "Tax", "name": "Classifying Market Income (Investor vs Trader)", "modules": ["M07"], "summary": "Heads - LTCG, STCG, speculative business income (intraday equity), non-speculative business income (all F&O - equity, currency, commodity - and frequent delivery trading). You can be both investor and trader; keep portfolios demarcated and classification consistent across years.", "conditions": {"ltcg": "equity delivery held > 1 year", "stcg": "equity delivery held 1 day to 1 year, low frequency", "speculative_business": "intraday equity", "non_speculative_business": "F&O (any segment) or high-frequency delivery trading (e.g. several times a week)"}, "facts": ["CBDT 2007 circular - buy for dividends = investor; buy and sell to profit = trader (vague, AO discretion).", "F&O trading and intraday equity must be declared as business income (losses too) - non-declaration triggers scrutiny.", "If markets are your only income, classify equity trades as business income; salaried people can more easily treat delivery trades as capital gains.", "Intraday is speculative (no delivery intent); F&O is non-speculative by definition (hedging/delivery possible)."]}, {"id": "capital_gains_tax", "type": "Tax", "name": "Capital Gains Tax on Equity and Mutual Funds (source era)", "modules": ["M07"], "aliases": ["LTCG", "STCG"], "summary": "LTCG on listed equity/equity MFs via exchange (STT paid) 0%; STCG 15%. Off-market - LTCG 10% listed / 20% unlisted, STCG at slab. Debt/non-equity MFs - long-term after 3 years at 20% with indexation, else slab.", "bot_use": "Tax-aware exit timing (holding-period counter); after-tax backtest returns.", "facts": ["Equity-oriented MF = >= 65% in domestic equity.", "Holding period computed FIFO across multiple purchases.", "STT cannot be added to cost for capital gains; brokerage and other charges can.", "Short-term capital losses carry forward 8 years against capital gains; long-term equity losses (when LTCG was exempt) were dead losses."], "example": "Buy 100 Reliance 10-Apr-14 @800 and 100 on 1-Jun-14 @820; sell 150 on 1-May-15 @920 -> 100 sh LTCG 12,000 (0%), 50 sh STCG 5,000 (15%).", "caveats": ["Current law differs (verify): LTCG on listed equity taxable above an exemption limit since 2018; STCG and LTCG rates revised in 2024."]}, {"id": "indexation", "type": "Formula", "name": "Indexation (Cost Inflation Index)", "modules": ["M07"], "summary": "Inflates purchase cost by CII to tax only real gains on debt funds, property, gold etc.", "formula": {"indexed_cost": "purchase_value * CII_sale_year / CII_purchase_year", "ltcg": "sale_value - indexed_cost"}, "example": "Debt fund 1L (2005, CII 497) -> 3L (2015, CII 1024): indexed cost 2,06,036; LTCG 93,964; tax 18,792 vs 40,000 unindexed.", "caveats": ["Indexation benefit removed for many assets in 2023-24 changes - verify."]}, {"id": "stt", "type": "Tax", "name": "Securities Transaction Tax (STT)", "modules": ["M07"], "aliases": ["STT"], "summary": "Tax on exchange-traded securities transactions (0.1% on equity delivery in source); not on off-market transfers; not deductible for capital gains but deductible as business expense."}, {"id": "business_income_tax", "type": "Tax", "name": "Taxation of Trading as Business Income", "modules": ["M07"], "summary": "Speculative and non-speculative business income is added to other income and taxed at slab rates; expenses can be claimed.", "facts": ["Pros - low tax if total income low; claim expenses (brokerage, STT, charges, proportional internet/phone/rent, computer depreciation, staff salary, advisory, books); set off non-speculative losses against other non-salary income same year; carry forward.", "Cons - up to 30% slab on profits; ITR-4 (now ITR-3) needs CA; books and possible audit."], "example": "Salary 10L + F&O 1L + intraday 1L -> slab tax on 12L = 1.85L; plus STCG 1L @15% = 15k."}, {"id": "loss_set_off_rules", "type": "Tax", "name": "Loss Set-off and Carry-forward Rules", "modules": ["M07"], "summary": "Must file on time to carry forward. Non-speculative (F&O) loss - same year vs any income except salary; carried forward 8 years vs non-speculative business income only. Speculative (intraday) loss - only vs speculative gains, carried 4 years. STCL - vs capital gains, 8 years.", "conditions": {"speculative_loss_vs_fno_gain": "NOT allowed", "fno_loss_vs_speculative_gain": "allowed (same year)"}}, {"id": "tax_loss_harvesting", "type": "Strategy", "name": "Tax Loss Harvesting", "modules": ["M07"], "summary": "Near financial year-end, book unrealised losses (and re-enter the position) to offset realised gains and defer tax outgo.", "bot_use": "Year-end (March) routine to realise losses against realised gains, respecting wash-trade/regulatory concerns."}, {"id": "btst_tax", "type": "Tax", "name": "BTST Tax Treatment", "modules": ["M07"], "summary": "Debated - author treats BTST as STCG/non-speculative (STT charged like delivery) if infrequent; if frequent, show as speculative business income."}, {"id": "advance_tax", "type": "Tax", "name": "Advance Tax", "modules": ["M07"], "summary": "Business income or realised STCG requires advance tax instalments - 30% by 15 Sep, 60% by 15 Dec, 100% by 15 Mar (source; a 15 June instalment now also exists); ~12% p.a. interest on shortfall; pay on profits realised to date, claim refund if overpaid."}, {"id": "tax_audit", "type": "Tax", "name": "Business Turnover and Tax Audit (44AB / 44AD)", "modules": ["M07"], "summary": "Audit if trading business turnover > Rs 1 Cr, or (44AD) turnover < 1 Cr but profit < 8% of turnover (unless total income below taxable limit). Trading turnover is not contract value.", "formula": {"delivery_turnover": "sell value (only if delivery trades declared as business)", "intraday_turnover": "sum of absolute profits and losses", "fno_turnover": "sum of absolute favourable/unfavourable differences + premium received on option sales"}, "facts": ["Trade-wise computation is most compliant; scrip-wise uses average prices.", "Presumptive scheme (ITR-4S, 44AD) - declare 8% of turnover as income to avoid audit (only non-speculative income; no expenses, no loss carry-forward).", "Due dates (source) - July 31 non-audit, Sept 30 audit; belated return within 1 yr of AY end with interest/penalty (Rs 5,000 u/s 271F); revised returns allowed if original filed on time."], "example": "Futures buy 8000 sell 7900 x25 -> turnover 2,500; options buy 20 sell 30 x100 -> 1,000 + premium 3,000 = 4,000.", "caveats": ["Thresholds changed (e.g. higher audit limits for mostly-digital receipts; ICAI guidance on F&O turnover revised in 2022) - verify."]}, {"id": "trader_books", "type": "Process", "name": "Trader's Balance Sheet, P&L and Books of Account", "modules": ["M07"], "summary": "Personal balance sheet (assets - liabilities = net worth), P&L (trading revenue minus trading expenses; salary excluded), and two books - bank book (annotated statements + bills) and trading book (broker P&L, ledger, contract notes); update quarterly."}, {"id": "itr_forms", "type": "Tax", "name": "ITR Forms", "modules": ["M07"], "summary": "(Source era) ITR-1 salary/interest/one house; ITR-2 adds capital gains (investors); ITR-4 adds business income (traders - F&O/intraday); ITR-4S presumptive. Filing is mandatory even if tax was paid via TDS; file losses on time to carry forward.", "caveats": ["Current mapping - business income is ITR-3", "presumptive is ITR-4 (Sugam)."]}, {"id": "module_m08", "type": "Module", "name": "M08 - Currency and Commodity Futures", "modules": ["M08"], "summary": "Currency history, forex market, pairs/quotes/pips, RBI reference rate and cross rates, macro drivers (trade deficit, rates, inflation, GDP, central bank stance), Brexit, carry trade and interest rate parity, USDINR/EURINR/GBPINR/JPYINR futures & options, calendar spreads, correlation, seasonality test, TA on currencies; MCX commodities - gold (London fix, import parity, drivers), silver, crude oil (2014-16 crash, value chain, WTI vs Brent, inventories, USD link, mini-big arbitrage), copper, aluminium, lead, nickel, agri (monsoons, cardamom, mentha), natural gas, Sumitomo and Amaranth lessons, commodity options (Black-76, CTM, devolvement). (Interest rate futures were announced but not covered.)", "caveats": ["Contract specs, lot sizes, margins and trading hours are from 2016-17 and change frequently (e.g. USDINR lot size, MCX contract variants, option expiries). Verify current exchange specs."]}, {"id": "currency_basics", "type": "Concept", "name": "Currency Market Basics (Forex)", "modules": ["M08"], "aliases": ["Forex", "FX"], "summary": "Currencies evolved from barter -> metal -> gold standard -> Bretton Woods (USD pegged to gold) -> floating market rates; forex trades ~$5.4T/day (2013 BIS), 24h x 6 days following the sun; participants include central banks, corporates (hedging), banks, travellers, traders.", "facts": ["Most active window when US", "UK", "Japan and Australia overlap; India's time zone overlaps Asia and Europe."]}, {"id": "currency_pair", "type": "Concept", "name": "Currency Pairs, Quotes and Pips", "modules": ["M08"], "aliases": ["Base currency", "Quote currency", "Pip", "Cable"], "summary": "Quoted as BASE/QUOTE = units of quote per 1 base; buying the pair = long base, short quote (dual view). Two-way quote bid/ask (e.g. EUR/USD 1.1269/70); a pip is the minimum move (USDINR 0.0025).", "formula": {"pnl": "lot_size * lots * points_moved", "pnl_per_tick": "(lot_size / quotation_unit) * tick_size"}, "facts": ["Pair up = base strengthens/quote weakens.", "GBP/USD is nicknamed 'Cable'."]}, {"id": "rbi_reference_rate", "type": "Process", "name": "RBI Reference Rate and Cross Rates", "modules": ["M08"], "summary": "RBI polls randomly selected contributing banks for USDINR two-way quotes daily (11:30-12:30) and averages them; EURINR/GBPINR/JPYINR are derived by crossing through USD. Currency futures settle on the reference rate.", "formula": {"eurinr_ask": "usdinr_ask * eurusd_ask"}, "example": "USDINR ask 67.0740 x EURUSD ask 1.1140 = EURINR 74.72.", "caveats": ["Reference rate is now published by FBIL", "not RBI - verify."]}, {"id": "currency_drivers", "type": "Concept", "name": "Fundamental Drivers of Currencies", "modules": ["M08"], "aliases": ["Hawkish", "Dovish", "Trade deficit", "Current account deficit"], "summary": "Pair moves on the dominant of two economies' factors - exports strengthen domestic currency, imports weaken it; narrowing trade deficit is positive; higher interest rates attract capital (carry) and strengthen currency; hawkish stance strengthens, dovish weakens; high inflation -> expected hawkishness -> stronger currency (per source); higher GDP growth -> stronger currency.", "facts": ["Major events (Brexit Jun 2016 - GBP -8.6%, 31-yr low) create extreme moves; uncertainty is what markets hate.", "'When in confusion, do nothing' is itself a good trade.", "FII inflows into Indian equities strengthen INR - USDINR and Nifty are inversely correlated (~-0.12, 2015)."], "caveats": ["Simplified textbook causality; relationships are unstable."]}, {"id": "interest_rate_parity", "type": "Formula", "name": "Interest Rate Parity, Forward Premia and the 'Fairy' Carry Trade", "modules": ["M08"], "summary": "Borrowing in a low-rate currency to invest in a high-rate one (carry trade) is neutralised by the forward rate; the higher-yielding currency trades at a forward discount.", "formula": {"forward": "S * (1 + r_quote * N) / (1 + r_base * N)", "approx": "S * (1 + (r_quote - r_base))"}, "example": "USDINR 67, INR 7%, USD 0.5% -> 1-yr forward ~71.33."}, {"id": "currency_futures_india", "type": "Contract", "name": "Indian Currency Derivatives (USDINR, EURINR, GBPINR, JPYINR)", "modules": ["M08"], "summary": "NSE/BSE currency futures quoted to 4 decimals, tick 0.0025; lot $1000 / EUR1000 / GBP1000 / JPY100000 (JPY quoted per 100 yen); margins ~2-4% (JPY highest); expiry 2 working days before month's last business day, trading till 12:30 on expiry; cash settled in INR at reference rate; USDINR options European, premium in INR, strikes at 0.25 intervals, 3 monthly expiries.", "facts": ["Currencies move in tight ranges, hence high leverage.", "Liquidity preference - USDINR futures > USDINR ATM options > GBPINR > EURINR > JPYINR futures.", "USDINR volatility far lower than Nifty (2015 annualised ~4.9% vs ~15.7%); daily SD 0.311% (2015).", "Retail cannot access USDINR spot, so spot-futures arbitrage is unavailable -> trade calendar spreads (exchange spread contracts exist)."], "example": "Short 10 lots USDINR 67.69 on 15m bearish marubozu, exit 67.60 -> 0.09 x 1000 x 10 = Rs 900; P&L per pip Rs 2.5/lot.", "caveats": ["Lot sizes", "cross-currency pairs (EURUSD etc.) and hours have changed since."]}, {"id": "futures_bull_bear_spread", "type": "Strategy", "name": "Futures Bull / Bear Calendar Spread (currency)", "modules": ["M08"], "summary": "Futures bull spread - long near, short far; bear spread - short near, long far; trade when the inter-month spread deviates from its normal level and exit on convergence; backtest the 'normal' spread first; use exchange spread contracts to reduce leg risk.", "example": "USDINR Jul 67.3075 / Aug 67.6900 spread 0.3825 vs believed normal 0.20 -> long Jul, short Aug, exit at <= 0.20."}, {"id": "correlation", "type": "Formula", "name": "Correlation", "modules": ["M08"], "summary": "-1..+1 measure of co-movement of two series; compute on returns (stationary) not prices (trending); says direction tendency, not magnitude.", "formula": {"corr": "CORREL(returns_a, returns_b)"}, "example": "Nifty vs USDINR -0.12 (2015); Gold vs Silver intraday 0.7, EOD ~0.8."}, {"id": "seasonality_test", "type": "Model", "name": "Seasonality Test (Holt-Winters) on USDINR", "modules": ["M08"], "summary": "Comparing Holt-Winters models with vs without seasonal component (chi-square on errors) found no weekly or monthly seasonality in USDINR - it behaves like a random walk; treat 'it always falls in December' claims as noise.", "bot_use": "Validate any calendar/seasonal edge statistically before trading it."}, {"id": "ta_on_currencies_commodities", "type": "Rule", "name": "TA Applies Equally to Currencies and Commodities", "modules": ["M08"], "summary": "Fundamental analysis of currencies/commodities is complex (two economies, global supply-demand), so price action/TA is the practical approach for short-term (2-3 day) trades; same patterns (piercing, marubozu, S&R, EMAs) apply.", "example": "Gold - long-term view from 2-yr chart (primary trend up, double bottom 2015); short-term entry above resistance 30956 (also 9/21 EMA), target 31418, SL 30700, RRR 1.8."}, {"id": "mcx_commodity_futures", "type": "Contract", "name": "MCX Commodity Futures (general rules)", "modules": ["M08"], "aliases": ["MCX", "NCDEX"], "summary": "MCX (metals, energy, some agri) and NCDEX (agri); prices include import duties/taxes; most contracts physically deliverable - intent to deliver must be given before tender period (brokers often force exit before); each contract maps to a designated spot delivery centre; trade the current/near month for liquidity; agri traded till 5 PM, no MIS for agri.", "formula": {"contract_value": "price * lot_size / quotation_unit", "pnl_per_tick": "(lot_size / quotation_unit) * tick_size"}, "facts": ["Gold (1 kg, quote per 10 g, tick Rs1 -> Rs100/tick, expiry 5th, bi-monthly), Gold Mini (100 g, Rs10/tick), Guinea, Petal (illiquid) - margins ~4-5%.", "Silver (30 kg, quote per kg, Rs30/tick, compulsory delivery), Silver Mini/Micro (cash-settle option) - margin ~5-6%.", "Crude oil (100 bbl, quote per bbl, Rs100/tick, expiry ~19th, 6 months listed, margin ~9% NRML / 4.5% MIS); Crude Mini (10 bbl, Rs10/tick); MCX crude tracks Brent (per source).", "Copper (1 MT, quote per kg, tick 0.05 -> Rs50, ~7.8%); Aluminium (5 MT, Rs250/tick, ~5.6%) and Mini (1 MT); Lead (5 MT, Rs250/tick, ~11.7%) and Mini; Nickel (250 kg, tick 0.10 -> Rs25, ~10%) and Mini (100 kg); base metals expire last day of month.", "Cardamom (100 kg, Rs10/tick, expiry 15th, ~10.5%); Mentha oil (360 kg, Rs36/tick, ~8.5%) - most liquid agri on MCX.", "Natural gas (1250 mmBtu, tick 0.10 -> Rs125, expiry 25th, ~15% NRML) - mirrors NYMEX."], "caveats": ["Specs as of 2016-17; MCX crude now references WTI-linked pricing and many specs changed - verify."]}, {"id": "gold_drivers", "type": "Concept", "name": "Gold - Pricing and Drivers", "modules": ["M08"], "aliases": ["London fix", "Bullion"], "summary": "International price set by London AM/PM fix (banks only); Indian price = international + CIF + customs duty + cess + bank costs, so MCX vs CME gold differences are not arbitrage. Gold is a safe haven - rises on uncertainty (e.g. Brexit), inversely related to the US dollar (not always), long-run ~8% CAGR in USD (1970-2016).", "formula": {"grams_per_troy_oz": "31.1035", "inr_per_10g_naive": "usd_per_oz / 3.11035 * usdinr (+ duties)"}}, {"id": "silver", "type": "Concept", "name": "Silver", "modules": ["M08"], "summary": "Precious + industrial metal (demand ~1170 mn oz, supply ~1040 mn oz - slight deficit); 'bullion twin' of gold (corr ~0.7 intraday, ~0.8 EOD) - candidate for gold-silver pair trading; weak correlation with crude."}, {"id": "crude_oil", "type": "Concept", "name": "Crude Oil - Drivers and Ecosystem", "modules": ["M08"], "aliases": ["Brent", "WTI", "OPEC"], "summary": "2014-16 crash ($110 -> $28) driven by US shale supply, OPEC failing to cut, China slowdown, and heavy shorts; oil-producer breakevens (Russia needs ~$105) and fiscal stress. Upstream (ONGC, Cairn, RIL, Oil India) benefits from high oil; downstream OMCs (BPCL, HPCL, IOC) benefit from low oil; midstream wants stability.", "bot_use": "Cross-asset signals - crude moves for OMC vs upstream stock pairs; EIA release event risk.", "facts": ["WTI (API 39.6, sulphur 0.26%) is lighter/sweeter than Brent (API ~38, 0.37%); Brent is the global benchmark.", "Weekly US EIA inventory - rising inventory bearish for oil/upstream; falling inventory bullish.", "Oil and the US dollar index are generally inversely related (not always).", "For India, low oil eases subsidy, fiscal deficit and inflation but can hurt exports to oil economies."]}, {"id": "crude_arbitrage", "type": "Strategy", "name": "Crude Big vs Mini Arbitrage", "modules": ["M08"], "summary": "Same underlying, different lot sizes - if prices diverge, buy the cheaper and sell the dearer in equal notional (10 minis vs 1 big) to lock the spread until convergence.", "example": "Crude 3221 vs Mini 3217 -> short 1 big, long 10 minis -> +4 pts regardless of convergence level."}, {"id": "base_metals", "type": "Concept", "name": "Base Metals (Copper, Aluminium, Lead, Nickel)", "modules": ["M08"], "summary": "Copper - 3rd most consumed metal, global-growth sensitive (China+Japan ~half of demand); aluminium - abundant, power-intensive (17.4 MWh/t), tracks LME; lead - stable supply-demand, range-bound, batteries; nickel - ~65% to stainless steel, oversupplied. Trade price action, not fundamentals, for short horizons."}, {"id": "agri_commodities", "type": "Concept", "name": "Agri Commodities and Monsoons", "modules": ["M08"], "aliases": ["Kharif", "Rabi"], "summary": "2/3 of Indian arable land is rain-fed; SW monsoon (Jun-Sep) -> Kharif crops (rice, pulses, cotton, cardamom); NE monsoon (Dec-Mar) -> Rabi crops (wheat, mustard). Track monsoon forecasts and sowing data before trading agri - author lost his account long pepper ahead of a bumper monsoon."}, {"id": "natural_gas", "type": "Concept", "name": "Natural Gas", "modules": ["M08"], "summary": "Methane-based fuel (power, heating, fertiliser); MCX contract mirrors NYMEX; drivers - US inventory data (up = bearish), harsh US winters and hurricanes (bullish), crude oil (historically correlated)."}, {"id": "commodity_risk_lessons", "type": "Rule", "name": "Commodity Blow-ups (Sumitomo copper, Amaranth natural gas)", "modules": ["M08"], "summary": "Sumitomo's Hamanaka cornered ~5% of world copper with leveraged LME longs; Chinese supply crashed prices -> ~$5bn loss (1995/96). Amaranth's Brian Hunter took leveraged nat-gas bets on weather, doubled down at 8:1 leverage after a 20% fall -> ~$6bn loss (2006). Lesson - risk management sits above all; never double down on leveraged losers."}, {"id": "commodity_options", "type": "Contract", "name": "Commodity Options (options on futures)", "modules": ["M08"], "aliases": ["Black 76", "CTM", "Devolvement"], "summary": "Underlying is the commodity futures contract; price with Black-76 (not Black-Scholes); European; on expiry ITM options devolve into futures at the strike. CTM = 2 strikes above/below ATM (by daily settlement price) - need explicit instruction to exercise else worthless; other ITM auto-exercise unless contrary instruction; devolvement margin collected in the days before expiry.", "formula": {"black76_call": "e^{-rT} [F N(d1) - K N(d2)], d1 = (ln(F/K) + sigma^2 T/2)/(sigma sqrt T)"}}, {"id": "module_m09", "type": "Module", "name": "M09 - Risk Management and Trading Psychology", "modules": ["M09"], "summary": "Systematic vs unsystematic risk, expected return, variance/covariance/correlation matrices, portfolio variance, equity curve, expected return ranges, portfolio optimisation and efficient frontier, Value at Risk/CVaR, gambler's fallacy, recovery trauma, equity estimation models, position sizing (unit per fixed amount, % margin, % volatility, % risk), Kelly criterion, and trading biases (illusion of control, recency, anchoring, functional fixedness, confirmation, attribution)."}, {"id": "risk_management", "type": "Concept", "name": "Risk Management (overview)", "modules": ["M09"], "summary": "Successful trading is ~80% money management, 20% strategy (Mark Douglas). Risk differs for single positions, multiple positions and portfolios; diversify to reduce unsystematic risk, hedge to reduce systematic risk; no position is ever 'safe'.", "example": "Satyam (Jan 2009) - company-specific fraud crashed the stock while the index fell far less - unsystematic risk."}, {"id": "expected_return", "type": "Formula", "name": "Expected Portfolio Return", "modules": ["M09"], "summary": "Weighted sum of asset expected returns; a probabilistic expectation, not a guarantee. Annualise daily mean x 252.", "formula": {"portfolio_er": "sum(w_i * R_i)", "annual_from_daily": "mean_daily_return * 252"}, "example": "50% Infy (20%) + 50% RIL (15%) -> 17.5%."}, {"id": "covariance_correlation_matrix", "type": "Formula", "name": "Variance, Covariance and Correlation Matrices", "modules": ["M09"], "summary": "Variance = dispersion of an asset's returns; covariance = co-movement sign of two assets; correlation = covariance / (sd_x sd_y). For k assets build the k x k variance-covariance matrix from the n x k excess-return matrix X, then the correlation matrix.", "formula": {"variance": "sum((x - mean)^2)/N", "covariance": "sum((r1 - mean1)(r2 - mean2)) / (n - 1)", "cov_matrix": "(1/n) * X^T X, X = returns - column means", "corr_matrix": "cov_matrix / (sd sd^T)"}, "facts": ["Diagonal of covariance matrix = variances; correlation matrix diagonal = 1, symmetric.", "Portfolio managers prefer low/negative covariance between holdings so they counterbalance."], "example": "Cipla vs Idea covariance 0.0000523, correlation 0.106."}, {"id": "portfolio_variance", "type": "Formula", "name": "Portfolio Variance (Risk)", "modules": ["M09"], "summary": "Portfolio volatility from weights, individual SDs and the correlation matrix; equivalently the SD of the portfolio's own daily returns (equity curve) - both give the same number.", "formula": {"weighted_sd": "w_i * sd_i", "portfolio_sd": "sqrt( wsd^T * Corr * wsd )", "annualised": "daily_portfolio_sd * sqrt(252)", "range_1sd": "E[R] +/- sd_annual (68%), 2sd 95%, 3sd 99.7%"}, "example": "5-stock portfolio (Cipla 7%, Idea 16%, Wonderla 25%, PVR 30%, Alkem 22%) daily sd 1.11% -> annual 17.64%; E[R] 55.14% -> 1SD range 37.5%-72.8%.", "caveats": ["Short look-back in a bull market biases expected returns upward; use >= 1 year of data."]}, {"id": "equity_curve", "type": "Concept", "name": "Equity Curve", "modules": ["M09"], "summary": "Portfolio value normalised to Rs 100 over time (each holding compounding its daily returns at its weight); visualises performance, benchmark against Nifty; SD of its daily returns = portfolio volatility.", "bot_use": "Core performance artefact for any strategy/portfolio; derive drawdown, volatility, Sharpe."}, {"id": "portfolio_optimization", "type": "Model", "name": "Portfolio Optimisation and Efficient Frontier", "modules": ["M09"], "aliases": ["Efficient frontier", "Minimum variance portfolio", "Markowitz"], "summary": "Varying weights changes risk and return. Solve (e.g. Excel Solver) for minimum-variance portfolio (min sd s.t. sum w = 1), and for each fixed risk level the max- and min-return portfolios; the upper envelope from the min-variance point is the efficient frontier - always choose portfolios on it.", "formula": {"min_variance": "min_w sqrt(w^T Sigma w) s.t. sum(w) = 1", "max_return_at_risk": "max_w w^T mu s.t. sum(w)=1, sqrt(w^T Sigma w) = target"}, "bot_use": "Allocate across strategies/assets on the efficient frontier given a risk budget.", "example": "Min-variance 15.57% risk / 36.25% return (Cipla raised 7% -> 29.6%); at 17% risk max return 55.87%, min 18.35%.", "caveats": ["Add no-short (w >= 0) constraints for long-only; optimisation is sensitive to estimated returns."]}, {"id": "value_at_risk", "type": "Formula", "name": "Value at Risk (VaR) and CVaR (historical)", "modules": ["M09"], "aliases": ["VaR", "CVaR", "Expected shortfall"], "summary": "Worst expected daily loss at a confidence level; historical method - check returns look normal (histogram), sort returns, VaR = worst value within best 95% of observations, CVaR = average of the worst 5%.", "formula": {"var_95": "5th percentile of daily portfolio returns", "cvar_95": "mean(returns <= var_95)"}, "bot_use": "Daily risk report and pre-trade risk limit (portfolio VaR <= budget).", "facts": ["Born after Black Monday (19 Oct 1987", "Dow -22.6%); JP Morgan's 4:15 PM report -> RiskMetrics."], "example": "126 daily returns -> VaR -1.48%, CVaR -2.39%."}, {"id": "gamblers_fallacy", "type": "Psychology", "name": "Gambler's Fallacy", "modules": ["M09"], "summary": "Believing a streak must end - increasing size after losses ('next one will win') or cutting size after wins; each independent trade has the same odds. Antidote - systematic position sizing.", "example": "Author lost 3 poker buy-ins chasing losses; with sizing discipline he lasted and won."}, {"id": "recovery_trauma", "type": "Formula", "name": "Recovery Trauma (drawdown recovery math)", "modules": ["M09"], "summary": "Gains needed to recover a loss grow non-linearly - small accounts that take big bets suffer most. Stay in the game ('if you lose all your chips you can't bet' - Larry Hite).", "formula": {"required_gain": "1/(1 - loss) - 1"}, "bot_use": "Hard max-drawdown circuit breakers; reduce size during drawdowns.", "example": "-5% needs +5.3%; -10% needs +11.1%; -50% needs +100%; -60% needs +150%."}, {"id": "equity_estimation_models", "type": "Rule", "name": "Equity Estimation Models (Van Tharp)", "modules": ["M09"], "summary": "Core equity - subtract capital allocated to open trades (conservative); total equity - cash + margins blocked + open P&L (risky, counts unrealised); reduced total equity (author's preference) - core equity plus only locked-in profits (via trailing stops).", "example": "5L capital, 20% rule, ACC long blocks 90k -> next trade 20% of 4.1L = 82k; ACC +50 pts, stop trailed to lock 10k -> 20% of 4.2L = 84k."}, {"id": "position_sizing", "type": "Rule", "name": "Position Sizing Techniques", "modules": ["M09"], "summary": "Decide how much capital/risk each trade gets. Methods - unit per fixed amount (e.g. 1 lot per 1L - simple, ignores risk, doesn't scale); percentage margin (fixed % of equity as margin per trade); percentage volatility (cap ATR-based volatility per position, e.g. 2% of equity); percentage risk (cap loss-at-stop at 1-3% of equity). Combine one equity model with one or two sizing methods.", "formula": {"pct_volatility_shares": "(equity * vol_pct) / ATR", "pct_risk_qty": "(equity * risk_pct) / (abs(entry - stop) * lot_size)  [lots]", "classic_5pct_rule": "max exposure per trade = 5% of capital"}, "params": {"risk_per_trade_pct": [1, 3], "author_example_pct": 1.5, "vol_pct": 2}, "bot_use": "Mandatory sizing layer between signal and order - default to % risk with ATR/volatility stops, reduced-total-equity accounting.", "facts": ["Professional traders rarely risk > 1-3% per trade.", "Think about total portfolio volatility exposure (e.g. 15% of capital on a bad day - does it churn your stomach?)."], "example": "PEL ATR 76, equity 5L, 2% vol -> 10,000/76 = 131 shares; Tata Motors long 393.65 SL 390 lot 1500, 1.5% of 5L = 7,500 / 5,475 per lot -> 1 lot."}, {"id": "kelly_criterion", "type": "Formula", "name": "Kelly Criterion (and capped Kelly)", "modules": ["M09"], "summary": "Optimal bet fraction from win rate and win/loss ratio; author scales a capped risk budget by Kelly% rather than betting full Kelly.", "formula": {"kelly_pct": "W - (1 - W)/R", "W": "winning trades / total trades", "R": "average win / average loss", "capped": "risk_this_trade = kelly_pct * max_risk_pct (e.g. 5%)"}, "bot_use": "Scale per-trade risk by rolling backtest/live Kelly, capped.", "example": "W 0.6, avg win 4532, avg loss 3274 -> R 1.384 -> Kelly ~31%; with 5% cap -> risk ~1.55% of capital.", "caveats": ["Full Kelly is too aggressive - a 70% Kelly still leaves a large chance of a huge loss; estimates of W and R are noisy."]}, {"id": "trading_biases", "type": "Psychology", "name": "Trading and Investing Biases", "modules": ["M09"], "summary": "Biases are what stand between you and a profitable P&L. Forgotten investments (MRF shares held 25 yrs -> Rs 128 Cr) show how attention + bias leads to early selling."}, {"id": "illusion_of_control", "type": "Psychology", "name": "Illusion of Control", "modules": ["M09"], "summary": "Cluttering charts with many indicators creates false certainty; no analysis controls outcomes. Keep analysis simple and focus on statistics/odds."}, {"id": "recency_bias",
